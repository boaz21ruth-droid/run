H.laterejectok = function(excId){
  var txn = ($("txn") && $("txn").value.trim()) || "";
  var rs  = ($("rs")  && $("rs").value.trim())  || "";
  if(!txn){ toast("银行流水号必填（强制审计）。", "bad"); return; }
  if(!rs){ toast("拒绝原因必填。", "bad"); return; }
  var e = DB.exceptions.filter(function(x){ return x.id === excId; })[0];
  if(e.status !== "OPEN"){ closeModal(); toast("<b>接口拒绝</b>：该异常已不是 OPEN。", "bad"); return; }
  var o = findOrder(e.orderId);
  var pp = o.participants[0];
  if(DB.refunds.some(function(r){ return r.opId === pp.id && (r.status === "REQUESTED" || r.status === "APPROVED"); })){
    closeModal(); toast("<b>接口拒绝</b>：该参赛人已有进行中的退款（D-012）。", "bad"); return;
  }
  var orderBefore = o.status, regBefore = pp.regStatus + "(" + (pp.cancelReason || "-") + ")";
  e.status = "CLOSED"; e.txn = txn; e.rejectedBy = state.staff; e.rejectedAt = now(); e.rejectReason = rs;
  var id = nextRefundId("RF-");
  DB.refunds.push({
    id:id, orderId:o.id, opId:pp.id, kind:"PARTICIPANT_CANCEL", type:"STANDARD",
    requestedAmount:e.amount,
    /* origin 只是 Demo 的展示标注，用来说明这条退款是从哪个入口来的；
       它不是冻结的业务枚举，也不改变这条退款走的流程。 */
    origin:"LATE_ARRIVAL_REJECT",
    amount:e.amount, status:"REQUESTED", by:state.staff, at:now(),
    reason:"LATE_ARRIVAL 拒绝 · " + rs + "（流水 " + txn + "）"
  });
  /* Order 与 Registration 一个字符都不改 —— 这正是 D-031 R2 的要求 */
  var orderAfter = o.status, regAfter = pp.regStatus + "(" + (pp.cancelReason || "-") + ")";
  closeModal();
  act("LATE_ARRIVAL 拒绝并启动退款",
      e.orderId + " · 迟到到账 " + money(e.amount) + " · 流水 " + txn + " · 原因：" + rs +
      " · <b>新建 Participant 级 Refund " + id + " → REQUESTED</b>（钱尚未退出）" +
      " · Order " + orderBefore + " → " + orderAfter + "（未变）" +
      " · Registration " + regBefore + " → " + regAfter + "（未变）" +
      " · 名额与 quota 保持订单过期时已释放的状态，不再释放第二次" +
      " · 后续走 REQUESTED → APPROVED → SETTLED",
      "已拒绝迟到到账，并创建退款申请 <b>" + id + "（REQUESTED）</b>。<br>" +
      "<b>钱还没有退出去</b>——请到 Registrations &amp; Orders 走审批与结算。", "warn");
};
H.lateok = function(excId){
  var e = DB.exceptions.filter(function(x){ return x.id === excId; })[0];
  var o = findOrder(e.orderId);
  /* ⚖️ D-097 F-002 补扫 · 恢复报名 = 重新占名额 + 重新消配额，因此判定必须
     和新报名走<b>同一套</b>不变量：逐个待恢复参赛人、各自命中的那一档，
     同组别 / 同档位的多人还要累计算。不能再「随便找一档还有余量的」。 */
  var v = RD.validateExpiredRestore(o.id);
  var rows = v.rows.map(function(r){
    return "<div style='margin:.25rem 0'>" + esc(RD.holderOf(r.p)) + " · " + esc(r.p.regId) + "<br>" +
      "<span class='mut'>组别 " + esc((r.cat && r.cat.name) || r.p.cat) + " 名额 " +
      (r.cat ? r.cat.used + "/" + r.cat.cap : "—") + "</span> " +
      (r.capOk ? "<span class='tag t-ok'>通过</span>" : "<span class='tag t-bad'>不通过</span>") + " · " +
      "<span class='mut'>价格档 " + esc((r.rule && r.rule.name) || "缺失") +
      (r.rule && r.rule.quota != null ? " 配额 " + r.rule.used + "/" + r.rule.quota : "") + "</span> " +
      (r.quotaOk ? "<span class='tag t-ok'>通过</span>" : "<span class='tag t-bad'>不通过</span>") +
      (r.ok ? "" : "<br><span class='bad'>" + esc(r.why) + "</span>") + "</div>";
  }).join("");
  openModal(
    "<h3>LATE_ARRIVAL · 接受迟到到账</h3>" +
    "<p class='mut'>" + esc(o.id) + " · 订单已于 <b>" + esc(o.expiredAt || "—") + "</b> 过期<br>" +
    "当前 Order = <span class='tag t-bad'>EXPIRED</span> · Registration = <span class='tag t-bad'>CANCELLED(ORDER_EXPIRED)</span></p>" +
    '<div class="note badnote"><b>这是全系统唯一一条逆向恢复路径</b>（<code>Order: EXPIRED → PAID</code>），' +
    "只允许由 <code>LATE_ARRIVAL_ACCEPT</code> 触发。恢复 = <b>重新占用名额并重新消耗该参赛人当初命中的那一档配额</b>，" +
    "因此<b>每一位</b>待恢复参赛人的名额与配额都必须有余量：<br>" + rows +
    "<b>任一行不满足就不得接受，只能走拒绝分支把钱退回去。</b><br>" +
    "<span class='mut'>下面这个结论不是权威：点确认时会用<b>当时</b>的状态重新校验一遍。</span></div>" +
    "<p style='margin:.7rem 0 .25rem'>银行流水号（强制审计）</p><input type='text' id='txn' style='width:100%' value='" + esc(e.txn) + "'>" +
    "<p style='margin:.7rem 0 .25rem'>裁决依据（必填）</p><input type='text' id='rs' style='width:100%' placeholder='例：银行确认到账时间早于人工核对，同意恢复'>" +
    "<div class='acts'><button class='btn' data-close>取消</button>" +
    (v.ok
      ? "<button class='btn pri' data-h='lateokok:" + excId + "'>校验通过 · 接受并恢复报名</button>"
      : "<button class='btn' disabled title='capacity 或 quota 校验不通过'>无法接受（校验未通过）</button>") +
    "</div>"
  );
};
H.lateokok = function(excId){
  var rs  = ($("rs")  && $("rs").value.trim())  || "";
  var txn = ($("txn") && $("txn").value.trim()) || "";
  if(!rs || !txn){ toast("银行流水号与裁决依据都必填（强制审计）。", "bad"); return; }
  var e = DB.exceptions.filter(function(x){ return x.id === excId; })[0];
  var o = findOrder(e.orderId);
  var before = o.status + " / " + o.participants.map(function(p){ return p.regStatus + "(" + (p.cancelReason||"-") + ")"; }).join(",");
  /* ⚖️ D-097 F-002 补扫 · 弹窗上的校验结论不是权威：真正写之前用<b>当前</b>
     状态重跑一遍。另一个标签页可能刚把最后一个名额 / 最后一档配额用掉。 */
  var res = RD.restoreExpiredRegistrations(o.id, merchActor());
  if(!res.ok){
    closeModal();
    toast("<b>接口拒绝</b>：名额或价格档配额在这期间已经被用掉 —— " + res.msg +
          "<br><span class='mut'>此刻没有恢复任何报名，订单仍是 EXPIRED，钱也没有动。" +
          "只能走拒绝分支把这笔钱退回去。</span>", "bad");
    return;
  }
  e.status = "CLOSED";
  var n2 = res.rows.length;
  /* ⚖️ D-098 B3 · 这里<b>不再</b>手工往领物名单里 push 一行。
     名单一律派生自共享 Registration：报名恢复成 CONFIRMED，它自然就在名单里了。
     名单的存在与否不能取决于走了哪条代码路径。 */
  o.participants.forEach(function(p){
    if(p.regStatus === "PENDING"){ p.regStatus = "CONFIRMED"; n2++; }
  });
  var after = o.status + " / " + o.participants.map(function(p){ return p.regStatus; }).join(",");
  closeModal();
  act("LATE_ARRIVAL 接受", e.orderId + " · 迟到到账 " + money(e.amount) + " · 流水 " + txn + " · 依据：" + rs +
      " · <b>执行那一刻</b>逐个参赛人重跑 capacity 与其<b>当初命中的</b> PriceRule quota 双校验并通过" +
      " · 恢复 " + n2 + " 条报名 · 名额与配额各重新占用一次：" + res.moves.join("；") +
      " · [" + before + "] → [" + after + "]" +
      " · <b>Order: EXPIRED → PAID 是唯一逆向恢复路径，强制审计</b>",
      "已接受迟到到账：" + o.id + " EXPIRED → PAID，" + n2 + " 条报名从 CANCELLED(ORDER_EXPIRED) 恢复为 CONFIRMED");
};

/* --- Race Pack --- */
/* ⚖️ D-098 根 B · 名单派生自共享 Registration；这里只按 regId 取<b>运营事实</b>。
   取不到就现建一条空的 —— 事实的有无不再决定这个人存不存在。 */
function packFact(regId){ return RD.racePackFactEnsure(regId); }
/* 当前领物行 = 共享域派生的名单行 + 挂靠的运营事实。当前事实永远赢。 */
function packRow(regId){
  var r = RD.racePackRow(regId);
  if(!r) return null;
  var f = RD.racePackFact(regId) || { picked:false, idVerified:false };
  return { d:r, f:f,
           name:r.name, bib:r.bib, cat:r.catName, regId:regId,
           localPrice:r.localPrice, idVerified:!!f.idVerified,
           picked:!!f.picked, pickedAt:f.pickedAt || null, pickedBy:f.pickedBy || null,
           eligible:r.eligible, blocked:r.blocked, why:r.why, openRefund:r.openRefund };
}
function packBib(r){ return r.bib || "待分配"; }

H.verify = function(regId){
  /* ⚖️ D-100 B3 · 核验只有一份共享事实，现场工作台看到的就是这一份 */
  var res = RD.verifyRacePackId(regId, merchActor());
  if(!res.ok){ toast("<b>接口拒绝</b>：" + esc(res.why || "核验失败"), "bad"); return; }
  act("证件核验", res.row.name + " · Bib " + (res.row.bib || "待分配") +
      " · 本地价证件核验通过（只核验匹配与否，不留存证件号原值）· <b>现场工作台立即可见</b>",
      "已核验：" + res.row.name);
};
H.issue = function(regId){
  /* 硬拦截同样要写在处理器里，不能只靠视图不渲染按钮 —— 「接口也必须拒绝」（D-016）。
     ⚖️ D-100 B2 · 发包走<b>共享域唯一写入口</b>：它自己会按当前事实重跑资格
     （报名状态 / 进行中退款 / 是否已领 / 本地价核验），现场工作台走的是同一个。 */
  var res = RD.issueRacePack(regId, merchActor());
  if(!res.ok){
    toast("<b>接口拒绝发包</b>：" + esc(res.why) +
          "<br><span class='mut'>没有主管 Override；" +
          (res.blocked === "REFUND"
            ? "只能先由 FINANCE 撤销 / 拒绝该退款，之后重新跑一次领物资格校验（D-016）。"
            : res.blocked === "PICKED" ? "同一份领物事实只允许一次发放。"
            : "该报名当前不满足领物资格。") + "</span>", "bad");
    return;
  }
  act("Race Pack 发包", res.row.name + " · Bib " + (res.row.bib || "待分配") +
      " · 写入 packet_picked_up_at=" + res.fact.pickedAt +
      " · 领物是独立时间戳字段，Registration 状态不变 · <b>现场工作台立即看到已领</b>",
      "已发包：" + res.row.name + " · Bib " + (res.row.bib || "待分配"));
};
H.undopack = function(regId){
  var r = packRow(regId);

  openModal(
    "<h3>撤销领物误操作</h3>" +

    "<p style='margin:.7rem 0 .25rem'>撤销原因（必填）</p><input type='text' id='ur' style='width:100%' placeholder='例：扫错人 / 重复发放'>" +
    "<div class='acts'><button class='btn' data-close>取消</button>" +
    "<button class='btn danger' data-h='undopackok:" + regId + "'>确认撤销</button></div>"
  );
};
H.undopackok = function(regId){
  var reason = ($("ur") && $("ur").value.trim()) || "";
  if(!reason){ toast("撤销原因必填。", "bad"); return; }
  var r = packRow(regId);
  if(!r){ closeModal(); toast("<b>接口拒绝</b>：找不到该报名。", "bad"); return; }

  var res = RD.undoRacePack(regId, merchActor(), reason);

};

  if(c.decided){ toast("该票据已裁决过。", "warn"); return; }

  var others = c.devices.filter(function(x){ return x.id !== devId; });
  openModal(
    "<h3>裁决离线回传冲突 · " + esc(ticket) + "</h3>" +
    "<p class='mut'>" + pii(c.name) + " · Bib <code>" + esc(c.bib) + "</code> · 共 " + c.devices.length + " 条设备记录</p>" +
    impact("以 " + esc(d.id) + " 为准",
      ["<code>" + esc(d.id) + "</code>（" + esc(d.device) + " · " + esc(d.at) + " · " + esc(d.by) + "）成为<b>唯一生效</b>的履约结果",

    "<input type='text' id='rs' style='width:100%' placeholder='例：TAB-01 的时间与现场签名单一致，TAB-03 是同一人重复扫码'>" +
    "<div class='acts'><button class='btn' data-close>取消</button>" +
    "<button class='btn pri' data-h='ocpickok:" + ticket + ":" + devId + "'>确认以这条为准</button></div>"

H.ocpickok = function(ticket, devId){
  var rs = ($("rs") && $("rs").value.trim()) || "";
  if(!rs){ toast("裁决依据必填。", "bad"); return; }
  var c = DB.offlineConflicts.filter(function(x){ return x.ticket === ticket; })[0];
  if(!c || c.decided){ closeModal(); toast("<b>接口拒绝</b>：该票据已被裁决。", "bad"); return; }
  var d = c.devices.filter(function(x){ return x.id === devId; })[0];
  c.decided = true; c.keptDeviceId = devId; c.decidedBy = state.staff; c.decidedAt = now(); c.decidedReason = rs;

      "票据 " + ticket + " · 参与冲突的设备：" +
      c.devices.map(function(x){ return x.id + "(" + x.device + " · " + x.at + " · " + x.by + " · " + x.mode + ")"; }).join(" / ") +
      " · <b>保留 " + devId + " 为生效履约结果</b>，其余标「冲突已裁决」且原样保留" +
      " · 依据：" + rs + " · 裁决人 " + state.staff,
      "已裁决 " + ticket + "：以 <b>" + devId + "</b> 为准。<b>其余设备记录一条都没删。</b>");
};

/* --- D-043 ~ D-045 · 活动内容 ---
   状态机只有这四个状态、六条边，一个都不多：
     ∅ → DRAFT
     DRAFT → PUBLISHED
     PUBLISHED ⇄ UNPUBLISHED
     PUBLISHED ⇄ FROZEN
   编辑永远是 X → X，绝不改状态（尤其：编辑 FROZEN 不解冻）。 */
function contentGuard(c, allowed, what){
  if(!c){ toast("找不到该内容。", "bad"); return false; }
  if(allowed.indexOf(c.status) < 0){
    toast("<b>接口拒绝</b>：「" + esc(what) + "」只允许 <b>" + allowed.join(" / ") +
          "</b>，当前是 <b>" + esc(c.status) + "</b>。", "bad");
    return false;
  }
  return true;
}
function contentFormFields(c){
  c = c || {};
  return "<p style='margin:.7rem 0 .25rem'>标题（必填）</p>" +
    "<input type='text' id='ctitle' style='width:100%' value='" + esc(c.title || "") + "'>" +
    "<p style='margin:.7rem 0 .25rem'>公开摘要（必填 · 用户在列表里看到的就是这一句）</p>" +
    "<input type='text' id='csum' style='width:100%' value='" + esc(c.summary || "") + "'>" +
    "<p style='margin:.7rem 0 .25rem'>正文</p>" +
    "<input type='text' id='cbody' style='width:100%' value='" + esc(c.body || "") + "'>" +
    "<p style='margin:.7rem 0 .25rem'>参与入口文案（CTA）</p>" +
    "<input type='text' id='ccta' style='width:100%' value='" + esc(c.cta || "") + "'>";
}

H.ceditok = function(id){
  var c = findContent(id);
  if(!contentGuard(c, ["DRAFT","PUBLISHED","FROZEN"], "编辑")) return;
  var t = ($("ctitle") && $("ctitle").value.trim()) || "";
  var sm = ($("csum") && $("csum").value.trim()) || "";
  if(!t || !sm){ toast("标题与公开摘要都必填。", "bad"); return; }
  var before = { title:c.title, summary:c.summary, body:c.body, cta:c.cta };
  var after = {
    title:t, summary:sm,
    body:(($("cbody") && $("cbody").value.trim()) || ""),
    cta:(($("ccta") && $("ccta").value.trim()) || c.cta)
  };
  var stBefore = c.status;
  var changed = Object.keys(after).filter(function(k){ return before[k] !== after[k]; });
  c.title = after.title; c.summary = after.summary; c.body = after.body; c.cta = after.cta;
  c.lastBy = state.staff; c.lastAt = now(); c.editCount = (c.editCount || 0) + 1;
  /* 状态一个字符都不动 —— 尤其 FROZEN 不会因为编辑而解冻 */
  c.status = stBefore;
  closeModal();
  act("编辑活动内容",
      id + " · 状态 " + stBefore + " → " + c.status + "（未变）" +
      " · 改动字段：" + (changed.length ? changed.join("、") : "无") +
      " · 改前 " + JSON.stringify(before) + " → 改后 " + JSON.stringify(after) +
      (stBefore === "PUBLISHED" ? " · <b>用户侧公开内容已立即变化</b>" : "") +
      (stBefore === "FROZEN" ? " · <b>仍处于冻结中，编辑不解冻</b>" : ""),
      "已保存 " + id + "。" +

H.supsettleok = function(rfId){
  var r = DB.refunds.filter(function(x){ return x.id === rfId; })[0];
  /* ---- 改动任何业务状态之前的守卫（F-003 / F-004）---- */
  if(!guardSupplemental(r, "补退结算")) return;
  if(r.status !== "APPROVED"){ toast("<b>接口拒绝</b>：只有 APPROVED 的补退可以结算。", "bad"); return; }
  if(parseSettleAmount(r.amount) === null){
    toast("<b>拒绝结算</b>：补退金额不是有效正数，未改动任何业务状态。", "bad"); return;
  }
  var proof = ($("proof") && $("proof").value.trim()) || "";
  if(!proof){ toast("补打凭证号必填。", "bad"); return; }

H.prepayok = function(orderId){
  var o = findOrder(orderId);
  /* ⚖️ D-109 R9 · <b>先问截止时刻，再问取消原因。</b>
     取消原因是「人工取消」这个动作的必填项；<b>过期不是人工取消</b>，
     它是时间到了自然发生的事，不该因为运营没填原因就办不成。
     以前这里第一行就是「原因必填」并 return，于是一张旧弹窗 + 空原因，
     那张早该过期的单永远走不到结算，名额继续被占着。
     ⚖️ D-108 Rule 3 · 同样地，截止时刻也要在 D-022 之前问：
     D-022 拦的是「有待裁支付异常时不许<b>人工取消</b>」，
     D-022 拦的是「有待裁支付异常时不许<b>人工取消</b>」，
     它<b>不</b>等于「有异常这张单就可以永远停在 PENDING_PAYMENT」。
     那张异常单原样不动，钱的事仍由财务按既有流程处理。 */
  var late = RD.settleIfPastDeadline(o, { who:"system", role:"SYSTEM" });
  if(late && late.expired){
    RD.save();
    closeModal();
    toast("<b>这张单已经过期，不是被你取消的</b>：付款窗口已于 <b>" + esc(o.deadline || "—") +
          "</b> 截止，已按既有语义过期：名额与配额恰好一次放回公共池，报名 → CANCELLED(<b>ORDER_EXPIRED</b>)。" +
          "<br><span class='mut'>没有写「付款前取消」的成功 Audit；过期本身已由共享域记在流水里。" +
          "若这张单上有待裁的支付异常，它<b>原样保留</b>，仍由财务按既有流程处理。</span>", "warn");
    syncFromDomain();
    render();
    return;
  }
  /* 未过期，才轮到 D-022 的其余闸门（已到账 / 待裁支付异常） */
  var why = prepayBlockReason(o, true);
  if(why){ closeModal(); toast("<b>接口拒绝（D-022）</b>：" + esc(why), "bad"); return; }
  /* 到这里才是真的要做「人工取消」——原因是这个动作的必填项 */
  var rs = ($("rs") && $("rs").value.trim()) || "";
  if(!rs){ toast("取消原因必填。", "bad"); return; }
  /* ⚖️ D-106 FQA-001 · 走共享域<b>唯一</b>的付款前取消入口：
     它自己在执行那一刻重新校验，并以订单的预留事实为 exactly-once 锚点
     真的把名额与配额放回公共池。以前这里只改状态，却在 Audit 里声称释放了。 */
  var res = RD.cancelRegistrationOrderBeforePayment(orderId, merchActor(), rs);
  /* ⚖️ D-107 Rule 6 · 「已经过期」和「什么都没发生」是两回事，不能混着说。
     过期那一路<b>确实</b>改了业务状态（订单 → EXPIRED、预留放回公共池），
     只是它<b>不是</b>人工取消 —— 所以这里既不能写人工取消的成功 Audit，
     也不能对着用户说「此刻没有改动任何业务状态」。那同样是句假话。
     过期本身的 Audit 由共享域的过期原语写，这里不重复记一条。 */
  if(res.expired){
    closeModal();
    toast("<b>这张单已经过期，不是被你取消的</b>：" + String(res.msg) +
          "<br><span class='mut'>没有写「付款前取消」的成功 Audit；" +
          "过期这件事本身已由共享域记在流水里。</span>", "warn");
    render();
    return;
  }
  if(!res.ok){
    closeModal();
    toast("<b>接口拒绝</b>：" + String(res.msg || "付款前取消失败") +
          "<br><span class='mut'>此刻没有改动任何业务状态，也没有写任何成功 Audit。</span>", "bad");
    return;
  }
  closeModal();
  if(res.already){
    toast("该订单此前已经取消过，本次<b>没有</b>第二次释放名额。", "warn");
    render();
    return;
  }
  /* Audit 只报<b>真的发生过</b>的效果：数量与前后值都来自共享域的返回结果 */
  act("付款前取消订单", orderId + " · 原因：" + rs + " · 发起方 " + state.role +
      " · 连带取消 " + res.cancelledRegs + " 条待付款报名（ORDER_CANCELLED）" +
      " · 名额与价格档恰好一次放回公共池：" + res.moves.join("；") +
      " · 不产生退款（钱从来没收到过）",
      "已取消 " + orderId + "，" + res.cancelledRegs + " 条报名的名额与配额已放回公共池", "warn");
};

        " · enabled=false · <b>该人立即失去该赛事的数据访问</b>（有效期字段保留，便于追溯原窗口 " +
        (a.from || "—") + " → " + (a.until || "—") + "）",
        "已撤销 " + a.staff + " 对 " + a.eventId + " 的指派", "warn");
    return;
  }

  /* 启用：D-019 要求必须有时间窗，没有窗就不是一个合法指派 */
  var defFrom = a.from || (ev ? ev.date : state.today);
  var defUntil = a.until || (ev ? ev.date : state.today);
  openModal(
    "<h3>启用赛事指派</h3>" +
    "<p class='mut'><code>" + esc(a.staff) + "</code> · " + esc(a.role) + " · " + esc(ev ? ev.name : a.eventId) + "</p>" +
    '<div class="note"><b>D-019：指派必须带有效期。</b>权限判定要三条同时成立——角色匹配 ＋ 该赛事被指派 ＋ ' +
    "当前时间落在 <code>[valid_from, valid_until]</code> 内。<b>到期自动失效，不靠人工记得来删。</b><br>" +
    "当前演示日期：<b>" + esc(state.today) + "</b>。窗口不覆盖这一天的话，启用之后此人依然看不到数据。</div>" +
    "<p style='margin:.7rem 0 .25rem'>valid_from</p><input type='text' id='vf' style='width:100%' value='" + esc(defFrom) + "' placeholder='YYYY-MM-DD'>" +
    "<p style='margin:.7rem 0 .25rem'>valid_until</p><input type='text' id='vu' style='width:100%' value='" + esc(defUntil) + "' placeholder='YYYY-MM-DD'>" +
    "<div class='acts'><button class='btn' data-close>取消</button>" +
    "<button class='btn pri' data-h='asgok:" + id + "'>启用</button></div>"
  );
};
H.asgok = function(id){
  var vf = ($("vf") && $("vf").value.trim()) || "";
  var vu = ($("vu") && $("vu").value.trim()) || "";
  if(!/^\d{4}-\d{2}-\d{2}$/.test(vf) || !/^\d{4}-\d{2}-\d{2}$/.test(vu)){
    toast("有效期必须是 YYYY-MM-DD，且两项都要填。", "bad"); return;
  }
  if(vu < vf){ toast("valid_until 不能早于 valid_from。", "bad"); return; }
  var a = DB.assignments.filter(function(x){ return x.id === id; })[0];
  a.enabled = true; a.from = vf; a.until = vu;
  var live = assignmentActive(a);
  closeModal();
  act("启用赛事指派",
      a.staff + " · " + a.role + " · " + a.eventId + " · enabled=true · 有效期 " + vf + " → " + vu +
      " · 按演示日期 " + state.today + " 判定：" + (live ? "生效中" : "<b>尚未生效 / 已过期</b>"),
      "已启用 " + a.staff + " 对 " + a.eventId + " 的指派 —— 按当前演示日期 " +
      (live ? "<b>已生效</b>" : "<b>仍不在有效期内，此人看不到数据</b>"),
      live ? "" : "warn");
};

/* 赛事的转让配置（Demo 表示，不冻结模型）。 */
/* 转让开关与转让截止日是<b>赛事级配置</b>（Demo 表示，不冻结模型）。
   EV-A 的截止日设在赛事日当天：一期转让由 OPS 在服务台办理，赛事日当天仍可办。
   EV-B 整场未开启转让 —— 用来看清「未开启」和「已过期」是两条不同的拒绝理由。 */
var TRANSFER_CFG = { "EV-A": { enabled:true, deadline:"2026-11-15" }, "EV-B": { enabled:false, deadline:null } };

/* 比赛当天年龄 —— 组别硬性资格用它判定。日期取该赛事的比赛日。 */
function ageOnRaceDay(evId, dob){
  var ev = findEvent(evId);
  if(!ev || !dob) return null;
  var d = new Date(dob + "T00:00:00"), r = new Date(ev.date + "T00:00:00");
  if(isNaN(d.getTime()) || isNaN(r.getTime())) return null;
  var a = r.getFullYear() - d.getFullYear();
  var m = r.getMonth() - d.getMonth();
  if(m < 0 || (m === 0 && r.getDate() < d.getDate())) a--;
  return a;
}
function regEditableFields(){
  return [
    ["holder", "姓名拼写", "text", false],
    ["phone",  "联系电话", "text", false],
    ["dob",    "出生日期", "date", true],
    ["gender", "性别",     "sel",  true],
    ["nation", "国籍",     "text", false],
    ["size",   "Race Pack T 恤尺码", "text", false]
  ];
}
/* 高影响字段：DOB / 性别会影响资格、成绩分组与排名。
   如果这个号码布已经出现在<b>已发布</b>的成绩批次里，普通修改必须阻断。 */
function publishedResultBlock(p){
  var bib = RD.currentBib(p.regId) || p.bib;
  if(!bib) return null;
  var pub = DB.resultBatches.filter(function(b){
    return b.status === "PUBLISHED" && (b.bibs || []).indexOf(bib) >= 0;
  });
  if(!pub.length) return null;
  return "该参赛人的号码布 <code>" + esc(bib) + "</code> 已经出现在<b>已发布</b>的成绩批次 " +
         pub.map(function(x){ return "<code>" + esc(x.id) + "</code>"; }).join("、") +
         " 里。出生日期 / 性别会改变<b>年龄组与性别组的分组与排名</b>——" +
         "普通「修改参赛资料」<b>不允许</b>悄悄改写一份已经公开的成绩。要改必须先走成绩撤回（Results · 撤回发布），再重新发布。";
}
function transferBlock(o, p){
  var cfg = TRANSFER_CFG[o.eventId] || { enabled:false, deadline:null };
  if(!cfg.enabled) return "本场赛事<b>未开启参赛人转让</b>（Event 级开关）。";
  if(cfg.deadline && state.today > cfg.deadline){
    return "已过<b>转让截止日</b>（" + esc(cfg.deadline) + "），当前演示日期 " + esc(state.today) + "。";
  }
  if(p.regStatus !== "CONFIRMED"){
    return "该 Registration 当前是 <code>" + esc(p.regStatus) + "(" + esc(p.cancelReason || "-") +
           ")</code>，<b>已经不是一个有效的可转让参赛资格</b>。";
  }
  var openRf = RD.openRefundOf(p.id);
  if(openRf) return "存在<b>进行中的退款</b>（" + esc(openRf.id) + " · " + esc(openRf.status) + "）。钱还没定下来之前不转让参赛资格。";
  /* ⚖️ D-100 B7 · 转让闸门读的必须是<b>共享</b>领物事实：
     现场工作台刚发完包，后台这一刻就该拦住转让。 */
  var pack = RD.racePackFact(p.regId);
  if(pack && pack.picked) return "<b>Race Pack 已领取</b>（" + esc(pack.pickedAt || "—") + "）。东西已经拿走了，参赛身份不再转让。";
  var bib = RD.currentBib(p.regId) || p.bib;
  var facts = bib ? bibResultFacts(bib) : [];
  if(facts.length){
    return "号码布 <code>" + esc(bib) + "</code> 已产生<b>成绩事实</b>（" +
           facts.map(function(x){ return esc(x.id); }).join("、") + "）。<b>已经跑完的比赛身份不能被搬走。</b>";
  }
  return null;
}

H.peditok = function(opId){
  var f = findOP(opId);
  if(!f){ closeModal(); toast("找不到该参赛人。", "bad"); return; }
  var p = f.p, r = p.reg;
  var reason = ($("e_reason") && $("e_reason").value.trim()) || "";
  if(!reason){ toast("修改原因必填（D-092 §6 留痕要求）。", "bad"); return; }
  var hiBlock = publishedResultBlock(p);
  var next = {
    holder: ($("e_holder") && $("e_holder").value.trim()) || "",
    phone:  ($("e_phone")  && $("e_phone").value.trim())  || "",
    dob:    hiBlock ? r.dob : (($("e_dob") && $("e_dob").value) || r.dob),
    gender: hiBlock ? r.gender : (($("e_gender") && $("e_gender").value) || r.gender),
    nation: ($("e_nation") && $("e_nation").value.trim()) || "",
    size:   ($("e_size")   && $("e_size").value.trim())   || ""
  };
  if(!next.holder){ toast("姓名不能为空。", "bad"); return; }
  /* 高影响字段被锁定时，接口层同样拒绝（不只是控件 disabled） */
  if(hiBlock && (next.dob !== r.dob || next.gender !== r.gender)){
    closeModal();
    toast("<b>接口拒绝</b>：该参赛人已有<b>已发布</b>的成绩，出生日期 / 性别不允许通过普通修改改写分组与排名。", "bad");
    return;
  }
  /* ⚖️ D-096 F-006 · 「修改资料」只能改<b>当前持有人的拼写</b>，不能换人。
     换人只有「参赛人转让」一条路，而转让有它自己的前置闸门（退款 / 领物 / 成绩 / 截止日）。
     否则在 Edit 里打一个新名字就能绕过全部转让前置。 */
  if(next.holder !== r.holder && !RD.isSpellingCorrection(r.holder, next.holder)){
    toast("<b>已拒绝</b>：「" + esc(r.holder) + "」→「" + esc(next.holder) + "」看起来<b>不是同一个人的拼写更正</b>，" +
          "而是<b>换人</b>。<br>换人必须走「参赛人转让」——它要过转让开关、截止日、进行中退款、" +
          "Race Pack 是否已领、该号是否已有成绩这些前置。" +
          "<br><span class='mut'>此刻没有改动任何业务数据。身份键 " + esc(r.holderId) + " 未变。</span>", "bad");
    return;
  }
  var labels = { holder:"姓名拼写", phone:"联系电话", dob:"出生日期", gender:"性别", nation:"国籍", size:"T 恤尺码" };
  var changed = [];
  Object.keys(next).forEach(function(k){
    if(String(next[k]) !== String(r[k])) changed.push({ field:labels[k], key:k, before:r[k], after:next[k] });
  });
  if(!changed.length){
    toast("<b>没有任何改动</b>：不写空历史，也不写 Audit。", "warn");
    return;
  }
  changed.forEach(function(c){
    r[c.key] = c.after;
    r.edits.push({ at:now(), by:state.staff, role:state.role, field:c.field,
                   before:c.before, after:c.after, reason:reason });
  });
  /* 姓名改了 → 运营用数据（领物名单 / 号码布记录）跟着走；财务快照不动 */
  if(changed.some(function(c){ return c.key === "holder"; })){
    DB.bibs.forEach(function(b){ if(b.regId === p.regId && b.status === "ASSIGNED") b.name = r.holder; });
  }
  closeModal();
  act("参赛资料修改",
    f.o.id + " / " + p.id + " · " + p.regId + " · " +
    changed.map(function(c){ return c.field + "：" + c.before + " → " + c.after; }).join("；") +
    " · 原因：" + reason +
    " · <b>OrderParticipant 财务快照、Order、Payment、Refund、名额、quota、Bib 全部不动</b>；不改全局 Runner Profile",
    "已修改 " + changed.length + " 个字段，before / after 已留痕");
  H.pdetail(opId);
};

H.ptransferok = function(opId){
  var f = findOP(opId);
  if(!f){ closeModal(); toast("找不到该参赛人。", "bad"); return; }
  var o = f.o, p = f.p, r = p.reg;
  /* 执行那一刻重新跑一次全部前置（弹窗可能已经过期） */
  var block = transferBlock(o, p);
  if(block){ closeModal(); toast("<b>接口拒绝</b>：" + block, "bad"); return; }
  var name = ($("t_name") && $("t_name").value.trim()) || "";
  var reason = ($("t_reason") && $("t_reason").value.trim()) || "";
  if(!name){ toast("新持有人姓名必填。", "bad"); return; }
  if(!reason){ toast("转让原因必填。", "bad"); return; }
  /* ⚖️ D-096 F-007 · 执行那一刻校验<b>新持有人</b>对当前组别的硬性资格。
     值来自 Category 配置，不是写死的政策。不满足就<b>拒绝转让</b>——
     既不允许「组别不变照样收下」，也不允许悄悄改价或凭空补一笔交易。 */
  var tDob = ($("t_dob") && $("t_dob").value) || r.dob;
  var elig = RD.categoryEligibility(o.eventId, p.cat, ageOnRaceDay(o.eventId, tDob));
  if(!elig.ok){
    toast("<b>拒绝转让</b>：新持有人不满足组别 <b>" + esc(p.catName || p.cat) + "</b> 的硬性资格 —— " + elig.why +
          "<br><span class='mut'>此刻没有改动任何业务数据：不换人、不改组别、不改价、不产生补款交易。</span>", "bad");
    return;
  }
  var mismatch = ($("t_aud") && $("t_aud").value) === "MISMATCH";
  var bib = RD.currentBib(p.regId) || p.bib;
  var from = r.holder;
  r.transfers.push({ at:now(), by:state.staff, role:state.role, from:from, to:name,
                     fromHolderId:r.holderId, reason:reason, bibAt:bib || null, audienceMismatch:mismatch });
  /* 转让 = 换身份：holderId 换新的，历史里保留原持有人与原身份键 */
  r.holderId = "H-" + p.id + "-T" + r.transfers.length;
  r.holder = name;
  r.phone  = ($("t_phone") && $("t_phone").value.trim()) || r.phone;
  r.dob    = ($("t_dob") && $("t_dob").value) || r.dob;
  r.gender = ($("t_gender") && $("t_gender").value) || r.gender;
  r.nation = ($("t_nation") && $("t_nation").value.trim()) || r.nation;
  /* 换人之后证件核验必须重做（运营事实，走共享命名入口留痕）；
     姓名是派生的，不再镜像一份 */
  RD.resetRacePackIdVerification(p.regId, merchActor(), "参赛人转让：" + from + " → " + name);
  DB.bibs.forEach(function(b){ if(b.regId === p.regId && b.status === "ASSIGNED") b.name = name; });
  closeModal();
  if(mismatch){
    raiseAlert("warn", ["OPS","FINANCE"], "参赛人转让存在身份 / 价格档不匹配",
      o.id + " / " + p.id + " · " + from + " → " + name + " · 报名时身份 " + (p.audience || "ALL") +
      " · 本次转让<b>没有</b>自动改价、<b>没有</b>产生补款交易，财务快照一个字未改。是否要求补差由运营 / 财务按既有人工口径处理。");
  }
  act("参赛人转让",
    o.id + " / " + p.id + " · " + p.regId + " · <b>" + from + " → " + name + "</b> · 原因：" + reason +
    " · 转让时 Bib " + (bib || "—") + "（<b>Bib 不变</b>，换号是另一条独立操作）" +
    " · 原持有人保留在转让历史里，未覆盖" +
    " · <b>不动</b>下单人 / Order / OrderParticipant 财务快照 / 已付金额 / Payment / 历史 Refund / 名额 / quota" +
    (mismatch ? " · <b>身份 / 价格档不匹配已告警，未自动改价、未产生补款</b>" : ""),
    "已转让：" + from + " → " + name + (mismatch ? "（身份 / 价格档不匹配已告警）" : ""), mismatch ? "warn" : undefined);
  H.pdetail(opId);
};

/* ================================================================
   D-092 J-4 · Bib 号段设置 / AUTO / CSV 批量
   ================================================================ */

/* 号段 / 可用池只有共享域一套实现；这里只是转发，避免出现第二套规则 */
function bibCfg(evId, catId){ return RD.bibConfigOf(evId, catId); }
function bibTaken(evId){
  /* 已被占用的号：任何一条 BibAssignment 记录都算——含 SUPERSEDED / VOIDED 历史。
     ⚖️ 作废与换下的号<b>永不再用</b>，因此它们同样不回到可用池。 */
  var m = {};
  DB.bibs.forEach(function(b){ if(b.eventId === evId) m[b.bib] = b.status; });
  return m;
}
function bibReserved(cfg, n){
  return cfg.reservedFrom != null && n >= cfg.reservedFrom && n <= cfg.reservedTo;
}
/* 「可用」是算出来的，不是存下来的：号段 − 预留段 − 全部历史记录。 */
function bibAvailableList(evId, catId, limit){ return RD.bibPool(evId, catId, limit); }
function bibUsedCount(evId, catId){
  var cfg = bibCfg(evId, catId);
  if(!cfg) return 0;
  var n = 0;
  DB.bibs.forEach(function(b){
    if(b.eventId !== evId) return;
    var num = parseInt(b.bib, 10);
    if(isNaN(num) || num < cfg.from || num > cfg.to) return;
    if(bibReserved(cfg, num)) return;
    n++;
  });
  return n;
}
/* 还没有当前号码布的有效报名（AUTO / 批量的合法目标） */
function bibCandidates(evId){
  var out = [];
  DB.orders.forEach(function(o){
    if(o.eventId !== evId) return;
    o.participants.forEach(function(p){
      if(p.regStatus !== "CONFIRMED") return;
      if(RD.currentBib(p.regId)) return;
      out.push({ o:o, p:p });
    });
  });
  return out;
}

H.bibmodeok = function(){
  var key = ($("bc_key") && $("bc_key").value) || "";
  var parts = key.split("|");
  var cfg = bibCfg(parts[0], parts[1]);
  if(!cfg){ toast("配置不存在。", "bad"); return; }
  function num(id, d){ var v = ($(id) && $(id).value.trim()) || ""; if(!v) return d; var n = parseInt(v, 10); return isNaN(n) ? null : n; }
  var from = num("bc_from", cfg.from), to = num("bc_to", cfg.to);
  var rf = num("bc_rf", cfg.reservedFrom), rt = num("bc_rt", cfg.reservedTo);
  var mode = ($("bc_mode") && $("bc_mode").value) || cfg.mode;
  if(from === null || to === null || rf === null || rt === null){ toast("号段必须是整数。", "bad"); return; }
  if(from <= 0 || to <= 0 || from > to){ toast("号段起必须 ≤ 号段止，且都为正整数。", "bad"); return; }
  if(rf < from || rt > to || rf > rt){ toast("预留段必须落在号段范围内。", "bad"); return; }
  var outside = DB.bibs.filter(function(b){
    if(b.eventId !== cfg.eventId || b.status !== "ASSIGNED") return false;
    var n = parseInt(b.bib, 10);
    var oldIn = n >= cfg.from && n <= cfg.to;
    return oldIn && (n < from || n > to);
  });
  if(outside.length){
    toast("<b>拒绝保存</b>：已分配的号 " + outside.map(function(b){ return b.bib; }).join("、") +
          " 会被排除在新号段之外。<br><span class='mut'>此刻没有改动任何配置。</span>", "bad");
    return;
  }
  var before = cfg.from + "–" + cfg.to + "（预留 " + cfg.reservedFrom + "–" + cfg.reservedTo + " · " + cfg.mode + "）";
  cfg.from = from; cfg.to = to; cfg.reservedFrom = rf; cfg.reservedTo = rt; cfg.mode = mode;
  closeModal();
  act("Bib 号段配置", cfg.eventId + " / " + cfg.catId + " · " + before + " → " +
      from + "–" + to + "（预留 " + rf + "–" + rt + " · " + mode + "）· 未产生、未改动、未作废任何一条 BibAssignment",
      "已保存号段配置");
};

  /* ⚖️ D-096 F-009 · 弹窗打开时的状态不是权威。
     取号与写入都用<b>当前</b>共享状态重跑一遍：报名可能已被取消、号段可能已被改。 */
  if(f.p.regStatus !== "CONFIRMED"){
    closeModal();
    toast("<b>已拒绝执行</b>：该报名当前是 <code>" + esc(f.p.regStatus) + "</code>，已经不是可分配号码布的有效参赛资格。" +
          "<br><span class='mut'>弹窗打开之后状态变了；本次没有写入任何号码布记录。</span>", "bad");
    render();

  }
  var pool = RD.bibPool(f.o.eventId, f.p.cat, 1);
  if(!pool.length){

    toast("<b>无可用号码</b>：该组别号段内已无合法可用号（预留段与全部历史记录都被排除）。", "bad");
    return;
  }
  var res = RD.assignBib(f.p.regId, pool[0], merchActor(), "AUTO 自动分配");
  if(!res.ok){
    closeModal();

          "<br><span class='mut'>执行期以当前状态重判，本次没有写入任何号码布记录。</span>", "bad");
    render();
    return;
  }
  closeModal();
  act("Bib 分配", "AUTO · " + f.p.regId + " " + RD.holderOf(f.p) + " · 组别 " + f.p.cat +
      " · 取号 " + res.bib + "（可用池由号段 − 预留段 − 历史记录算出）· 执行期以当前状态重判后写入一条 ASSIGNED",
      "已自动分配 Bib " + res.bib + " 给 " + RD.holderOf(f.p));

var BIB_CSV_DEMO =
  "REG-11,2101\n" +   /* 合法 */
  "REG-12,2102\n" +   /* 合法 */
  "REG-13,1101\n" +   /* 合法（21K 号段） */
  "REG-12,2103\n" +   /* CSV 内同一个 Registration 出现多次 */
  "REG-13,2102\n" +   /* CSV 内号码重复 + 超出该组别号段 */

  "REG-11,2010\n" +   /* SUPERSEDED 历史号，永不复用 */

  "REG-15,2106\n" +   /* 属于另一场赛事的 Registration */
  "REG-99,2105\n" +   /* 目标 Registration 不存在 */
  "REG-13,abc";        /* 号码不是合法数字 */

/* ⚖️ D-096 F-008 · CSV 的每一行都走<b>同一个</b>共享校验器，
   只额外加两条 CSV 特有的批内冲突（同号重复 / 同一个报名出现多次）。 */
function bibCsvParse(text, evId){
  var seenBib = {}, seenReg = {}, rows = [];
  String(text || "").split(/\r?\n/).forEach(function(line, i){
    line = line.trim();
    if(!line) return;
    var cols = line.split(/[,\t;]/).map(function(x){ return x.trim(); });
    var regId = cols[0] || "", bib = cols[1] || "";
    var v = RD.validateBibAssignment(regId, bib);
    var errs = v.errs.slice();
    var f = RD.findOPByReg(regId);
    if(f && f.o.eventId !== evId) errs.unshift("该 Registration 属于其它赛事（" + f.o.eventId + "）");
    if(regId){
      if(seenReg[regId]) errs.push("同一个 Registration 在 CSV 里出现了多次");
      seenReg[regId] = 1;
    }
    if(bib){
      if(seenBib[bib]) errs.push("CSV 内部号码重复（第 " + seenBib[bib] + " 行也是 " + bib + "）");
      seenBib[bib] = i + 1;
    }
    rows.push({ line:i + 1, regId:regId, bib:bib, ok:!errs.length, errs:errs,
                name:f ? RD.holderOf(f.p) : null, opId:f ? f.p.id : null });
  });
  return rows;
}

    esc(BIB_CSV_DEMO) + "</textarea>" +

H.bibcsvprev = function(){
  var evId = ($("bcsv_ev") && $("bcsv_ev").value) || "EV-A";
  var txt  = ($("bcsv_txt") && $("bcsv_txt").value) || "";
  var rows = bibCsvParse(txt, evId);
  var okRows = rows.filter(function(r){ return r.ok; });
  var badRows = rows.filter(function(r){ return !r.ok; });
  BIB_CSV_STAGE = { evId:evId, rows:rows };
  var h = "<h3>批量分配 · 冲突预览</h3>" +
    "<p class='mut'>共 " + rows.length + " 行：<b class='ok'>" + okRows.length + " 行可执行</b>，<b style='color:var(--stop)'>" +
    badRows.length + " 行有冲突</b>。<b>冲突行不会被写入，也不会覆盖任何既有绑定。</b></p>" +
    "<div class='scroll' style='max-height:22rem'><table><thead><tr><th>行</th><th>Registration</th><th>号码</th><th>结果</th></tr></thead><tbody>";
  rows.forEach(function(r){
    h += "<tr><td class='mut'>" + r.line + "</td><td>" + esc(r.regId) + (r.name ? "<br><span class='mut'>" + pii(r.name) + "</span>" : "") + "</td>" +
      "<td><code>" + esc(r.bib) + "</code></td><td>" +
      (r.ok ? "<span class='tag t-ok'>可执行</span>"
            : "<span class='tag t-bad'>冲突</span><br><span class='mut'>" + r.errs.map(esc).join("；") + "</span>") +
      "</td></tr>";
  });
  h += "</tbody></table></div>" +
    '<div class="note badnote"><b>不静默覆盖：</b>任何一条已存在的历史绑定（ASSIGNED / SUPERSEDED / VOIDED / RESERVED）都不会被这次批量改写。</div>' +
    "<div class='acts'><button class='btn' data-close>取消</button>" +
    "<button class='btn pri' data-h='bibcsvapply'" + (okRows.length ? "" : " disabled") + ">仅执行 " + okRows.length + " 行可执行记录</button></div>";
  openModal(h);
};
var BIB_CSV_STAGE = null;
H.bibcsvapply = function(){
  if(!BIB_CSV_STAGE){ toast("请先校验并预览。", "bad"); return; }
  var evId = BIB_CSV_STAGE.evId;
  /* ⚖️ D-096 F-009 · 预览不是权威。
     写入那一刻用<b>当前</b>共享状态把完整校验器整个重跑一遍：
     另一个标签页可能刚刚改了号段、把某个号划进预留段、或取消了那条报名。 */
  var rows = BIB_CSV_STAGE.rows.filter(function(r){ return r.ok; });
  var done = [], skipped = [];
  rows.forEach(function(r){
    var f = RD.findOPByReg(r.regId);
    if(f && f.o.eventId !== evId){ skipped.push(r.regId + "→" + r.bib + "（跨赛事）"); return; }
    var res = RD.assignBib(r.regId, r.bib, merchActor(), "CSV 批量分配");
    if(!res.ok){ skipped.push(r.regId + "→" + r.bib + "（" + res.errs.join("；") + "）"); return; }
    done.push(r.regId + "→" + r.bib);
  });
  BIB_CSV_STAGE = null;
  closeModal();
  act("Bib 批量分配",
    evId + " · 执行 " + done.length + " 行：" + (done.join("、") || "—") +
    (skipped.length ? " · <b>执行期以当前状态复检拒绝 " + skipped.length + " 行</b>：" + skipped.join("、") : "") +
    " · 冲突行一条都没有写入，既有历史绑定一条都没有被覆盖",
    "批量分配完成：成功 " + done.length + " 行" + (skipped.length ? "，执行期拒绝 " + skipped.length + " 行" : ""),
    skipped.length ? "warn" : undefined);
};

        : "占用中 " + o.reservation.qty + " 件") : "—") + "</p>";
    if(o.handoff){
      h += '<div class="note oknote" style="margin:.6rem 0 0"><b>已交付：</b>' + esc(o.handoff.at) + " · " + esc(o.handoff.location) +
        " · 操作人 " + esc(o.handoff.by) + " · 收货人确认：" + esc(o.handoff.recipient) +
        "<br><span class='mut'>这条记录<b>不产生</b>任何 Race Pack 领物事实。</span></div>";
    }
    if(o.status === "EXPIRED"){
      h += '<div class="note warnote" style="margin:.6rem 0 0"><b>周边侧没有 EXPIRED → PAID 的逆向路径。</b>' +
        "钱在过期之后到账时：如实入账、如实留证据，但<b>不恢复订单、不重新预留、不扣库存、不产生履约、不发货</b>，" +
        "钱走周边财务域退回（docs/14 §7.2 / §7.3）。" +
        (lateMoney ? "<br><b>这笔钱的来源异常是 " + esc(lateMoney.id) + "</b>：" +
          "它<b>只有在退款结算完成之后</b>才会关闭 —— 退款单被创建出来不代表钱回去了（D-094）。" +
          (rfSettled ? "当前已结算 " + esc(rfSettled.id) + "，钱已退回。"
                     : (rfActive ? "当前进行中：" + esc(rfActive.id) + " · " + esc(rfActive.status) + "。" : "")) : "") +
        "</div>";
    }
    /* D-094 R5 · 历史上失败过的退款要看得见，但不能挡住这笔钱重新走一遍 */
    var rfFailed = rfHistory.filter(function(x){ return x.status === "REJECTED" || x.status === "WITHDRAWN"; });
    if(rfFailed.length){
      h += '<div class="note" style="margin:.6rem 0 0"><b>历史退款记录（' + rfFailed.length + " 条终态）：</b>" +
        rfFailed.map(function(x){ return "<code>" + esc(x.id) + "</code> " + esc(x.status) + "（" + esc(x.rejectReason || "—") + "）"; }).join("、") +
        "<br><span class='mut'>历史一条都不删、不改写。<b>它们不构成阻塞</b>：" +
        "这笔钱如果还没退回去，仍然可以重新发起一条正确的退款（D-094 R5）。</span></div>";
    }
    if(o.history && o.history.length){
      h += "<div class='scroll' style='margin-top:.6rem'><table><thead><tr><th>时间</th><th>操作人</th><th>动作</th><th>说明</th></tr></thead><tbody>";
      o.history.slice().reverse().forEach(function(x){
        h += "<tr><td class='mut'>" + esc(x.at) + "</td><td class='mut'>" + esc(x.by) + " · " + esc(x.role) + "</td>" +
          "<td>" + esc(x.what) + "</td><td class='mut'>" + x.detail + "</td></tr>";
      });
      h += "</tbody></table></div>";
    }
    h += "</div>";
  });
  h += "</div>";

  /* ---------- 支付异常 ---------- */
  h += '<div class="card"><h3>周边支付异常</h3>' +
    "<p class='mut' style='margin:.1rem 0 .7rem'>五类与报名侧<b>同名、同判定逻辑</b>，但<b>处置全部在周边域内完成</b>（docs/14 §八）。</p>" +
    "<div class='scroll'><table><thead><tr><th>异常</th><th>类型</th><th>订单</th><th>金额</th><th>状态</th><th>说明</th><th>流水</th><th>操作</th></tr></thead><tbody>";
  if(!DB.merch.exceptions.length) h += "<tr><td colspan='8' class='mut'>暂无周边支付异常。</td></tr>";
  DB.merch.exceptions.forEach(function(e){
    /* D-094 R2 / R3 · 超时后到账：异常<b>只有在退款结算之后</b>才关闭；
       两个入口（异常这一行 / 过期订单卡片）指向<b>同一笔</b>退款。 */
    var eLate = e.type === "LATE_ARRIVAL";
    var eAct  = eLate ? RD.activeMerchRefund(e.orderId) : null;
    var eDone = eLate ? RD.settledMerchRefund(e.orderId) : null;
    h += "<tr><td><code>" + esc(e.id) + "</code></td><td>" + esc(e.type) + "</td><td>" + esc(e.orderId) + "</td>" +
      "<td>" + money(e.amount) + "</td><td>" + statusTag(e.status) +
      (eAct ? "<br><span class='tag t-warn'>退款处理中 · " + esc(eAct.id) + "</span>" +
              "<br><span class='mut'>钱还没退回去，异常<b>保持 OPEN</b></span>" : "") + "</td>" +
      "<td class='mut'>" + esc(e.note) + (e.resolution ? "<br><b>处置：" + esc(e.resolution) + "</b>" : "") +
      (e.settledRefundId ? "<br><span class='mut'>留痕：来源异常 " + esc(e.id) + " · 退款 " + esc(e.settledRefundId) +
        " · 实收 " + money(e.amount) + " · 应退 " + money(e.requiredAmount != null ? e.requiredAmount : e.amount) +
        " · 实退 " + money(e.settledAmount) + " · 凭证 " + proofSafe(e.settlementProof) +
        (e.note2 ? "<br>" + esc(e.note2) : "") + "</span>" : "") + "</td>" +
      "<td>" + txnMask(e.txn) + "</td><td><div class='row'>" +
      (e.status === "OPEN"
        ? opBtn("merch_payment_exc", eLate ? (eAct ? "查看退款进度" : "处置") : "处置", "mexc:" + e.id, eAct ? "" : "pri")
        : "<span class='mut'>已处置</span>") +
      "</div></td></tr>";
    if(eLate && e.status === "OPEN" && !eAct && !eDone){
      h += "<tr><td colspan='8' class='mut'>↳ 这笔钱<b>已经真的收到了</b>，但还没有退回去。" +
        "异常不会因为写一段处置结论就关闭 —— 只有<b>退款结算完成</b>才算处理完（D-094 R2）。</td></tr>";
    }
  });
  h += "</tbody></table></div></div>";

  /* ---------- 退款 ---------- */
  h += '<div class="card"><h3>周边退款（整单 · 三段式）</h3>' +
    '<div class="note badnote" style="margin:.1rem 0 .7rem"><b>⚖️ 退钱 ≠ 退货。</b>' +
    "退款结算（SETTLED）只代表<b>钱真的打回去了</b>，<b>on_hand 一个数字都不会变</b>。" +
    "库存只能通过<b>显式的退货入库（RETURN_RECEIVED）</b>恢复，而且同一笔只入库一次。</div>" +
    "<div class='scroll'><table><thead><tr><th>Refund</th><th>订单</th><th>范围</th><th>金额</th><th>状态</th><th>发起</th><th>原因</th><th>退货入库</th><th>操作</th></tr></thead><tbody>";
  if(!DB.merch.refunds.length) h += "<tr><td colspan='9' class='mut'>暂无周边退款。</td></tr>";
  DB.merch.refunds.forEach(function(r){
    h += "<tr><td><code>" + esc(r.id) + "</code></td><td>" + esc(r.orderId) + "</td>" +
      "<td><span class='tag t-info'>整单</span>" +
      (RD.isLateArrivalRefund(r) ? "<br><span class='tag t-warn'>超时后到账退回</span><br><span class='mut'>来源 " +
        esc(r.sourceExceptionId || "—") + " · 只能 REQUESTED → APPROVED → SETTLED</span>"
        : "<br><span class='mut'>一期不做分项 / 部分退货 / 换货</span>") + "</td>" +
      "<td>" + money(r.amount) +
      (r.status === "SETTLED" && r.settledAmount != null
        ? "<br><span class='mut'>应退 " + money(r.requiredAmount != null ? r.requiredAmount : r.amount) +
          " · 实退 <b>" + money(r.settledAmount) + "</b></span>" : "") +
      "</td><td>" + statusTag(r.status) + "</td>" +
      "<td class='mut'>" + esc(r.by) + "<br>initiated_by=" + esc(r.initiatedBy) + "</td>" +
      "<td class='mut'>" + esc(r.reason) + (r.rejectReason ? "<br>处置原因：" + esc(r.rejectReason) : "") + "</td>" +
      "<td class='mut'>" + (r.returnReceived
        ? "已入库 " + esc(r.returnReceived.at) + "<br>" + esc(r.returnReceived.by) + "（不会再入库第二次）"
        : (r.status === "SETTLED" ? "<b>尚未退货入库</b><br>on_hand 未变" : "—")) + "</td>" +
      "<td><div class='row'>";
    /* D-094 R1 · 超时后到账的退款不允许拒绝 / 撤回：钱已经真的收到了，
       订单又必须停在 EXPIRED、货不会发出去——拒了就是一条走不出去的资金死路。
       这里不显示按钮，处理器也会在改动任何状态之前失败关闭（不是只藏按钮）。 */
    var isLate = RD.isLateArrivalRefund(r);
    if(r.status === "REQUESTED"){
      h += opBtn("merch_refund", "审批", "mrfapprove:" + r.id);
      if(isLate) h += "<span class='mut'>超时后到账<b>只能退回</b>，不可拒绝 / 撤回</span>";
      else h += opBtn("merch_refund", "拒绝 / 撤回", "mrfreject:" + r.id, "danger");
    } else if(r.status === "APPROVED"){
      h += opBtn("merch_refund", "结算打款", "mrfsettle:" + r.id, "pri");
      if(isLate) h += "<span class='mut'>超时后到账<b>只能退回</b>，不可拒绝 / 撤回</span>";
      else h += opBtn("merch_refund", "拒绝 / 撤回", "mrfreject:" + r.id, "danger");
    } else if(r.status === "SETTLED"){
      h += opBtn("merch_return", "登记退货入库", "mreturn:" + r.id, "",
        { block: r.returnReceived ? "该笔退货已于 " + esc(r.returnReceived.at) + " 登记入库，<b>重复提交不产生第二次入库</b>（docs/14 M-14）。" : null });
    } else h += "<span class='mut'>终态</span>";
    h += "</div></td></tr>";
  });
  h += "</tbody></table></div></div>";

  /* ---------- 待领取 ---------- */
  h += merchHandoffCard();

  /* ---------- 周边 Audit ---------- */
  h += '<div class="card"><h3>周边操作留痕</h3><div class="scroll"><table><thead><tr>' +
    "<th>时间</th><th>操作人</th><th>动作</th><th>说明</th></tr></thead><tbody>";
  var mAudit = DB.audit.filter(function(a){
    return /周边/.test(a.what);
  });
  if(!mAudit.length) h += "<tr><td colspan='4' class='mut'>暂无周边留痕。</td></tr>";
  mAudit.slice(0, 40).forEach(function(a){
    h += "<tr><td class='mut'>" + esc(a.at) + "</td><td class='mut'>" + esc(a.who) + " · " + esc(a.role) + "</td>" +
      "<td>" + esc(a.what) + "</td><td class='mut'>" + a.detail + "</td></tr>";
  });
  h += "</tbody></table></div></div>";

  if(state.role === "SUPPORT"){
    h += '<div class="deny"><b>当前角色 SUPPORT 在周边域的边界：</b><br>' +
      "✅ 可见：商品与可售状态、订单、支付信息、履约状态 —— 足够回答用户「我的周边订单怎么了」。<br>" +
      "✅ 可做：<b>代客发起整单退款申请</b>（REQUESTED）。<br>" +
      "🚫 不可做：审批 / 拒绝 / 撤回 / 结算退款、调整库存、确认交付。<b>财务裁决只归 FINANCE，履约只归 OPS / 现场。</b></div>";
  }
  if(state.role === "ADMIN"){
    h += '<div class="deny"><b>当前角色 ADMIN：</b>周边域全域<b>只读</b>。' +
      "商品、库存、订单、异常、退款、交付一个写按钮都没有——<b>日常经营动作不是管理员动作</b>。审计视野是完整的。</div>";
  }
  if(state.role === "FINANCE"){
    h += '<div class="deny"><b>当前角色 FINANCE：</b>周边支付异常与周边退款是写权限；' +
      "商品、库存、订单操作、交付都是<b>只读</b>。<b>财务不碰货，运营不碰钱。</b></div>";
  }
  return h;
};

function merchHandoffCard(){
  /* 已经整单退款结算的订单<b>不再出现在待领取列表里</b>：钱退了，货就不该再交出去 */
  var pend = mOrders().filter(function(o){
    return o.status === "PAID" && o.fulfillment === "PENDING_HANDOFF" &&
           canSeeEvent(o.eventId) && RD.handoffEligibility(o).ok; });
  var h = '<div class="card"><h3>待领取（PENDING_HANDOFF）</h3>' +
    '<div class="note warnote" style="margin:.1rem 0 .7rem"><b>待领取是一笔负债，不是「已完成」。</b>' +
    "真实闭环 = 真钱 + 真扣库存 + <b>真交付</b>，三者缺一这笔生意在系统里就是没做完（docs/14 §10.3）。" +
    "<br><b>Race Pack 领物与周边交付是两件事</b>，任何一边都不会自动触发另一边（§10.4）。</div>";
  if(!pend.length) h += "<p class='mut'>当前没有待领取的周边订单。</p>";
  else {
    h += "<div class='scroll'><table><thead><tr><th>订单</th><th>取货人</th><th>商品</th><th>赛事</th><th>操作</th></tr></thead><tbody>";
    pend.forEach(function(o){
      h += "<tr><td><code>" + esc(o.id) + "</code></td><td>" + pii(o.buyer) + "<br>" + phoneMask(o.phone) + "</td>" +
        "<td>" + o.items.map(function(it){ return esc(it.productName) + " " + esc(it.variant) + "/" + esc(it.size) + " ×" + it.qty; }).join("<br>") + "</td>" +
        "<td class='mut'>" + esc(o.eventId) + "</td><td><div class='row'>" +
        opBtn("merch_handoff", "确认交付", "mhandoff:" + o.id, "pri",
          { block: !canSeeEvent(o.eventId) ? "当前身份没有该赛事的有效指派（D-019）。"
                                           : (RD.handoffEligibility(o).ok ? null : RD.handoffEligibility(o).why) }) +
        "</div></td></tr>";
    });
    h += "</tbody></table></div>";
  }
  return h + "</div>";
}

/* 现场角色的最小视图：只有待领取，没有钱、没有库存、没有定价、没有退款细节 */

  if(!evs || !evs.length){

      "当前演示日期 " + esc(state.today) + "。</div>";

  return h;
}

    "<h3>新建周边商品</h3>" +
    '<div class="note">新建后是 <code>DRAFT</code>：前台完全看不到。<b>只有 DRAFT 阶段可以自由修改主数据而不涉及任何既有订单。</b></div>' +
    "<p style='margin:.7rem 0 .25rem'>商品名称（必填）</p><input type='text' id='mp_name' style='width:100%'>" +
    "<p style='margin:.7rem 0 .25rem'>英文名</p><input type='text' id='mp_en' style='width:100%'>" +
    "<p style='margin:.7rem 0 .25rem'>描述</p><input type='text' id='mp_desc' style='width:100%'>" +

    "<input type='text' id='mp_stock' placeholder='20' style='flex:1'></div>" +

    "初始库存会落成一条 <code>INITIAL_STOCK</code> 调整事实，不是裸改数字。</div>" +
    "<div class='acts'><button class='btn' data-close>取消</button>" +
    "<button class='btn pri' data-h='mpnewok'>创建（DRAFT）</button></div>"
  );
};
H.mpnewok = function(){
  var name = ($("mp_name") && $("mp_name").value.trim()) || "";
  if(!name){ toast("商品名称必填。", "bad"); return; }
  var price = parseFloat(($("mp_price") && $("mp_price").value) || "0");
  var stock = parseInt(($("mp_stock") && $("mp_stock").value) || "0", 10);
  if(!(price > 0)){ toast("单价必须是正数。", "bad"); return; }
  if(!(stock >= 0) || isNaN(stock)){ toast("初始库存必须是非负整数。", "bad"); return; }
  var pid = "MP-" + (mProducts().length + 1);
  var sid = "SKU-" + (mProducts().reduce(function(a, p){ return a + p.skus.length; }, 0) + 1);
  mProducts().push({
    id:pid, name:name, nameEn:($("mp_en") && $("mp_en").value.trim()) || name,
    eventId:"EV-A", status:"DRAFT", seed:300 + mProducts().length,
    desc:($("mp_desc") && $("mp_desc").value.trim()) || "—",
    createdBy:state.staff, createdAt:now(), lastBy:state.staff, lastAt:now(),
    skus:[{ id:sid, variant:($("mp_var") && $("mp_var").value.trim()) || "标准",
            size:($("mp_size") && $("mp_size").value.trim()) || "均码",
            price:price, currency:"USD", onHand:0, reserved:0, saleable:true }]
  });
  if(stock > 0) RD.adjustInventory(sid, stock, "INITIAL_STOCK", merchActor(), { note:"新建商品的首批库存" });
  closeModal();
  act("周边商品创建", pid + " · " + name + " · 首个 SKU " + sid + " · 单价 $" + price +
      " · 初始库存 " + stock + "（落成 INITIAL_STOCK 调整事实）· 状态 DRAFT，前台不可见",
      "已创建 " + name + "（DRAFT）");
};
H.mpedit = function(id){
  var p = RD.productById(id);
  if(!p){ toast("商品不存在。", "bad"); return; }
  openModal(
    "<h3>编辑商品 · " + esc(p.name) + "</h3>" +
    '<div class="note oknote">⚖️ <b>改主数据不影响任何已存在订单</b>，包括仍停在 PENDING_PAYMENT 的订单：' +
    "用户看到的、要付的、对账要认的，全部是<b>下单那一刻冻结的快照</b>（docs/14 §四）。</div>" +
    "<p style='margin:.7rem 0 .25rem'>名称</p><input type='text' id='mp_name' style='width:100%' value='" + esc(p.name) + "'>" +
    "<p style='margin:.7rem 0 .25rem'>描述</p><input type='text' id='mp_desc' style='width:100%' value='" + esc(p.desc) + "'>" +
    p.skus.map(function(s){
      return "<p style='margin:.7rem 0 .25rem'>" + esc(s.id) + " · " + esc(s.variant) + " / " + esc(s.size) + " 单价</p>" +
             "<input type='text' id='mp_pr_" + s.id + "' style='width:100%' value='" + s.price + "'>";
    }).join("") +
    "<div class='acts'><button class='btn' data-close>取消</button>" +
    "<button class='btn pri' data-h='mpeditok:" + id + "'>保存</button></div>"
  );
};
H.mpeditok = function(id){
  var p = RD.productById(id);
  if(!p){ closeModal(); toast("商品不存在。", "bad"); return; }
  var changes = [];
  var name = ($("mp_name") && $("mp_name").value.trim()) || p.name;
  if(name !== p.name){ changes.push("名称：" + p.name + " → " + name); p.name = name; }
  var desc = ($("mp_desc") && $("mp_desc").value.trim()) || p.desc;
  if(desc !== p.desc){ changes.push("描述已更新"); p.desc = desc; }
  var bad = null;
  p.skus.forEach(function(s){
    var el = $("mp_pr_" + s.id);
    if(!el) return;
    var v = parseFloat(el.value);
    if(!(v > 0)){ bad = s.id; return; }
    if(v !== s.price){ changes.push(s.id + " 单价：$" + s.price + " → $" + v); s.price = v; }
  });
  if(bad){ toast("SKU " + bad + " 的单价必须是正数。", "bad"); return; }
  if(!changes.length){ toast("没有任何改动。", "warn"); return; }
  p.lastBy = state.staff; p.lastAt = now();
  closeModal();
  act("周边商品编辑", id + " · " + changes.join("；") +

/* ---------- 支付异常 ---------- */
/* docs/14 §7.2 · D-051 —— 周边侧超时后到账的处置。
   ⚖️ 关键在于：那句「钱通过周边财务域退回」必须是一个<b>真的能执行的动作</b>。
   只写一段自由文本就把异常关掉，等于系统说钱退了、而资金对象一个状态都没变——
   那正是 D-092 禁止的假语义。
   因此这一步<b>启动一条真正的周边 Refund（REQUESTED）</b>，
   之后仍由 FINANCE 走 审批 → 结算打款 的既有链路。
   <b>这一步本身不代表钱已经退出去</b>，与报名侧 D-031 R2 是同一个道理。 */
H.mexclate = function(id){
  var e = DB.merch.exceptions.filter(function(x){ return x.id === id; })[0];
  if(!e){ toast("异常不存在。", "bad"); return; }
  var o = RD.merchOrderById(e.orderId);
  /* D-094 R3 · 异常入口与过期订单入口指向<b>同一笔</b>退款：
     已经有进行中 / 已结算的退款时，这里只负责把它显示出来并让人继续处理，
     绝不再开第二笔，也不把流程堵成死路。 */
  var act = RD.activeMerchRefund(e.orderId);
  var done = RD.settledMerchRefund(e.orderId);
  var failed = RD.merchRefundsOf(e.orderId).filter(function(x){
    return x.status === "REJECTED" || x.status === "WITHDRAWN"; });
  if(done){
    openModal(
      "<h3>超时后到账 · " + esc(e.id) + "</h3>" +
      '<div class="note oknote"><b>这笔钱已经退回去了。</b>退款 <code>' + esc(done.id) + "</code> 已结算 " +
      money(done.amount) + "，凭证 " + proofSafe(done.proof) + "。<br>" +
      "同一笔真实到账<b>不会退第二次</b>。</div>" +
      "<div class='acts'><button class='btn' data-close>关闭</button></div>");
    return;
  }
  if(act){
    openModal(
      "<h3>超时后到账 · " + esc(e.id) + " · 退款处理中</h3>" +
      '<div class="note warnote"><b>这笔钱已经有一条进行中的退款：<code>' + esc(act.id) + "</code>（" + esc(act.status) + "）。</b><br>" +
      "两个入口（支付异常这一行 / 过期订单卡片）指向的是<b>同一笔</b>退款，不会也不该再开第二笔。<br>" +
      "请到下方「周边退款」区继续处理：" +
      (act.status === "REQUESTED" ? "<b>审批</b> → 结算打款。" : "<b>结算打款</b>。") + "</div>" +
      '<div class="note"><b>异常此刻仍然是 OPEN。</b>退款单被创建出来<b>不代表钱回去了</b>——' +
      "只有<b>结算完成</b>之后，这条异常才会关闭（D-094 R2）。</div>" +
      "<div class='acts'><button class='btn' data-close>关闭</button>" +
      "<button class='btn pri' data-go='merch' data-close>去周边退款区 →</button></div>");
    return;
  }
  openModal(
    "<h3>超时后到账处置 · " + esc(e.id) + " · LATE_ARRIVAL</h3>" +
    "<p class='mut'>" + esc(e.orderId) + " · 到账 " + money(e.amount) + " · 流水 " + txnMask(e.txn) +
    " · 订单当前 " + statusTag(o ? o.status : "—", "", "merch") + "</p>" +
    '<div class="note warnote"><b>周边侧不存在 EXPIRED → PAID 的逆向路径。</b>' +
    "被恢复的是<b>物理实物</b>，不是可由人判断的运营名额；在一个已知有人工误差的库存数字上开逆向路径，" +
    "等于用一个不可靠的数字去承诺一件可能不存在的货（docs/14 §7.3）。</div>" +
    impact("退回该笔到账并启动周边退款",
      ["钱如实入账、原始证据如实保留",
       "<b>创建一条周边整单退款 → REQUESTED</b>，由 FINANCE 继续审批与结算",
       "<b>异常保持 OPEN</b>——只有<b>结算完成</b>之后它才会关闭（D-094 R2）"],
      ["<b>不恢复订单</b>（保持 EXPIRED）、<b>不重新预留</b>、<b>不扣库存</b>、<b>不产生履约</b>、<b>不发货</b>、<b>不看库存还有没有</b>",
       "<b>这一步不代表钱已经退出去</b>——出账发生在「结算打款」那一步，异常也在那时才关闭",
       "<b>这笔退款不允许被拒绝 / 撤回</b>：钱已经真的收到了，只能退回去（D-094 R1）",
       "<b>不写</b> OrderParticipant / Registration / Category 名额 / PriceRule quota / Bib / 报名侧 Refund"],
      "用户看到订单<b>仍然是已过期</b>，同时看到一条「退款审核中」——钱有明确去向。") +
    (failed.length ? '<div class="note"><b>历史上有 ' + failed.length + " 条已终止的退款：</b>" +
      failed.map(function(x){ return "<code>" + esc(x.id) + "</code> " + esc(x.status); }).join("、") +
      "<br><span class='mut'>历史保留、不改写；<b>它们不构成阻塞</b>——这笔钱还没退回去，仍然要走完（D-094 R5）。</span></div>" : "") +
    "<p style='margin:.7rem 0 .25rem'>处置结论（必填）</p><input type='text' id='ml_res' style='width:100%' placeholder='例：全额退回该笔超时到账，订单保持 EXPIRED'>" +
    "<div class='acts'><button class='btn' data-close>取消</button>" +
    "<button class='btn pri' data-h='mexclateok:" + id + "'>退回该笔到账并启动退款</button></div>"
  );
};
H.mexclateok = function(id){
  var e = DB.merch.exceptions.filter(function(x){ return x.id === id; })[0];
  if(!e){ closeModal(); toast("异常不存在。", "bad"); return; }
  var res = ($("ml_res") && $("ml_res").value.trim()) || "";
  if(!res){ toast("处置结论必填。", "bad"); return; }
  var before = RD.merchOrderById(e.orderId);
  var beforeStatus = before && before.status;
  var rf = RD.merchRefundCreate(e.orderId, merchActor(),
    "超时后到账退回（来源异常 " + e.id + " · 流水 " + e.txn + "）：" + res, state.role);
  if(!rf.ok){ closeModal(); toast("<b>已拒绝</b>：" + rf.msg, "bad"); render(); return; }
  var after = RD.merchOrderById(e.orderId);
  closeModal();
  /* ⚖️ D-094 R2 · 这一步<b>不关闭异常</b>：钱还在 RUN 手上，事情就没有处理完。
     异常只会在退款<b>结算完成</b>那一刻关闭。 */
  act("周边超时后到账 · 启动退回",
    id + " · LATE_ARRIVAL · " + e.orderId + " · 到账 " + money(e.amount) + " · 处置意见：" + res +

    " · <b>异常保持 OPEN</b>，结算完成后才关闭" +
    " · 该退款<b>不允许拒绝 / 撤回</b>（D-094 R1）" +
    " · 订单 " + beforeStatus + " → " + after.status + "（<b>不变</b>）：不恢复、不重新预留、不扣库存、不产生履约、不发货" +

    "已启动 " + rf.refund.id + "：订单仍为 EXPIRED，异常保持 OPEN，等待 FINANCE 审批与结算打款", "warn");
};

/* ---------- 退款 ---------- */
H.mrfnew = function(id){
  var o = RD.merchOrderById(id);
  var late = (o.status === "EXPIRED") ? RD.lateArrivalMoney(id) : null;

    '<div class="note warnote"><b>一期只支持整单退款。</b>不做分项退款、部分退货、换尺码、换货流程。' +

/* ================================================================
   D-092 · 共享状态的落盘与跨端观察
   ================================================================ */
/* ⚖️ D-108 · 打开后台<b>本身</b>就该让过期的单落地，不该等谁去点一下按钮。
   ----------------------------------------------------------------
   共享域这一侧已经对了：真去执行付款前取消时，域会先把过期的单结算掉。
   但那要有人点。一张用户关掉页面、计时器再也没跑过的陈旧订单，
   在后台列表里会一直显示成 PENDING_PAYMENT，名额也一直占着 ——
   界面只是提示「应按过期处理」，却没人真的去处理。提示不是处理。

   所以后台在<b>读到共享状态之后、渲染动作按钮之前</b>先对一次账：
   凡是 PENDING_PAYMENT 且已过截止时刻的，一律交给<b>同一个</b>过期原语
   settleIfPastDeadline() 结算。不另造 ADMIN_EXPIRED 之类的第二条过期路径。

   ⚠️ D-022 的「有待裁支付异常就不许人工取消」拦的是<b>人工取消</b>，
   不是「有异常就可以永远停在 PENDING_PAYMENT」。钱的事归财务按既有流程处理，
   但位子不能一直被占着 —— 所以过期照常发生，那张异常单<b>原样不动</b>：
   不自动处置、不删除、不转换、不替财务下任何结论。

   幂等由订单自己的预留事实兜底：结算过的单第二次进来什么都不会发生，
   因此反复渲染 / 反复同步都不会二次释放，也不会写第二条过期流水。 */
function reconcileExpiredRegistrationOrders(){
  var settled = [];
  (RD.state.orders || []).forEach(function(o){
    if(o.status !== "PENDING_PAYMENT") return;
    var res = RD.settleIfPastDeadline(o, { who:"system", role:"SYSTEM" });
    if(res && res.expired) settled.push(o.id);
  });
  /* ⚖️ D-111 根 C · 周边订单在待付款期间同样<b>真的占着库存</b>，
     所以同一次对账里一并结算 —— 否则一张没人管的过期周边订单会把库存
     无限期占着（幽灵预留）。释放逻辑一行没抄，仍由 expireMerchOrder()
     和预留事实负责 exactly-once。 */
  var merch = RD.reconcileExpiredMerchOrders({ who:"system", role:"SYSTEM" });
  settled = settled.concat(merch);
  /* 只有真的结算过才落盘：没变更就不写，避免无谓的跨端广播 */
  if(settled.length) RD.save();
  return settled;
}

/* ⚖️ D-109 · 后台开着不动的时候，也得有人替这些单看着表。
   ----------------------------------------------------------------
   D-108 让「打开后台」和「跨端同步」这两下能把陈旧单结算掉。但还漏了最常见的
   一种：后台<b>已经开着</b>，用户这时才下单（同步过来时还没到期，对账当然
   什么都不做），然后用户关掉付款页——之后<b>再没有任何事件</b>会发生。
   于是那张单就停在 PENDING_PAYMENT，名额一直被占着，直到有人想起来刷新。

   所以这里挂一个<b>活的截止触发器</b>：始终只维护<b>一个</b>定时器，
   指向当前所有待付款订单里<b>最近的</b>那个截止时刻。它到点了就调用
   同一个 reconcileExpiredRegistrationOrders()，然后重新算下一个最近截止时刻。

   ⚠️ 定时器只是<b>触发器</b>，不是业务时钟。浏览器会把后台标签页的定时器
   压得很狠，回调迟到几秒甚至几分钟都正常——但那不影响判定：到底过没过期，
   永远是拿<b>当前时间与订单自己的截止时刻</b>比，不是数定时器跳了几次。
   迟到的回调只会让结算晚发生一会儿，绝不会把截止时刻往后顺延。 */
var deadlineTimer = null;

function clearDeadlineTimer(){
  if(deadlineTimer){ clearTimeout(deadlineTimer); deadlineTimer = null; }
}
/* 找出当前所有待付款订单里最近的那个截止时刻（毫秒时间戳），没有就返回 null */
function nextRegistrationDeadlineAt(){
  var next = null;
  (RD.state.orders || []).forEach(function(o){
    if(o.status !== "PENDING_PAYMENT") return;
    var d = RD.deadlineOf(o);
    if(!d) return;
    if(next === null || d < next) next = d;
  });
  /* ⚖️ D-111 C4 · 不另起一个周边定时器（那会变成 timer sprawl）：
     把周边的最近截止时刻并进<b>同一个</b>调度器一起盯。 */
  var m = RD.nextMerchDeadlineAt();
  if(m !== null && (next === null || m < next)) next = m;
  return next;
}
function scheduleDeadlineSweep(){
  clearDeadlineTimer();
  var next = nextRegistrationDeadlineAt();
  if(next === null) return;                 /* 没有待付款订单，不用空转 */
  /* 已经过点的话立刻跑一次；否则等到那一刻（+250ms 容差，避免边界上差几毫秒空跑一趟） */
  var wait = Math.max(0, next - Date.now() + 250);
  deadlineTimer = setTimeout(onDeadlineDue, wait);
}
/* 定时器到点 / 页面重新可见时都走这里：结算 → 有变更才重绘 → 排下一个 */
function onDeadlineDue(){
  deadlineTimer = null;
  var settled = reconcileExpiredRegistrationOrders();
  if(settled.length){
    syncFromDomain();
    render();
    toast("<b>付款窗口到期</b><br><span class='mut'>" + settled.length +
          " 张未付款订单已按既有语义过期：报名侧名额与配额放回公共池（报名 → CANCELLED(ORDER_EXPIRED)），" +
          "周边侧预留库存释放（on_hand 不变）。</span>");
  }
  /* 无论这次有没有结算到东西，都要接着盯下一个最近的截止时刻 */
  scheduleDeadlineSweep();
}

function syncFromDomain(){
  /* 先对账，再把共享对象接过来 —— 渲染出去的必须是<b>结算之后</b>的真实状态 */
  reconcileExpiredRegistrationOrders();
  var nd = buildDB();
  Object.keys(nd).forEach(function(k){ DB[k] = nd[k]; });
  /* 共享状态变了，最近的那个截止时刻可能也变了（比如刚同步进来一张 20 秒后到期的单），
     所以每次同步之后都要重排——否则新单会被旧定时器晾在那儿。 */
  scheduleDeadlineSweep();
}

/* 后台标签页被切走时定时器可能被压制甚至不跑。回到前台就补一次同样的对账——
   这只是<b>补跑</b>，判定口径和上面完全一样，不是第二套过期语义。 */
document.addEventListener("visibilitychange", function(){
  if(!document.hidden) onDeadlineDue();
});
window.addEventListener("focus", function(){ onDeadlineDue(); });

function evOfReg(regId){

function scopeDenialAtExecution(name, args){
  var resolver = OP_EVENT_OF[name];
  if(!resolver) return null;
  var evId = null;
  try { evId = resolver.apply(null, args); } catch(e){ evId = null; }
  if(!evId) return null;
  if(canSeeEvent(evId)) return null;
  return evId;
}
function denyScopeAtExecution(op, evId){
  closeModal();
  var expired = expiredAssignments().filter(function(a){ return a.eventId === evId; })[0];
  var live = assignedEvents();
  toast("<b>已拒绝执行（D-019 赛事范围）</b>：当前身份 <b>" + esc(state.role) + " · " + esc(me().name) +
        "</b> 目前<b>无权操作赛事 " + esc(evId) + "</b>。<br>" +
        (expired
          ? "<span class='mut'>该赛事的指派<b>存在但已不在有效期内</b>（" +
            esc(expired.from || "—") + " ~ " + esc(expired.until || "—") +
            "，当前演示日期 " + esc(state.today) + "）。角色没变，但指派过期了 —— " +
            "光有角色写权限并不足以执行。</span>"
          : "<span class='mut'>没有该赛事<b>生效中</b>的指派（可能已被停用、撤销，或本就指派给别人）。" +
            "当前生效中的赛事：<b>" + esc((live && live.length) ? live.join("、") : "无") + "</b>。</span>") +
        "<br><span class='mut'>渲染按钮时有范围，<b>不等于</b>执行时还有范围。" +
        "本次没有改动任何业务状态，也没有写任何 Audit。</span>", "bad");
  render();
}

function denyAtExecution(op, name){
  /* 已经打开的弹窗必须一并关掉——否则它还挂在那里，看上去像"再点一次就行" */
  closeModal();
  toast("<b>已拒绝执行</b>：当前身份 <b>" + esc(state.role) + " · " + esc(me().name) +
        "</b> 对这个操作没有写权限。<br>" +
        "<span class='mut'>渲染按钮时有权限，<b>不等于</b>执行时还有权限。" +
        "本次没有改动任何业务状态，也没有写任何 Audit。" +
        (whoCanDo(op) ? "可执行的角色：<b>" + whoCanDo(op) + "</b>。" : "") + "</span>", "bad");
  render();
}
/* 把闸门包在每一个有副作用的处理器外面 —— 集中一处，不靠每个处理器自觉 */
(function installExecutionGuard(){
  Object.keys(OP_REQUIRED).forEach(function(name){
    var fn = H[name];
    if(typeof fn !== "function") return;
    var op = OP_REQUIRED[name];
    H[name] = function(){
      /* 两道闸门都要过，缺一不可（D-066 操作权限 ＋ D-019 赛事范围）：
         业务变更与成功 Audit 只发生在两者<b>同时</b>成立之后。 */
      if(!can(op)){ denyAtExecution(op, name); return; }
      var badEv = scopeDenialAtExecution(name, arguments);
      if(badEv){ denyScopeAtExecution(op, badEv); return; }
      return fn.apply(null, arguments);
    };
  });
})();
/* 完整性自检：任何新增的处理器如果既没登记权限、也没标成只读，会出现在这里。
   回归里直接断言它必须是空的——防止以后加了处理器忘了挂闸门。 */
var UNGUARDED_HANDLERS = Object.keys(H).filter(function(k){
  return !OP_REQUIRED[k] && READ_ONLY_HANDLERS.indexOf(k) < 0;
});

/* ================================================================
   7.95) D-092 · 共享 Mock 业务域的落盘与跨端观察
   ----------------------------------------------------------------
   两端共用同一份状态，因此：
     · 任何处理器执行完都要落盘，否则用户端看不到后台刚做的事；
     · 另一端改了状态时要能被观察到，否则又变回两个 Mock 宇宙。
   ⚠️ localStorage 只是 Demo 的载体，不代表任何持久化方案。
   ================================================================ */
(function installDomainPersistence(){
  Object.keys(H).forEach(function(name){
    var fn = H[name];
    if(typeof fn !== "function") return;
    H[name] = function(){
      var out = fn.apply(null, arguments);
      RD.save();
      return out;
    };
  });
})();
RD.watch(function(){
  syncFromDomain();
  render();
  toast("<b>共享业务域已更新</b><br><span class='mut'>另一侧（用户端 / 另一个标签页）刚刚改动了同一份业务对象，本页已同步。</span>");
});

/* ================================================================
   8) 事件绑定 + 渲染
   ================================================================ */
document.addEventListener("click", function(e){
  var c = e.target.closest("[data-close]");
  if(c){ closeModal(); return; }

  var g = e.target.closest("[data-go]");
  if(g){ state.view = g.getAttribute("data-go"); render(); return; }

  var b = e.target.closest("[data-h]");
  if(b){
    if(b.disabled) return;
    var op = b.getAttribute("data-op");
    if(op && !can(op)){
      toast("当前角色 <b>" + state.role + "</b> 无此权限。<br>" +
            "<span class='mut'>docs/12 §13.3 操作 × 角色</span>", "bad");
      return;
    }
    var parts = b.getAttribute("data-h").split(":");
    var fn = H[parts[0]];
    if(typeof fn === "function") fn.apply(null, parts.slice(1));
    return;
  }
});
$("main").addEventListener("change", function(e){
  if(e.target.id === "recdate"){ H.recpick(e.target.value); return; }
  if(e.target.id === "exst"){   state.exStatus  = e.target.value; render(); return; }
  if(e.target.id === "extype"){ state.exType    = e.target.value; render(); return; }
  if(e.target.id === "bibst"){  state.bibStatus = e.target.value; render(); return; }
  if(e.target.id === "ctst"){   state.contentStatus = e.target.value; render(); return; }
});
$("main").addEventListener("keydown", function(e){
  if(e.key !== "Enter") return;
  if(e.target.id === "q" || e.target.id === "scan" || e.target.id === "bibq"){ state.scan = e.target.value; render(); }
  if(e.target.id === "psearch"){ state.photoSearch = e.target.value; render(); }
  if(e.target.id === "auq"){ state.auditQ = e.target.value; render(); }
  if(e.target.id === "ctq"){ state.contentQ = e.target.value; render(); }
});
$("main").addEventListener("click", function(e){

  if(e.target.id === "bibgo"){ state.scan = $("bibq").value; render(); }
  if(e.target.id === "bibclear"){ state.scan = ""; render(); }
  if(e.target.id === "scango"){ state.scan = $("scan").value; render(); }
  if(e.target.id === "qclear" || e.target.id === "scanclear"){ state.scan = ""; render(); }
  if(e.target.id === "psgo"){ state.photoSearch = $("psearch").value; render(); }
  if(e.target.id === "ctgo"){ state.contentQ = $("ctq").value; render(); }
  if(e.target.id === "ctclear"){ state.contentQ = ""; render(); }
  if(e.target.id === "augo"){ state.auditQ = $("auq").value; render(); }
  if(e.target.id === "auclear"){ state.auditQ = ""; render(); }
  if(e.target.id === "psclear"){ state.photoSearch = ""; render(); }
});
function renderRolePicker(){
  var curr = state.role;
  $("role").innerHTML = ROLE_KEYS.map(function(k){
    var info = getRoleInfo(k);
    return '<option value="' + k + '"' + (k === curr ? " selected" : "") + ">" +
           esc(info.label) + "</option>";
  }).join("");
}

function renderDatePicker(){
  var curr = state.today;
  $("today").innerHTML = [
    { v:"2026-11-13", t: t("date_opt_1", "2026-11-13 · 赛前一天（指派尚未生效）") },
    { v:"2026-11-15", t: t("date_opt_2", "2026-11-15 · 比赛日（指派有效）") },
    { v:"2026-11-20", t: t("date_opt_3", "2026-11-20 · 赛后五天（现场指派已过期）") },
    { v:"2026-12-10", t: t("date_opt_4", "2026-12-10 · 赛后一个月（全部过期）") }
  ].map(function(d){
    return '<option value="' + d.v + '"' + (d.v === curr ? " selected" : "") + ">" + esc(d.t) + "</option>";

function renderMockbar(){

    mb.innerHTML = '<b>MOCK / DEMO</b>' +
      '<span>' + esc(t("mock_bar_text", "全部数据为模拟，无后端 · 无数据库 · 无登录 · 无支付。")) + '</span>' +
      '<span class="tag t-demo">' + esc(t("mock_badge", "Admin 业务闭环验证")) + '</span>' +
      '<a class="back" href="./index.html">' + esc(t("back_client", "← 返回用户端首页")) + '</a>';
  }
  var lblRole = $("lbl-role"); if(lblRole) lblRole.innerText = t("lbl_role", "模拟角色");
  var lblStaff = $("lbl-staff"); if(lblStaff) lblStaff.innerText = t("lbl_staff", "模拟身份");
  var lblToday = $("lbl-today"); if(lblToday) lblToday.innerText = t("lbl_today", "演示日期");
  var lblLang = $("lbl-lang"); if(lblLang) lblLang.innerText = t("lbl_lang", "语言");
  var topSub = $("top-brand-sub"); if(topSub) topSub.innerText = t("brand_sub", "运营后台");
}

function renderStaffPicker(){
  var list = staffOf(state.role);
  if(!list.some(function(x){ return x.id === state.staff; })) state.staff = list[0].id;
  $("staff").innerHTML = list.map(function(x){
    var evs = DB.assignments.filter(function(a){ return a.staff === x.id && a.role === x.role && assignmentActive(a); })
                            .map(function(a){ return a.eventId; });
    return '<option value="' + x.id + '"' + (x.id === state.staff ? " selected" : "") + ">" +
           esc(x.name) + " · " + x.id + (evs.length ? "（" + evs.join("/") + "）" : "") + "</option>";
  }).join("");
}

$("staff").addEventListener("change", function(){
  state.staff = this.value;
  invalidateOpenSurfaces("身份");           /* D-066 R1 · 换人即作废已打开的弹窗 */
  var evs = assignedEvents();
  toast("已切换身份：<b>" + esc(me().name) + "</b> · <code>" + state.staff + "</code>" +
        (evs === null ? "" : "<br><span class='mut'>当前可见赛事：" + (evs.length ? evs.join("、") : "无（不在有效期或无指派）") + "</span>"));
  render();
});
$("today").addEventListener("change", function(){
  state.today = this.value;
  toast("演示日期切到 <b>" + state.today + "</b><br><span class='mut'>赛事指派的有效期会按这个日期重新判定（D-019）。</span>");
  render();
});
$("role").addEventListener("change", function(){
  state.role = this.value;
  state.staff = staffOf(state.role)[0].id;          /* 角色变了，身份跟着落到该角色的第一个人 */
  invalidateOpenSurfaces("角色");           /* D-066 R1 · 换角色即作废已打开的弹窗 */
  if(NAV_ACL[state.view].indexOf(state.role) < 0) state.view = "overview";
  var rInfo = getRoleInfo(state.role);
  toast("已切换到 <b>" + state.role + "</b> · " + rInfo.label +
        "<br><span class='mut'>身份：" + esc(me().name) + " · " + state.staff + " —— " + rInfo.note + "</span>");
  render();
});

if($("admin-lang")){
  $("admin-lang").addEventListener("change", function(){
    state.lang = this.value;
    try { localStorage.setItem("run.admin.lang", this.value); } catch(e){}
    var langNames = { zh: "中文 (ZH)", en: "English (EN)", km: "ភាសាខ្មែរ (KM)" };
    toast("Language: <b>" + (langNames[this.value] || this.value) + "</b>");
    render();
  });
}

/* D-066 R1 · 换角色 / 换身份时，把已经打开的弹窗与抽屉直接作废。
   一个开着的确认弹窗是"上一个身份的上下文"，换人之后它不该还能改数据。 */
function invalidateOpenSurfaces(what){
  var hadModal = $("mask").classList.contains("on");
  closeModal();
  closeDrawer();
  if(hadModal){
    toast("已切换" + esc(what) + "，<b>刚才打开的确认弹窗已作废</b>。" +
          "<br><span class='mut'>请以新身份重新发起操作——上一个身份的确认框不能用来改数据。</span>", "warn");
  }
}

function render(){
  if($("admin-lang") && $("admin-lang").value !== state.lang) $("admin-lang").value = state.lang;
  renderMockbar();
  renderRolePicker();
  renderDatePicker();
  if($("role").value  !== state.role)  $("role").value  = state.role;   /* 控件始终反映状态 */
  if($("today").value !== state.today) $("today").value = state.today;
  renderStaffPicker();
  var rInfo = getRoleInfo(state.role);
  $("rolehint").innerHTML = "<b>" + esc(me().name) + "</b> <code>" + state.staff + "</code> · " + esc(rInfo.note);
  renderNav();
  if(NAV_ACL[state.view].indexOf(state.role) < 0) state.view = "overview";
  var body = V[state.view] ? V[state.view]() : "<p>—</p>";
  $("main").innerHTML = body +
    '<div class="note" style="margin-top:1.4rem;border-left-color:var(--demo)">' +
    t("mock_footer", "<b>MOCK / DEMO 提醒：</b>本页所有数据都是模拟对象。") + "</div>";
}

/* ⚖️ D-108 Rule 5 · 「运营把后台打开」这一下就必须够：
   首次渲染之前先对账，于是陈旧的过期单在这一刻就变成 EXPIRED、名额放回，
   页面直接渲染真实状态，而不是先显示一个「应该过期」的假象。 */
syncFromDomain();
render();
toast(t("toast_welcome", "欢迎进入 <b>RUN Admin 交互 Demo</b><br><span class='mut'>右上角可切换角色与语言，直接肉眼验证权限矩阵。全部数据为 MOCK。</span>"));
</script>
