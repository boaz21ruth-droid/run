<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RUN Admin · 运营后台交互 Demo（MOCK）</title>
<!--
  ================================================================
  RUN Admin Demo · SR-002
  ----------------------------------------------------------------
  这是一个「全 MOCK、纯前端、无后端」的运营后台演示页。
  目的：验证 docs/12-Admin一期业务闭环矩阵.md 的 Admin 闭环是否成立
        —— 每个需要人工处理的业务场景，后台有没有落点、有没有按钮、
           谁能操作、操作完有什么业务结果与留痕。

  它不是实现，也不证明后端正确性：
    · 没有 API、没有数据库、没有登录、没有支付、没有对象存储
    · 所有数据是内存里的 JS 对象，刷新即重置
    · 角色切换器是「演示验证器」，不是账号系统

  对应裁决：SR-002（本页）· SR-001（保留的 5 个 Admin 闭环）
  ================================================================
-->
<style>
:root{
  /* D-034 · 运营工作台配色（浅色）。后台的主要工作是长时间读表格、对账单与 CSV，
     并且现场会在平板 / 强光下使用；暗色主题在这两种场景里都是反效果。
     正文与说明文字对底色的对比度不低于 4.5:1，小字号一律用 --ink-mid 以上。 */
  --bg:#f4f6f9; --panel:#ffffff; --panel2:#eef1f6; --line:#d3dae4; --line-strong:#b7c1cf;
  --ink:#111a26; --ink-mid:#3d4a5c; --ink-mute:#5d6b7d;
  --accent:#1257c4; --accent-ink:#0b3f92; --accent-dim:#e3edfd;
  --ok:#0f7a4a; --warn:#9a5a00; --bad:#c02626; --demo:#6b3fa0;
  --r:8px;
  --shadow:0 1px 2px rgba(17,26,38,.06),0 2px 8px rgba(17,26,38,.05);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;cursor:pointer}
a{color:var(--accent-ink)}

/* ---------- MOCK 横幅：整页最显眼的一条 ---------- */
.mockbar{
  background:repeating-linear-gradient(45deg,#f3ecfb,#f3ecfb 12px,#ece1f8 12px,#ece1f8 24px);
  color:#4a2a78; padding:.5rem 1rem; font-size:.82rem; letter-spacing:.02em;
  display:flex; align-items:center; gap:.8rem; flex-wrap:wrap;
  border-bottom:1px solid #d6c0f0;
}
.mockbar b{color:#3d2064}
.mockbar .back{
  margin-left:auto; color:#4a2a78; text-decoration:none; background:#fff;
  border:1px solid #c9aee8; padding:.2rem .7rem; border-radius:99px; font-size:.78rem;
}
.mockbar .back:hover{background:#ece1f8}

/* ---------- 顶栏 ---------- */
.top{
  display:flex; flex-direction:column; gap:.35rem; padding:.55rem 1.1rem;
  background:var(--panel); border-bottom:1px solid var(--line);
  box-shadow:var(--shadow);
}
.top-row{
  display:flex; align-items:center; gap:.75rem; width:100%;
}
.brand{font-weight:700;letter-spacing:.04em;white-space:nowrap}
.brand span{color:var(--accent)}
.top .spacer{flex:1;min-width:.5rem}
.top-controls{
  display:flex; align-items:center; gap:.65rem; flex-wrap:nowrap;
}
.rolebox{display:flex;align-items:center;gap:.35rem;white-space:nowrap}
.rolebox label{font-size:.76rem;color:var(--ink-mid);font-weight:600;white-space:nowrap}
select,input[type=text]{
  background:#fff; color:var(--ink); border:1px solid var(--line-strong);
  border-radius:6px; padding:.3rem .5rem; font-size:.82rem; font-family:inherit;
}
select:focus,input[type=text]:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.rolehint{
  font-size:.78rem;color:var(--ink-mid);line-height:1.4;
  padding-top:.3rem;border-top:1px dashed var(--line);width:100%;
}

/* ---------- 布局 ---------- */
.wrap{display:flex;min-height:calc(100vh - 96px)}
.side{
  width:212px; flex:0 0 212px; background:var(--panel); border-right:1px solid var(--line);
  padding:.7rem 0; position:sticky; top:0; align-self:flex-start;
}
.side h6{margin:.9rem 1rem .35rem;font-size:.72rem;letter-spacing:.1em;color:var(--ink-mid);font-weight:700;text-transform:uppercase}
.side button{
  display:block; width:100%; text-align:left; background:none; border:0; color:var(--ink-mid);
  padding:.52rem 1rem; font-size:.9rem; border-left:3px solid transparent;
}
.side button:hover{background:var(--panel2);color:var(--ink)}
.side button.on{background:var(--accent-dim);color:var(--accent-ink);font-weight:600;border-left-color:var(--accent)}
.side button .n{
  float:right;background:var(--bad);color:#fff;border-radius:99px;
  font-size:.65rem;padding:0 .38rem;line-height:1.5;
}
.side button.locked{color:#93a0b0;cursor:not-allowed}
.side button.locked::after{content:"（无权访问）";font-size:.72rem;color:#93a0b0}
.main{flex:1;padding:1.1rem 1.3rem 4rem;min-width:0}

/* ---------- 通用件 ---------- */
h1{font-size:1.45rem;margin:0 0 .25rem;letter-spacing:-.01em}
.sub{color:var(--ink-mid);font-size:.86rem;margin:0 0 1.1rem;max-width:70ch}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:1rem 1.1rem;margin-bottom:1rem;box-shadow:var(--shadow)}
.card h3{margin:0 0 .6rem;font-size:1rem;font-weight:700}
.grid{display:grid;gap:.8rem}
.g4{grid-template-columns:repeat(auto-fit,minmax(168px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:.8rem .9rem;box-shadow:var(--shadow)}
.kpi .v{font-size:1.7rem;font-weight:700;line-height:1.1}
.kpi .l{font-size:.8rem;color:var(--ink-mid);margin-top:.15rem}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{text-align:left;padding:.52rem .55rem;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--ink-mid);font-weight:700;font-size:.78rem;letter-spacing:.03em;background:var(--panel2);white-space:nowrap}
tr.clickable:hover{background:var(--accent-dim);cursor:pointer}
.tag{display:inline-block;padding:.1rem .5rem;border-radius:99px;font-size:.75rem;font-weight:600;
  border:1px solid var(--line-strong);background:var(--panel2);color:var(--ink-mid);white-space:nowrap}
.t-ok{color:#0f5c39;background:#e4f5ec;border-color:#a9dcc4}
.t-warn{color:#7a4700;background:#fdf1de;border-color:#eccb95}
.t-bad{color:#9e1c1c;background:#fdeaea;border-color:#f0b4b4}
.t-info{color:#0b3f92;background:#e6efff;border-color:#b6cdf5}
.t-demo{color:#5b3390;background:#f2eafb;border-color:#d6c0f0}
/* D-034 §4：状态不能只靠英文枚举和颜色。枚举后面永远跟一段人话。 */
.tag .zh{font-weight:400;opacity:.9}
/* D-034 §3：主 / 次 / 危险三级动作必须一眼分得开，不能只差一个边框色。 */
.btn{background:#fff;color:var(--ink);border:1px solid var(--line-strong);border-radius:6px;
  padding:.34rem .75rem;font-size:.84rem;font-weight:500}
.btn:hover{border-color:var(--accent);color:var(--accent-ink);background:#f3f8ff}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.btn.pri:hover{background:#0e49a8;color:#fff}
.btn.danger{border-color:#e0a2a2;color:#a81f1f;background:#fff;font-weight:700}
.btn.danger:hover{background:#fdeaea;border-color:#c02626;color:#8c1c1c}
/* 禁用不再靠 opacity 压暗——压暗等于隐形，运营会以为"这个按钮不存在"。 */
.btn:disabled{opacity:1;cursor:not-allowed;background:#f1f3f7;border-color:var(--line);
  color:#7a8595;border-style:dashed;font-weight:500}
.btn:disabled:hover{background:#f1f3f7;border-color:var(--line);color:#7a8595}
.row{display:flex;gap:.45rem;flex-wrap:wrap;align-items:center}
.mut{color:var(--ink-mute);font-size:.82rem}
.note{background:#f5f8fc;border:1px solid var(--line);border-left:4px solid var(--accent);
  padding:.6rem .8rem;border-radius:0 6px 6px 0;font-size:.84rem;color:var(--ink-mid);margin:.55rem 0}
.note.warnote{border-left-color:var(--warn);background:#fffaf1}
.note.badnote{border-left-color:var(--bad);background:#fef6f6}
.note.oknote{border-left-color:var(--ok);background:#f2fbf6}
.note b{color:var(--ink)}
.masked{color:#6b7787;font-style:italic}
code{background:var(--panel2);border:1px solid var(--line);padding:.05rem .32rem;border-radius:4px;font-size:.84em;color:#243244}

/* ---------- SR 标记 ---------- */
.srchip{
  display:inline-block;background:#f2eafb;color:#5b3390;border:1px solid #d6c0f0;
  border-radius:99px;padding:.08rem .5rem;font-size:.72rem;margin-left:.35rem;white-space:nowrap;
}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(15,23,35,.44);display:none;align-items:center;justify-content:center;padding:1rem;z-index:60}
.mask.on{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:10px;max-width:640px;width:100%;max-height:86vh;overflow:auto;padding:1.15rem 1.25rem;box-shadow:0 12px 40px rgba(15,23,35,.22)}
.modal h3{margin:0 0 .5rem;font-size:1.08rem}
.modal .acts{display:flex;gap:.5rem;justify-content:flex-end;margin-top:1rem;flex-wrap:wrap}

/* ---------- drawer ---------- */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,96vw);background:var(--panel);border-left:1px solid var(--line);box-shadow:-8px 0 32px rgba(15,23,35,.14);transform:translateX(102%);transition:transform .18s ease;z-index:55;overflow:auto;padding:1.15rem 1.3rem 3rem}
.drawer.on{transform:none}
.drawer .x{position:absolute;top:.7rem;right:.9rem;background:none;border:0;color:var(--ink-mid);font-size:1.5rem;line-height:1}

/* ---------- toast ---------- */
.toasts{position:fixed;right:1rem;bottom:1rem;z-index:70;display:flex;flex-direction:column;gap:.5rem;max-width:23rem}
.toast{background:#fff;border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:6px;padding:.6rem .85rem;font-size:.85rem;box-shadow:0 8px 24px rgba(15,23,35,.16);animation:tin .2s ease}
.toast.bad{border-left-color:var(--bad)}
.toast.warn{border-left-color:var(--warn)}
@keyframes tin{from{opacity:0;transform:translateY(6px)}}

.deny{background:#fdeaea;border:1px solid #f0b4b4;color:#8c1c1c;border-radius:6px;padding:.6rem .8rem;font-size:.84rem;margin:.55rem 0}
.deny b{color:#6f1414}
.scroll{overflow-x:auto}
/* ================================================================
   D-030 / D-034 新增组件
   ================================================================ */
/* 「这个按钮是干什么的」——每个有副作用的动作旁边都挂一个 ⓘ，点开是完整操作逻辑 */
.opi{
  display:inline-flex;align-items:center;justify-content:center;width:1.35rem;height:1.35rem;
  border:1px solid var(--line-strong);background:#fff;color:var(--accent-ink);
  border-radius:99px;font-size:.78rem;font-weight:700;cursor:pointer;padding:0;line-height:1;
}
.opi:hover{background:var(--accent-dim);border-color:var(--accent)}

/* 禁用原因：写在按钮旁边，不藏在 title 里（触屏上 title 根本不存在） */
.whydis{
  display:inline-block;background:#fff6e8;border:1px solid #eccb95;color:#7a4700;
  border-radius:6px;padding:.14rem .5rem;font-size:.76rem;max-width:34rem;
}
.whydis b{color:#5c3500}

/* 高影响动作的执行前影响预览（D-034 §7） */
.impact{border:1px solid var(--line-strong);border-radius:8px;overflow:hidden;margin:.7rem 0}
.impact > h4{margin:0;padding:.45rem .7rem;background:var(--panel2);font-size:.86rem;
  border-bottom:1px solid var(--line);display:flex;gap:.5rem;align-items:center}
.impact .cols{display:grid;grid-template-columns:1fr 1fr;gap:0}
.impact .col{padding:.55rem .7rem;font-size:.84rem}
.impact .col + .col{border-left:1px solid var(--line)}
.impact .col h5{margin:0 0 .35rem;font-size:.78rem;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-mid)}
.impact ul{margin:0;padding-left:1.05rem}
.impact li{margin:.16rem 0}
.impact .does li::marker{color:var(--bad)}
.impact .not li::marker{color:var(--ok)}
.impact .userside{padding:.55rem .7rem;border-top:1px solid var(--line);background:#f5f8fc;font-size:.84rem}
@media(max-width:640px){ .impact .cols{grid-template-columns:1fr} .impact .col + .col{border-left:0;border-top:1px solid var(--line)} }

/* 操作逻辑抽屉（D-030 的 17 个字段） */
.oplogic h4{margin:1rem 0 .2rem;font-size:.82rem;letter-spacing:.04em;text-transform:uppercase;color:var(--accent-ink)}
.oplogic p{margin:.15rem 0 .1rem;font-size:.88rem;color:var(--ink)}
.oplogic .src{font-size:.8rem;color:var(--ink-mute)}
.oplogic .hd{border-bottom:2px solid var(--line);padding-bottom:.5rem;margin-bottom:.2rem}
.oplogic .tfu{background:#fffaf1;border:1px solid #eccb95;border-radius:6px;padding:.5rem .7rem;font-size:.82rem;color:#6d4200;margin-top:.4rem}

/* 状态含义行：这个状态是什么意思 / 谁负责 / 下一步做什么（D-034 §5） */
.stx{font-size:.8rem;color:var(--ink-mid);margin:.15rem 0 0}
.stx b{color:var(--ink)}

/* 列表筛选条（D-034 §8 · 只做执行既有操作所必需的最小筛选） */
.filters{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;
  background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:.45rem .6rem;margin-bottom:.7rem}
.filters label{font-size:.8rem;color:var(--ink-mid);font-weight:600}

/* 用户侧结果预览：后台改完，用户看到的到底是什么 */
.userview{border:1px solid #b6cdf5;background:#f4f8ff;border-radius:8px;padding:.7rem .85rem;margin:.6rem 0}
.userview h4{margin:0 0 .4rem;font-size:.88rem;color:var(--accent-ink)}
.userview .screen{background:#fff;border:1px solid var(--line);border-radius:6px;padding:.6rem .75rem;font-size:.86rem}
.userview .cta{display:inline-block;border-radius:6px;padding:.3rem .8rem;font-weight:700;font-size:.84rem}
.userview .cta.on{background:var(--accent);color:#fff}
.userview .cta.off{background:#f1f3f7;color:#7a8595;border:1px dashed var(--line-strong)}

@media(max-width:760px){
  .wrap{flex-direction:column}
  .side{width:auto;flex:none;position:static;display:flex;flex-wrap:wrap;padding:.4rem}
  .side h6{display:none}
  .side button{width:auto;border-left:0;border-bottom:2px solid transparent;padding:.4rem .7rem}
  .side button.on{border-left:0;border-bottom-color:var(--accent)}
}
</style>
</head>

<div class="mockbar">
  <b>MOCK / DEMO</b>
  <span>全部数据为模拟，无后端 · 无数据库 · 无登录 · 无支付。用户端与本页共用同一份 Mock 业务域，刷新不重置；要回到出厂数据请用 System &amp; Access 里的「重置演示数据」。</span>

<div class="top">
  <div class="top-row">
    <div class="brand" style="display:flex;align-items:center;gap:.35rem"><span style="color:#00E599;font-weight:900">WE</span> <span>RUN</span> <span style="font-weight:400;color:var(--ink-mute)">Admin</span></div>

        </select>
      </div>
    </div>
  </div>
  <div class="rolehint" id="rolehint"></div>
</div>

<div class="wrap">
  <nav class="side" id="side"></nav>
  <main class="main" id="main"></main>
</div>

<div class="mask" id="mask"><div class="modal" id="modal"></div></div>
<div class="drawer" id="drawer"><button class="x" id="drawerx">×</button><div id="drawerbody"></div></div>

<script src="assets/run-domain.js"></script>

function l10n(str){
  if(!str) return str;

  if(lang === "zh") return str;

  if(typeof str === "string" && str.indexOf("过期、报名已 CANCELLED") >= 0){
    if(lang === "en") {
      return str.replace(/订单已于\s*(.*?)\s*过期、报名已 CANCELLED\(ORDER_EXPIRED\)，(.*?)\s*才到账\s*(\$\d+)/g, "Order expired at $1 (CANCELLED), $3 arrived late at $2");

}

/* ================================================================
   D-092 · DB = 共享业务对象 + Admin 独有数据
   ----------------------------------------------------------------
   前者由用户端与后台共用（同一个 Order / Participant / Registration /
   Refund / BibAssignment / 周边全域 / Audit）；
   后者由共享域代为保管，好让「刷新 / 重置」这两件事对整份 Demo 状态一致生效。
   ================================================================ */
function buildDB(){
  if(!RD.state.admin) RD.state.admin = adminSeed();
  var a = RD.state.admin;
  return {
    /* ---- 共享业务对象 ---- */
    /* D-097 · Event / Category / PriceRule 上移到共享域：
       同一个逻辑赛事<b>只能有一套</b>组别、名额、价格档与硬性资格事实。
       用户端结账与后台判定资格 / 价格 / 名额 / 配额时看的必须是这一份。 */
    events: RD.state.events,
    orders: RD.state.orders,                  /* Order / OrderParticipant / Registration */
    refunds: RD.state.refunds,                /* 报名侧 Refund（与用户端同一条状态机） */
    supportRequests: RD.state.supportRequests,/* 用户提交的退款协助请求 —— 不是 Refund */
    bibs: RD.state.bibs,                      /* BibAssignment：仍只有 RESERVED/ASSIGNED/SUPERSEDED/VOIDED */
    bibConfig: RD.state.bibConfig,            /* Event → Category → 号段 / 预留段 / 分配方式 */
    audit: RD.state.audit,                    /* 两端写同一条流水 */
    merch: RD.state.merch,                    /* 周边商品全域 */
    /* ---- Admin 独有 ---- */
    /* ⚖️ D-111 根 B · 报名侧支付异常上移共享域：用户端登记的真实到账
       （超时后才到的钱）在这里<b>立刻</b>看得见，不再是只有种子数据。 */
    exceptions: RD.state.regExceptions,
    /* ⚖️ D-100 根 B · 领物运营事实上移到共享域：后台与现场工作人员端
       写的是<b>同一份</b>。这里只是个别名，不是第二张表。 */
    racepack: RD.state.racePackFacts,
    resultBatches: a.resultBatches, claimCases: a.claimCases,
    photoBatches: a.photoBatches, photos: a.photos, removalRequests: a.removalRequests,
    assignments: a.assignments, contents: a.contents, offlineConflicts: a.offlineConflicts,
    alerts: a.alerts, reconciliations: a.reconciliations, corrections: a.corrections
  };
}

function now(){
  var d = new Date();

function toast(msg, kind){
  var t = document.createElement("div");
  t.className = "toast" + (kind ? " " + kind : "");
  t.innerHTML = msg;

}

function openModal(html){
  var lang = (window.state && window.state.lang) || "zh";
  if(lang !== "zh"){
    var cancelText = lang === 'en' ? 'Cancel' : 'បោះបង់';
    var confirmText = lang === 'en' ? 'Confirm' : 'បញ្ជាក់';
    html = html.replace(/<button class="btn" data-close>取消<\/button>/g, '<button class="btn" data-close>' + cancelText + '</button>');
    html = html.replace(/<button class='btn' data-close>取消<\/button>/g, '<button class=\'btn\' data-close>' + cancelText + '</button>');
    html = html.replace(/<button class="btn pri"([^>]*)>确认<\/button>/g, '<button class="btn pri"$1>' + confirmText + '</button>');
    html = html.replace(/<button class='btn pri'([^>]*)>确认<\/button>/g, '<button class=\'btn pri\'$1>' + confirmText + '</button>');
  }
  $("modal").innerHTML = html;
  $("mask").classList.add("on");
}
function closeModal(){
  $("mask").classList.remove("on");
  $("modal").innerHTML = "";     /* 清空残留表单：否则下一个 handler 可能按 id 读到上一张表单的旧值 */
}

/* ⚖️ D-107 Rule 5 · 付款窗口已经过去的陈旧订单，不该再摆在这里当「可人工取消」：
   它的归宿是 EXPIRED（之后钱若晚到还能走既有的迟到到账处理），而不是终态的
   ORDER_CANCELLED。
   ⚠️ 但这条只用于<b>渲染</b>。执行期<b>不能</b>拿它去挡：一挡，那张陈旧单就
   原地不动、名额继续占着，反而比不拦更糟。执行期要把它交给共享域，
   由域把它<b>结算成 EXPIRED</b> —— 那才是它真正的归宿。 */
function prepayDeadlineNote(o){
  if(!RD.pastDeadline(o)) return null;
  return "付款窗口已于 " + (o.deadline || "—") + " 截止：这张单应按<b>过期</b>处理（ORDER_EXPIRED），" +
         "不能按人工取消记账（ORDER_CANCELLED 是终态，进不了迟到到账处理）";
}
function prepayBlockReason(o, forExecution){
  if(o.status !== "PENDING_PAYMENT") return "订单不是 PENDING_PAYMENT";
  if(o.paidAt) return "该订单已确认到账";
  if(!forExecution){
    var dn = prepayDeadlineNote(o);

function opBtn(op, label, handler, cls, o){

  o = o || {};
  var lang = (window.state && window.state.lang) || "zh";
  var locLabel = label;
  if(lang !== "zh" && BUTTON_I18N[label] && BUTTON_I18N[label][lang]){
    locLabel = BUTTON_I18N[label][lang];
  } else if(lang !== "zh" && typeof label === "string" && label.startsWith("创建补退")){
    locLabel = lang === 'en' ? label.replace("创建补退", "Create Supplemental Refund") : label.replace("创建补退", "បង្កើតការសងប្រាក់បន្ថែម");
  }
  var ok = can(op);
  var why = null;
  if(!ok){
    var rInfo = getRoleInfo(state.role);
    if(lang === 'en'){
      why = "No Permission: Current role <b>" + esc(state.role) + " · " + esc(rInfo.label) + "</b> is " +
            (perm(op) === "R" ? "Read-Only" : "Restricted") + " for \"" + esc(locLabel) + "\"." +
            (whoCanDo(op) ? " Authorized roles: <b>" + whoCanDo(op) + "</b>." : "");
    } else if(lang === 'km'){
      why = "គ្មានសិទ្ធិ៖ តួនាទី <b>" + esc(state.role) + " · " + esc(rInfo.label) + "</b> គឺ " +
            (perm(op) === "R" ? "មើលប៉ុណ្ណោះ" : "គ្មានសិទ្ធិ") + " សម្រាប់ \"" + esc(locLabel) + "\"។" +
            (whoCanDo(op) ? " តួនាទីមានសិទ្ធិ៖ <b>" + whoCanDo(op) + "</b>។" : "");
    } else {
      why = "无权限：当前身份 <b>" + esc(state.role) + " · " + esc(rInfo.label) + "</b> 对「" +
            esc(locLabel) + "」是「" + (perm(op) === "R" ? "只读" : "不可见") + "」。" +
            (whoCanDo(op) ? "可执行的角色：<b>" + whoCanDo(op) + "</b>。" : "");
    }
  } else if(o.block){
    why = o.block;
  }
  var b = '<button class="btn ' + (cls||"") + '" ' + (why ? "disabled " : "") +
          'data-op="' + esc(op) + '" data-h="' + esc(handler) + '">' + esc(locLabel) + "</button>";
  var infoKey = o.info || op;
  return '<span class="row" style="gap:.35rem">' + b + opInfoBtn(infoKey) +
         (why ? '<span class="whydis">' + why + "</span>" : "") + "</span>";
}
function whoCanDo(op){
  return ROLE_KEYS.filter(function(r){ return perm(op, r) === "W"; }).join(" / ");
}
/* 只读的信息按钮：不带权限，任何角色都可以先弄明白「这个按钮是干什么的」 */

function seeBankRef(){ return ["ADMIN","OPS","FINANCE"].indexOf(state.role) >= 0; }
function txnMask(v){
  if(seeBankRef()) return "<code>" + esc(v) + "</code>";
  return '<span class="masked" title="SUPPORT 不可见银行 / 通道流水（§13.4：只见金额，不见银行信息）">银行信息不可见</span>';
}
/* 凭证 / 依据是自由文本，财务经常把银行流水号写在里面。
   对没有银行信息权限的角色，整段遮蔽 —— 逐字符打码没有意义，一段凭证本身就是银行信息。 */
function proofSafe(v){
  if(v == null || v === "") return "—";
  if(seeBankRef()) return esc(v);
  return '<span class="masked" title="SUPPORT 不可见凭证 / 银行流水（§13.4）">凭证与银行信息不可见</span>';
}

/* AR-F-009 · 导航角标是数据，必须和 Overview 用同一个 scope 源。
   角标泄漏比页面泄漏更隐蔽：工作区锁着，红点却把队列长度报了出去。 */
function counts(){
  var sc = inboxScope();
  var c = { payments:0, photos:0, orders:0, results:0 };
  if(sc.money){
    c.payments = DB.exceptions.filter(function(e){
      return e.status === "OPEN" && canSeeEvent((findOrder(e.orderId) || {}).eventId); }).length;
  }
  /* 退款队列条数属于财务信息：要看「能不能看退款」，不是「能不能看订单」。
     RACE_SUPERVISOR 可以按指派查订单（§13.3 order_view = R），但退款相关整行都是「—」。 */
  if(canRead("refund_approve") || canRead("refund_request")){
    c.orders = DB.refunds.filter(function(r){
      return (r.status === "REQUESTED" || r.status === "APPROVED") &&
             canSeeEvent((findOrder(r.orderId) || {}).eventId); }).length;
  }
  if(sc.photos){
    c.photos = DB.removalRequests.filter(function(r){
      var p = DB.photos.filter(function(x){ return x.id === r.photoId; })[0];
      return r.status === "REQUESTED" && p && canSeeEvent(p.eventId); }).length;
  }
  if(sc.results){ c.results = DB.claimCases.filter(function(x){ return x.status === "RECEIVED"; }).length; }
  /* 兜底：工作区不可见就绝不带角标 */
  Object.keys(c).forEach(function(k){ if(NAV_ACL[k].indexOf(state.role) < 0) c[k] = 0; });
  return c;
}

"refund_settle": { t:"退款结算（三段式第 3 段 · 全系统最贵的一次点击）",

     "<b>实际打款金额必须是有限数且 &gt; 0</b>——空值 / 0 / 负数 / 非数字 / NaN 一律在<b>改动任何业务状态之前</b>被拒。",
  seq:"校验 → settled_amount 落库（写入后不可改且 > 0）→ 该行 → REFUNDED → " +

  st:"Refund: APPROVED → SETTLED；OrderParticipant: REFUND_PENDING → REFUNDED（<b>两条分支都一样</b>）。" +
     "<br><b>分支 A · Registration 当前 = CONFIRMED</b>：Registration: CONFIRMED → CANCELLED(REFUND_SETTLED)。" +
     "<br><b>分支 B · Registration 已因别的合法原因 CANCELLED</b>（例如 LATE_ARRIVAL 拒绝对应的 <code>CANCELLED(ORDER_EXPIRED)</code>）：" +
     "<b>Registration 不变</b>。" +
     "<br>订单聚合：生命周期从未被恢复过的订单（EXPIRED / CANCELLED / PENDING_PAYMENT）<b>不因本次结算改变状态</b>。",
  at:"<b>分支 A（Registration 当前 = CONFIRMED）</b>：Category capacity <b>恰好释放一次</b>，该行移出领物名单；PriceRule quota <b>不恢复</b>（早鸟卖完就是卖完 · D-003）。" +

  ar:"该行显示已退款终态。订单聚合状态在<b>正常生命周期</b>下跟着变（PAID / PARTIALLY_REFUNDED / REFUNDED）；" +

  ur:"两条分支都能看到「退款已完成」与实际到账金额。" +

     "<br><b>分支 B</b>：参赛资格<b>在更早的时候就已经不在了</b>，本次只是钱到账，用户侧不会出现「刚刚被取消」这种误导。",
  ex:"同单其他人完全不受影响。分支 B 下，该行的 Registration、capacity、quota <b>一个都不动</b>。",
  dup:"<b>精确判定条件（D-035）</b>：<b>只有当 Registration 当前是 <code>CONFIRMED</code> 时</b>，STANDARD 退款结算才执行 <code>Registration: CONFIRMED → CANCELLED(REFUND_SETTLED)</code> 并<b>释放一次</b> Category capacity。<b>已经因为别的合法原因处于 CANCELLED 的报名，不得再次承受这两个副作用。</b>补退（SUPPLEMENTAL）结算走另一条路径，不重复履约。",
  fp:"凭证未填 / 状态不是 APPROVED / 金额非法（空、0、负数、非数字、NaN、Infinity）/ 传进来的是 SUPPLEMENTAL —— " +

  rev:"<b>不可逆</b>。金额打错不回改历史：少退走 SUPPLEMENTAL 补退，多退走 RefundCorrection，两条路都不产生负金额。",
  au:"线下打款凭证、打款人、到账日期、实际金额；<b>以及本次走的是哪条分支</b>——" +

/* ================================================================
   4.6) D-033 / D-031 R4 · 赛事与成绩的业务判定
   ================================================================ */
function findEvent(id){ return DB.events.filter(function(e){ return e.id === id; })[0]; }
/* 「赛事已结束」在 Demo 里的判定：演示日期晚于赛事日期。
   真实的结束时间字段（每组 cut-off / 赛事结束时刻）属于 Backend Technical Design，
   这里不代它冻结字段名，只把这条前置校验做成可以被点出来的东西。 */
function eventEnded(ev){ return !!ev && state.today > ev.date; }
/* 发布赛事的前置校验 —— docs/12 §9「发布赛事」行的原文：
     「至少 1 个组别；每组有 Start / Cut-off / 名额 / PriceRule；Race Pack 配置完整」
   逐条列出，不合并成一句「满足发布条件」。
   P1-3：中间三项是「**每一个**组别」，不是「有一个组别」——
   只要有一组不完整，发布就必须被挡住，并且要说得出是哪一组缺哪一项。 */
function publishGates(ev){
  var n = ev.categories.length;
  function lacking(pred){ return ev.categories.filter(pred).map(function(c){ return c.name; }); }
  var noStart  = lacking(function(c){ return !c.start; });
  var noCutoff = lacking(function(c){ return !c.cutoff; });
  var noCap    = lacking(function(c){ return !(c.cap > 0); });
  var noPrice  = lacking(function(c){
    var ids = c.priceRuleIds || [];
    return !ids.some(function(id){ return ev.priceRules.some(function(r){ return r.id === id; }); });
  });
  function gate(list, label){
    return { ok: n >= 1 && list.length === 0, t: label,
             d: n < 1 ? "还没有任何组别"
                : list.length ? "缺这 " + list.length + " 组：" + list.join("、")
                : "全部 " + n + " 组均已配置" };
  }
  return [
    { ok: n >= 1, t:"至少 1 个组别", d:"当前 " + n + " 个" },
    gate(noStart,  "每个组别都有 Start（起跑时间）"),
    gate(noCutoff, "每个组别都有 Cut-off（关门时间）"),
    gate(noCap,    "每个组别都有名额（Capacity）"),
    gate(noPrice,  "每个组别都有 PriceRule（价格档）"),
    { ok: !!ev.racePackConfigured, t:"Race Pack 配置完整",
      d: ev.racePackConfigured ? "已配置" : "尚未配置（物资清单 / 领取点未填）" }
  ];
}
function gatesPass(g){ return g.every(function(x){ return x.ok; }); }
/* ⚖️ D-118 R1 · 草稿赛事的「编辑赛事配置」入口。
   用<b>既有的</b> event_config 权限，不新增权限行：OPS 是 W（可编辑保存），
   ADMIN 是 R（能看不能存），SUPPORT / 现场角色本来就看不到这些数据。
   打开弹窗本身不改任何业务状态，所以它是只读处理器；
   真正的写入口 evcfgok 才挂 event_config 闸门（见 OP_REQUIRED）。 */
function evCfgBtn(e){
  if(!canRead("event_config")) return "";
  var ro = !can("event_config");

          "可以逐条看清楚缺哪一项，但<b>不能保存</b>。可执行的角色：<b>" + whoCanDo("event_config") + "</b>。</span>" : "") +

function gateList(g){
  return "<ul style='margin:.3rem 0;padding-left:1.1rem'>" + g.map(function(x){
    return "<li>" + (x.ok ? "<span class='tag t-ok'>已满足</span>" : "<span class='tag t-bad'>未满足</span>") +
           " " + esc(x.t) + " <span class='mut'>—— " + esc(x.d) + "</span></li>";
  }).join("") + "</ul>";
}
/* 成绩发布的四条前置（D-031 R4：四条都要，第 3 条必须是「赛事已结束」这句原话） */
function resultPublishGates(b){
  var ev = findEvent(b.eventId);
  /* F-002 · 组别身份必须是真实存在的 Category。缺 catId 一律 fail closed——
     绝不允许「没有 catId」绕过唯一性校验。 */
  var catOk = !!(ev && b.catId && ev.categories.some(function(c){ return c.id === b.catId; }));
  var other = catOk ? DB.resultBatches.filter(function(x){
    return x.id !== b.id && x.eventId === b.eventId && x.catId === b.catId && x.status === "PUBLISHED"; }) : [];
  return [
    { ok: b.status === "VALIDATED", t:"批次为 VALIDATED", d:"当前 " + b.status },
    { ok: b.bad === 0 || b.badIgnored === true, t:"异常行已处理，或已明确忽略并写明原因",
      d: b.bad === 0 ? "0 异常行" : (b.badIgnored ? b.bad + " 条异常行已明确忽略：" + (b.badIgnoreReason || "") : b.bad + " 条异常行未处理") },
    { ok: eventEnded(ev), t:"赛事已结束（EVENT HAS ENDED）",
      d: ev ? ("赛事日期 " + ev.date + "，当前演示日期 " + state.today + (eventEnded(ev) ? "，已结束" : "，尚未结束")) : "找不到赛事" },
    { ok: catOk, t:"批次绑定了该赛事下真实存在的组别（catId）",
      d: catOk ? "已绑定 " + b.catId + "（" + b.cat + "）"
               : "缺少有效 catId —— <b>唯一性校验无法进行，一律拒绝发布（fail closed）</b>" },
    { ok: catOk && other.length === 0, t:"同一赛事 + 同一组别（eventId, catId）没有其他 PUBLISHED 批次",
      d: !catOk ? "无法判定：缺少有效 catId"
        : other.length ? "冲突批次：" + other.map(function(x){ return x.id; }).join("、") : "无冲突" }
  ];
}
/* docs/12 §9「作废 Bib」：该号未产生成绩 */
function bibResultFacts(bib){
  return DB.resultBatches.filter(function(b){ return (b.bibs || []).indexOf(bib) >= 0; });
}

  "总览": "grp_overview",
  "赛事与交易": "grp_trade",
  "周边商品": "grp_merch",
  "现场": "grp_field",

};

var NAV = [

  { g:"赛事与交易", items:[ ["events","Events · 赛事"], ["orders","Registrations &amp; Orders"], ["payments","Payments &amp; Exceptions"] ] },
  { g:"现场",   items:[ ["racepack","Race Pack"], ["bib","Bib Operations"] ] },
  { g:"赛后",   items:[ ["results","Results"], ["photos","Photos"] ] },
  /* D-043 · 活动内容从 Events 里搬出来，成为独立的顶层工作区（已批准的 IA 迁移，不是新能力） */
  { g:"内容",   items:[ ["content","Content · 活动内容"] ] },
  { g:"系统",   items:[ ["system","System &amp; Access"] ] }
];

function renderNav(){
  var c = counts(), h = "";
  NAV.forEach(function(sec){
    var gKey = GRP_KEY_MAP[sec.g] || sec.g;
    var gTitle = t(gKey, sec.g);
    h += "<h6>" + esc(gTitle) + "</h6>";
    sec.items.forEach(function(it){
      var key = it[0], allowed = NAV_ACL[key].indexOf(state.role) >= 0;
      var n = c[key] ? '<span class="n">' + c[key] + "</span>" : "";
      var nKey = NAV_KEY_MAP[key];
      var label = nKey ? t(nKey, it[1]) : it[1];
      h += '<button data-nav="' + key + '" class="' + (state.view === key ? "on " : "") +
           (allowed ? "" : "locked") + '"' + (allowed ? "" : " disabled title=\"" + esc(t("locked_tip", "当前角色不可见该工作区")) + "\"") + ">" +
           label + (allowed ? n : "") + "</button>";
    });
  });
  $("side").innerHTML = h;
}
$("side").addEventListener("click", function(e){
  var b = e.target.closest("button[data-nav]");
  if(!b || b.disabled) return;
  state.view = b.getAttribute("data-nav");
  render();
});

   现场与摄影角色既看不到财务异常，也看不到未指派赛事的任何东西。 */
function inboxScope(){
  return {
    money:   NAV_ACL.payments.indexOf(state.role) >= 0 && seeMoney(),  /* 能看财务异常与退款队列 */
    orders:  NAV_ACL.orders.indexOf(state.role)   >= 0,
    photos:  can("photo_removal_review"),                              /* 只有 OPS / ADMIN 审删除申请 */
    results: NAV_ACL.results.indexOf(state.role)  >= 0,
    events:  NAV_ACL.events.indexOf(state.role)   >= 0,
    field:   ["RACE_SUPERVISOR","RACE_STAFF"].indexOf(state.role) >= 0,
    photog:  state.role === "PHOTOGRAPHER"
  };
}

        ? " " + (e.registrationOpen ? "<span class='tag t-ok'>报名开放</span>" : "<span class='tag t-warn'>报名已暂停</span>") +
          " " + (e.publicVisible ? "<span class='tag t-ok'>公开展示中</span>" : "<span class='tag t-warn'>已隐藏公开展示</span>")
        : "") + "</h3>" +
      statusExplain(e.status) + "</div>" +
      "<div class='row'>" +
      (e.status === "DRAFT"
        ? evCfgBtn(e) + opBtn("event_publish", "发布赛事", "pub:" + e.id, "pri",
            { block: canPub ? null : "<b>发布前置校验未通过</b>，还差 " +
                gates.filter(function(g){ return !g.ok; }).length + " 条：" +
                gates.filter(function(g){ return !g.ok; }).map(function(g){ return esc(g.t) + "（" + esc(g.d) + "）"; }).join("；") + "。" })
        : "<span class='mut'>已发布 · 用下面两个独立开关控制对外形态</span>") +
      "</div></div>" +
      "<p class='mut'>" + esc(e.date) + " · " + esc(e.city) + " · <code>" + e.id + "</code>" +
      (eventEnded(e) ? " · <span class='tag t-info'>赛事已结束</span>" : " · <span class='tag'>赛事尚未结束</span>") +
      "（按演示日期 " + esc(state.today) + " 判定）</p>";

    /* 发布前置：DRAFT 时逐条列出，不给「不满足发布条件」这种没用的说法 */
    if(e.status === "DRAFT"){
      h += '<div class="note' + (canPub ? " oknote" : " badnote") + '"><b>发布前置校验（docs/12 §9「发布赛事」行原文：' +
        "至少 1 个组别；<u>每组</u>有 Start / Cut-off / 名额 / PriceRule；Race Pack 配置完整）</b>" +
        gateList(gates) +
        (canPub ? "<b>全部满足，可以发布。</b>"
                : "<b>没过的那几条就是「发布」按钮为什么是灰的。</b>「每组」是<b>每一个</b>组别——只要有一组缺项，就不能发布。") + "</div>";
    }

    /* ---------- D-033 · 两个独立的运营开关 ---------- */
    if(e.status === "PUBLISHED"){
      h += '<div class="card" style="margin:.7rem 0 0;box-shadow:none;background:var(--panel2)">' +
        '<h3 style="margin:0 0 .5rem">运营开关 <span class="srchip">D-033 · 两个开关互不联动</span></h3>' +

        "<div class='row' style='justify-content:space-between;align-items:flex-start;padding:.4rem 0;border-bottom:1px solid var(--line)'>" +
        "<div style='max-width:38rem'><b>① 报名开关：" + (e.registrationOpen ? "开放报名" : "已暂停报名") + "</b>" +
        "<p class='stx'>暂停之后：<b>不能创建新报名 / 新订单</b>；赛事仍是 PUBLISHED；" +
        "已存在的待付款订单<b>不会被取消</b>，继续按原有的过期与付款规则走；已确认的报名保持有效；" +
        "Payment / Bib / Race Pack / Results / Photos 全部不动。</p></div>" +
        "<div class='row'>" +
        (e.registrationOpen
          ? opBtn("event_publish", "停止报名", "regstop:" + e.id, "danger", { info:"reg_pause" })
          : opBtn("event_publish", "恢复报名", "regopen:" + e.id, "pri",   { info:"reg_pause" })) +
        "</div></div>" +

        "<div class='row' style='justify-content:space-between;align-items:flex-start;padding:.5rem 0 .2rem'>" +
        "<div style='max-width:38rem'><b>② 公开展示开关：" + (e.publicVisible ? "公开展示中" : "已隐藏公开展示") + "</b>" +
        "<p class='stx'>隐藏之后：赛事<b>不再出现在公开列表 / 搜索 / 推荐</b>；" +
        "<b>已报名用户仍然可以到达自己的订单、报名与参赛凭证</b>；订单、报名、Payment、Bib、Race Pack、Results、Photos 全部不动。</p></div>" +
        "<div class='row'>" +
        (e.publicVisible
          ? opBtn("event_publish", "隐藏公开展示", "pubhide:" + e.id, "danger", { info:"public_hide" })
          : opBtn("event_publish", "恢复公开展示", "pubshow:" + e.id, "pri",   { info:"public_hide" })) +
        "</div></div>" +

        '<div class="note" style="margin-bottom:0"><b>这两个开关不会互相带动。</b>' +
        "「停止报名」不会把赛事藏起来（老用户照样能看到详情页），「隐藏公开展示」也不会顺手关掉报名" +
        "（拿到直达链接的人仍可报名，除非你另外把报名也停掉）。<b>要两个都关，就点两次，各留一条痕。</b></div></div>";

      /* ---------- 用户侧结果预览 ---------- */
      h += '<div class="userview"><h4>用户侧现在长这样（网站 / MiniApp 同一份用户可见结果）</h4>' +
        "<div class='grid g2'>" +
        "<div class='screen'><b>公开列表 / 搜索</b><p class='stx'>" +
          (e.publicVisible
            ? "✅ 这场赛事<b>出现在</b>公开列表与搜索结果里。"
            : "🚫 这场赛事<b>不出现</b>在公开列表与搜索结果里。<b>但已报名用户从「我的报名」仍可进入</b>，订单 / 报名 / 参赛凭证一切照常。") +
          "</p></div>" +
        "<div class='screen'><b>赛事详情页 · 报名入口</b><p class='stx'>" +
          (e.registrationOpen
            ? "<span class='cta on'>立即报名</span> —— 可创建新报名（仍需满足报名时间、名额与价格档等原有条件）。"
            : "<span class='cta off'>报名已暂停</span> —— 不能创建新报名；<b>已下单未付款的用户仍可以完成付款</b>。") +
          "</p></div></div>" +
        "<p class='stx' style='margin-top:.5rem'><b>本 Demo 只描述「用户看到什么」，不新增任何前端渠道 Scope</b>——" +
        "渠道形态（网站 / MiniApp）由 docs/09 决定，本次未改。</p></div>";
    }

    /* AR-F-010 · event_config 对 SUPPORT 是「—」：不是禁用按钮，是这些数据根本不渲染 */
    if(!canRead("event_config")){
      h += '<div class="deny" style="margin-top:.6rem"><b>组别名额、PriceRule（价格 / quota / 适用人群）、Sponsor 配置对当前角色不可见。</b><br>' +
        "docs/12 §13.3「PriceRule / 名额 / Sponsor 配置」一行对 <code>" + state.role + "</code> 是「—」——" +
        "<b>这是数据可见性，不是按钮禁用</b>：客服答复用户「这场还有没有名额」不需要看到价格档结构与赞助商合约配置。</div></div>";
      return;
    }
    h += "<div class='grid g3' style='margin-top:.6rem'>";
    h += "<div><h3 style='font-size:.8rem'>组别 / Capacity</h3><table><tbody>";
    e.categories.forEach(function(k){
      var pct = k.cap > 0 ? Math.round(k.used / k.cap * 100) : 0;
      var prs = (k.priceRuleIds || []).filter(function(id){
        return e.priceRules.some(function(r){ return r.id === id; }); });
      h += "<tr><td>" + esc(k.name) +
           "<br><span class='mut'>Start " + (k.start ? esc(k.start) : "<b style='color:var(--bad)'>未配置</b>") +
           " · Cut-off " + (k.cutoff ? esc(k.cutoff) : "<b style='color:var(--bad)'>未配置</b>") +
           " · 价格档 " + (prs.length ? prs.length + " 档" : "<b style='color:var(--bad)'>未配置</b>") + "</span></td>" +
           "<td style='text-align:right'>" + k.used + " / " + (k.cap > 0 ? k.cap : "<b style='color:var(--bad)'>未配置</b>") +
           (k.cap > 0 ? " <span class='tag " + (pct > 90 ? "t-bad" : pct > 70 ? "t-warn" : "t-ok") + "'>" + pct + "%</span>" : "") +
           "</td></tr>";
    });
    h += "</tbody></table></div>";

    h += "<div><h3 style='font-size:.8rem'>PriceRule / quota</h3><table><tbody>";
    e.priceRules.forEach(function(p){
      var full = p.used >= p.quota;
      h += "<tr><td>" + esc(p.name) + "<br><span class='mut'>" + esc(p.window) + " · " + esc(p.audience) + "</span></td>" +
           "<td style='text-align:right'>" + (seeMoney() ? "$" + p.price : "—") + "<br><span class='tag " + (full ? "t-bad" : "t-ok") + "'>" +
           p.used + "/" + p.quota + (full ? " 售罄" : "") + "</span></td></tr>";
    });
    h += "</tbody></table></div>";

    h += "<div><h3 style='font-size:.8rem'>Sponsor（赛事级）</h3>";
    if(!e.sponsors.length) h += "<p class='mut'>未配置</p>";
    e.sponsors.forEach(function(sp){
      h += "<p style='margin:.2rem 0'>" + esc(sp.name) + " " +
           "<span class='tag " + (sp.watermark ? "t-ok" : "") + "'>水印 " + (sp.watermark ? "开" : "关") + "</span> " +
           "<span class='tag " + (sp.freeClaim ? "t-ok" : "") + "'>免费领取 " + (sp.freeClaim ? "开" : "关") + "</span></p>";
    });
    h += "</div></div></div>";
  });
  h += '<div class="note">Sponsor 配置挂在<b>赛事之下</b>，不是全局配置（docs/12 §零 裁决 3）。价格档售罄会自动落下一档，这里只展示配置态。</div>';
  /* ---------- 优惠码与 VIP 优免规则看板 ---------- */
  var cps = RD.coupons ? RD.coupons() : [];
  h += '<div class="card" style="margin-top:1.2rem"><div class="row" style="justify-content:space-between;align-items:center">' +
    '<div><h3 style="margin:0">Coupons & VIP Waivers · 优惠码与优免规则</h3>' +
    '<p class="stx" style="margin-top:.2rem">支持<b>金额立减</b>、<b>百分比折扣</b>、<b>团购优免</b>与 <b>100% 全额免费 VIP 优免码（0元直通出票）</b>。</p></div>' +
    (can("event_publish") ? '<button class="btn sm" data-h="cpnew">＋ 新增优惠码</button>' : '') +
    '</div><div class="scroll" style="margin-top:.6rem"><table><thead><tr>' +
    '<th>优惠代码</th><th>类型</th><th>面额 / 规则</th><th>适用范围</th><th>核销配额</th><th>已核销</th><th>状态</th>' +
    '</tr></thead><tbody>';
  if(!cps.length){
    h += '<tr><td colspan="7" class="mut">暂无配置优惠码</td></tr>';
  } else {
    cps.forEach(function(cp){
      var tBadge = cp.type === "WAIVER" ? '<span class="tag t-ok">100% VIP 全免</span>'
        : (cp.type === "PERCENT" ? '<span class="tag t-info">' + (100 - cp.value) / 10 + ' 折券</span>'
        : '<span class="tag">立减 $' + cp.value + '</span>');
      var rScope = cp.minRunners ? '<span class="tag t-warn">团购 ' + cp.minRunners + ' 人起</span>' : '全员通用';
      h += '<tr><td><code>' + esc(cp.code) + '</code></td><td>' + tBadge + '</td>' +
        '<td><b>' + esc(cp.desc) + '</b></td><td>' + rScope + '</td>' +
        '<td>' + cp.quota + '</td><td>' + cp.used + '</td>' +
        '<td>' + (cp.used >= cp.quota ? '<span class="tag t-bad">已满额</span>' : '<span class="tag t-ok">生效中</span>') + '</td></tr>';
    });
  }
  h += '</tbody></table></div></div>';
  return h;
};

/* ---------- Registrations & Orders ---------- */
V.orders = function(){
  var q = (state.scan || "").trim().toLowerCase();
  var sub = state.lang === 'en' ? 'Search by name, phone, Bib, or order ID. Multi-participant orders can be expanded individually.' :
            (state.lang === 'km' ? 'ស្វែងរកតាមឈ្មោះ ទូរស័ព្ទ Bib ឬលេខបញ្ជាទិញ។' : '按姓名 / 手机 / Bib / 订单号搜索；一单多人可逐个 Participant 展开。');
  var ph = state.lang === 'en' ? 'Search: Name / Phone / Bib / ORD-1001' : (state.lang === 'km' ? 'ស្វែងរក៖ ឈ្មោះ / ទូរស័ព្ទ / Bib / ORD-1001' : '搜索：姓名 / 手机 / Bib / ORD-1001');
  var btnSearch = state.lang === 'en' ? 'Search' : (state.lang === 'km' ? 'ស្វែងរក' : '搜索');
  var btnClear = state.lang === 'en' ? 'Clear' : (state.lang === 'km' ? 'សម្អាត' : '清空');

  var h = "<h1>" + esc(t("nav_orders", "报名与订单")) + "</h1><p class='sub'>" + esc(sub) + "</p>";
  h += '<div class="card"><div class="row"><input type="text" id="q" placeholder="' + esc(ph) + '" value="' +
       esc(state.scan) + '" style="flex:1;min-width:220px"><button class="btn" id="qgo">' + btnSearch + '</button>' +
       '<button class="btn" id="qclear">' + btnClear + '</button></div></div>';

  var list = DB.orders.filter(function(o){
    if(!canSeeEvent(o.eventId)) return false;
    if(!q) return true;
    if(o.id.toLowerCase().indexOf(q) >= 0) return true;
    if(o.buyer.toLowerCase().indexOf(q) >= 0) return true;
    if(o.phone.replace(/\s/g,"").indexOf(q.replace(/\s/g,"")) >= 0) return true;
    return o.participants.some(function(p){
      return (p.name || "").toLowerCase().indexOf(q) >= 0 || (p.bib || "").indexOf(q) >= 0;
    });
  });

  if(!list.length) h += '<div class="card"><p class="mut">没有匹配的订单。</p></div>';

  list.forEach(function(o){
    var oev = findEvent(o.eventId);
    var archBlock = eventEnded(oev) ? null :
      "<b>赛事尚未结束</b>，不能归档（docs/12 §9「订单归档」前置校验）。赛事日期 " +
      esc(oev ? oev.date : "—") + "，当前演示日期 " + esc(state.today) + "。";
    h += '<div class="card"><div class="row" style="justify-content:space-between;align-items:flex-start">' +
      "<div><h3 style='margin:0'>" + esc(o.id) + " " + statusTag(o.status) +
      (o.archived ? " <span class='tag t-warn'>已归档（仅后台视野，用户无感）</span>" : "") +
      (o.unarchiveReason ? " <span class='tag t-info' title='" + esc(o.unarchiveReason) + "'>曾取消归档</span>" : "") + "</h3>" +
      "<p class='mut' style='margin:.25rem 0 0'>下单人 " + pii(o.buyer) + " · " + phoneMask(o.phone) +
      " · 总额 " + money(o.amount) + " " + esc(o.currency) + (o.paidAt ? " · 付款 " + esc(o.paidAt) : " · 未付款") + "</p>" +
      statusExplain(o.status) + "</div>" +
      "<div class='row'>" +
      (o.status === "PENDING_PAYMENT" ? prepayBtn(o) : "") +
      (o.status !== "PENDING_PAYMENT"
        ? opBtn("order_archive", o.archived ? "取消归档" : "归档", "arch:" + o.id, "", { block: archBlock })
        : "") +
      "</div></div>";

    var thPart = state.lang === 'en' ? 'Participant' : (state.lang === 'km' ? 'អ្នកចូលរួម' : '参赛者');
    var thBib = 'Bib';
    var thCat = state.lang === 'en' ? 'Category' : (state.lang === 'km' ? 'វិញ្ញាសា' : '组别');
    var thAmt = state.lang === 'en' ? 'Amount' : (state.lang === 'km' ? 'ចំនួនប្រាក់' : '金额');
    var thRegSt = state.lang === 'en' ? 'Reg Status' : (state.lang === 'km' ? 'ស្ថានភាពចុះឈ្មោះ' : '报名状态');
    var thFinSt = state.lang === 'en' ? 'Financial' : (state.lang === 'km' ? 'ស្ថានភាពហិរញ្ញវត្ថុ' : '财务状态');
    var thPack = state.lang === 'en' ? 'Race Pack' : (state.lang === 'km' ? 'កញ្ចប់សម្ភារៈ' : '领物');
    var thAct = state.lang === 'en' ? 'Action' : (state.lang === 'km' ? 'ប្រតិបត្តិការ' : '操作');

    h += "<div class='scroll'><table><thead><tr><th>" + thPart + "</th><th>" + thBib + "</th><th>" + thCat + "</th><th>" + thAmt + "</th>" +
         "<th>" + thRegSt + "</th><th>" + thFinSt + "</th><th>" + thPack + "</th><th>" + thAct + "</th></tr></thead><tbody>";

    o.participants.forEach(function(p){
      var pack = RD.racePackFact(p.regId);           /* 共享领物运营事实（非名单） */
      var openRf = DB.refunds.filter(function(r){
        return r.opId === p.id && (r.status === "REQUESTED" || r.status === "APPROVED"); })[0];
      var settledRf = DB.refunds.filter(function(r){ return r.opId === p.id && r.status === "SETTLED"; });

      /* SR-001 F-002：能不能发起退款，只看这一行自己，绝不看 Order.status */
      var refundable = o.status !== "PENDING_PAYMENT" && !openRf && p.regStatus === "CONFIRMED";

      /* D-092 · 列表显示的是<b>当前持有人</b>（Registration 当前数据）；
         报名时的姓名是 OrderParticipant 财务快照，转让之后两者不再相同。 */
      var sreq = RD.openSupportRequest(p.id);
      h += "<tr><td>" + pii(RD.holderOf(p)) +
        (RD.transferred(p) ? " <span class='tag t-warn'>已转让</span><br><span class='mut'>报名时快照：" + pii(p.name) + "</span>" : "") +
        (sreq ? "<br><span class='tag t-info' title='用户在前台提交了退款协助请求；这不是 Refund'>用户已申请退款协助</span>" : "") +
        "<br><span class='mut'>" + esc(p.id) + " · " + esc(p.regId) + "</span></td>" +
        "<td>" + (p.bib ? "<code>" + esc(p.bib) + "</code>" : "<span class='mut'>未分配</span>") + "</td>" +
        "<td class='mut'>" + esc(p.cat) + "</td>" +
        "<td>" + money(p.paid) + "</td>" +
        "<td>" + statusTag(p.regStatus) + (p.cancelReason ? "<br><span class='mut'>" + esc(p.cancelReason) + "</span>" : "") + "</td>" +
        "<td>" + statusTag(p.opStatus) +
          (settledRf.length ? "<br><span class='mut'>已退 " + (seeMoney() ? "$" + settledRf.reduce(function(a,b){return a+b.amount;},0) : "—") + "</span>" : "") + "</td>" +
        "<td>" + (pack ? (pack.picked ? "<span class='tag t-ok'>已领</span>" : "<span class='tag'>未领</span>") : "<span class='mut'>—</span>") + "</td>" +
        "<td><div class='row'>";

      if(openRf && refundType(openRf) === "SUPPLEMENTAL"){
        /* F-003 · 补退不走通用退款路径：这里不渲染通用按钮，处理器也会拒绝 */
        h += statusTag(openRf.status) + " <span class='tag t-info'>SUPPLEMENTAL · 补退</span>" +
             "<br><span class='mut'>补退只能在 <b>Payments &amp; Exceptions → 补退 / 多退纠错</b> 里审批与结算——" +
             "补退结算<b>不重复履约副作用</b>，走通用路径会把报名与名额再动一次。</span>" +
             "<button class='btn' data-go='payments'>去补退专用路径 →</button>";
      } else if(openRf){
        h += statusTag(openRf.status) + " <span class='tag'>STANDARD</span>" +
             (openRf.origin === "LATE_ARRIVAL_REJECT" ? " <span class='tag t-warn'>来自 LATE_ARRIVAL 拒绝</span>" : "");
        h += opBtn("refund_approve", "审批", "rfapprove:" + openRf.id);
        h += opBtn("refund_settle", "结算打款", "rfsettle:" + openRf.id, "pri");
        h += opBtn("refund_reject", "拒绝 / 撤回", "rfreject:" + openRf.id, "danger");
      } else if(refundable){
        h += opBtn("refund_request", "发起退款", "rfnew:" + o.id + ":" + p.id);
      } else if(p.opStatus === "REFUNDED"){
        h += "<span class='mut'>已退款终态</span>";
      } else {
        h += "<span class='mut'>—</span>";
      }
      /* D-092 J-3 / J-5 · 报名详情：财务快照 / 当前参赛资料 / 修改历史 / 转让历史 / 退款与号码布历史 */
      h += "<button class='btn' data-h='pdetail:" + p.id + "'>详情</button>";
      h += "</div></td></tr>";
    });
    h += "</tbody></table></div>";

    /* D-022 拦截说明 */
    var pwhy = o.status === "PENDING_PAYMENT" ? prepayBlockReason(o) : null;
    if(pwhy){
      h += '<div class="deny"><b>D-022：本单不允许「付款前取消」。</b><br>' +

  DB.refunds.forEach(function(r){

      "</td><td>" + kindTag + "</td><td>" + money(r.amount) + "</td>" +
      "<td>" + statusTag(r.status) + "</td>" +
      "<td class='mut'>" + esc(r.by) + "<br>" + esc(r.at) + "</td><td class='mut'>" + esc(r.reason) + "</td>" +
      "<td class='mut'>" + (r.status === "SETTLED" ? proofSafe(r.proof) : "—") + "</td></tr>";

  h += "</tbody></table></div></div>";

  if(state.role === "SUPPORT"){
    h += '<div class="deny"><b>当前角色 SUPPORT 的可见与可做（AR-F-006）：</b><br>' +
      "✅ 可见：异常类型、订单号、金额、处理状态、客服说明 —— 足够回答用户「我的钱怎么了」。<br>" +
      "🚫 不可见：<b>通道 / 银行流水号（provider transaction ID）与任何银行信息</b>，表格、弹窗、详情一律遮蔽。<br>" +
      "🚫 不可做：审批 / 结算 / 拒绝退款、返还资金异常、关闭对账 —— 上面这些按钮全是 disabled。<b>资金裁决只归 FINANCE。</b><br>" +
      "可以做的只有一件：在 Orders 页<b>代客发起</b>退款申请（D-018）。</div>";
  }
  if(state.role === "RACE_SUPERVISOR"){
    h += '<div class="deny"><b>当前角色 RACE_SUPERVISOR：</b>看不到这个工作区。比赛日遇到退款问题只能联系远程值班的 FINANCE（docs/12 §13.2 · D-016）。</div>';
  }
  return h;
};

/* ---------- Race Pack ---------- */
V.racepack = function(){
  var h = "<h1>" + esc(t("nav_racepack", "现场赛包核销")) + "</h1><p class='sub'>扫码 / 搜人 → 身份核验 → 确认发包。存在进行中退款时<b>硬拦截</b>，没有主管放行按钮。</p>";

  h += '<div class="card"><div class="row">' +
    '<input type="text" id="scan" placeholder="扫码或输入 Bib / 姓名，例：1025、2044" value="' + esc(state.scan) + '" style="flex:1;min-width:200px">' +
    '<button class="btn pri" id="scango">模拟扫码</button><button class="btn" id="scanclear">清空</button>' +
    '<span class="tag t-demo">离线模式（MOCK 展示）</span></div>' +
    '<p class="mut" style="margin:.5rem 0 0">离线状态只是演示标记；本 Demo <b>不设计离线分布式算法</b>（SR-001 已把它归为技术跟进项）。</p></div>';

  /* ⚖️ D-098 根 B（F-003）· 名单<b>派生自共享 Registration</b>：
     谁在名单里 = 共享 Registration；号码布 = BibAssignment；
     领没领 / 核验过没有 = Race Pack 自己的运营事实，按 regId 挂靠。
     不再有第二张持久化名单决定「这个人存不存在」——
     新报名进来、后台刚分完号，这里立刻查得到。 */
  var q = (state.scan || "").trim().toLowerCase();
  var rows = RD.racePackRoster(null).filter(function(d){
    if(!canSeeEvent(d.eventId)) return false;
    if(!q) return true;
    return String(d.bib || "").indexOf(q) >= 0 || d.name.toLowerCase().indexOf(q) >= 0 ||
           d.regId.toLowerCase().indexOf(q) >= 0;
  }).map(function(d){ return packRow(d.regId); }).filter(Boolean);

  if(!rows.length) h += '<div class="card"><p class="mut">没有匹配的参赛者。</p></div>';

  rows.forEach(function(r){
    var openRf = r.openRefund;

    h += '<div class="card"><div class="row" style="justify-content:space-between;align-items:flex-start">' +
      "<div><h3 style='margin:0'><code>" + esc(packBib(r)) + "</code> " + pii(r.name) + "</h3>" +
      "<p class='mut' style='margin:.25rem 0 0'>" + esc(r.cat) + " · " + esc(r.regId) +
      (r.localPrice ? " · <span class='tag t-warn'>本地价 · 须核验证件</span>" : "") + "</p></div><div class='row'>";

    if(openRf){
      h += "<span class='tag t-bad'>BLOCKED · 不发包</span>" + opInfoBtn("racepack_issue");
    } else if(r.picked){
      h += "<span class='tag t-ok'>已领包</span>" + opBtn("racepack_undo", "撤销误操作", "undopack:" + r.regId, "danger");
    } else if(!r.eligible){
      h += "<span class='tag t-bad'>不可领物</span>" + opInfoBtn("racepack_issue");
    } else {
      if(r.localPrice && !r.idVerified) h += opBtn("racepack_issue", "核验证件", "verify:" + r.regId);
      h += opBtn("racepack_issue", "确认发包", "issue:" + r.regId, "pri");
    }
    h += "</div></div>";

    if(openRf){
      h += '<div class="deny"><b>硬拦截：存在进行中的退款（' + esc(openRf.id) + " · " + openRf.status + "）。</b><br>" +
        "不发包。<b>不存在「主管 Override 放行」这个动作</b>——只要留了这个按钮，就会出现「钱退了、包也拿走了」。<br>" +
        "现场只能联系 <b>FINANCE</b> 撤销 / 拒绝该退款，<b>处理完必须重新跑一次领物资格校验</b>才放行（docs/12 §8.3 · D-016）。<br>" +
        "<span class='mut'>资格是从<b>当前</b>共享事实现算的：退款一旦被撤销 / 拒绝，这里立刻重新可发包。</span></div>";
    } else if(!r.eligible){
      h += '<div class="deny"><b>不可领物：</b>' + esc(r.why) + "<br>" +
        "<span class='mut'>领物资格由当前共享 Registration 事实推导，不存在第二张名单可以绕过它。</span></div>";
    }
    if(r.picked){
      h += "<p class='mut'>已于 " + esc(r.pickedAt || "—") + " 由 " + esc(r.pickedBy || "—") + " 发出。" +
        "领物是<b>独立时间戳字段</b>，不进 Registration 状态机（D-014）。</p>";
    } else if(r.eligible && r.localPrice && !r.idVerified){
      h += '<div class="note warnote">本地价参赛者，<b>发包前必须核验证件</b>（09 §2.5）。证件号只核验匹配与否，不显示原值。</div>';
    }
    if(!r.bib){
      h += "<p class='mut'>该报名<b>尚未分配号码布</b>（号码布只有 BibAssignment 一个权威事实）。可到 Bib Operations 分配。</p>";
    }
    h += "</div>";
  });

  /* ---------- D-031 R3 · 离线回传冲突裁决 ---------- */
  var oc = DB.offlineConflicts.filter(function(c){ return canSeeEvent(c.eventId); });
  if(oc.length){
    h += '<div class="card"><h3>离线回传冲突 <span class="srchip">D-031 R3</span> ' +
      opInfoBtn("offline_conflict") + "</h3>" +
      '<p class="mut" style="margin:.1rem 0 .7rem">比赛日多台设备离线作业，回传之后同一张票据出现了不止一条「已发放」。' +
      "需要有权限的人<b>看着证据裁定：最终只有一条履约结果生效</b>。<b>所有原始设备记录一条都不会被删除。</b></p>";

    oc.forEach(function(c){
      h += "<div style='border:1px solid var(--line-strong);border-radius:8px;padding:.75rem .9rem;margin-bottom:.7rem'>";
      h += "<div class='row' style='justify-content:space-between;align-items:flex-start'><div>" +
        "<b>票据 <code>" + esc(c.ticket) + "</code></b> · " + pii(c.name) + " · Bib <code>" + esc(c.bib) + "</code> · " + esc(c.regId) +
        "<br><span class='mut'>同一票据有 <b>" + c.devices.length + "</b> 条设备记录</span></div>" +
        "<div>" + (c.decided
          ? "<span class='tag t-ok'>已裁决</span>"
          : "<span class='tag t-warn'>待裁决</span>") + "</div></div>";

      h += "<div class='scroll' style='margin-top:.5rem'><table><thead><tr>" +
        "<th>设备记录</th><th>发放时间</th><th>操作人</th><th>模式 / 回传</th><th>裁决结果</th><th>操作</th></tr></thead><tbody>";
      c.devices.forEach(function(d){
        var kept = c.decided && c.keptDeviceId === d.id;
        h += "<tr><td><code>" + esc(d.id) + "</code><br><span class='mut'>" + esc(d.device) + "</span></td>" +
          "<td>" + esc(d.at) + "</td><td class='mut'>" + esc(d.by) + "</td>" +
          "<td class='mut'>" + esc(d.mode) + "<br>回传 " + esc(d.uploadedAt) + "</td>" +
          "<td>" + (!c.decided ? "<span class='mut'>—</span>"
                   : kept ? "<span class='tag t-ok'>生效</span>"
                          : "<span class='tag'>冲突已裁决</span>") + "</td>" +
          "<td>" + (c.decided ? "<span class='mut'>记录保留</span>"
                   : opBtn("offline_conflict", "以这条为准", "ocpick:" + c.ticket + ":" + d.id, "", { info:"offline_conflict" })) +
          "</td></tr>";
      });
      h += "</tbody></table></div>";

      if(c.decided){
        h += '<div class="note oknote" style="margin-bottom:0"><b>已裁决：保留 <code>' + esc(c.keptDeviceId) + "</code> 为生效的履约结果。</b><br>" +
          "依据：" + esc(c.decidedReason) + " · 裁决人 " + esc(c.decidedBy) + " · " + esc(c.decidedAt) + "<br>" +
          "<b>其余设备记录全部保留</b>，只是被标为「冲突已裁决」——原始事实不删除，才可能事后复盘。</div>";
      } else {
        h += '<div class="note warnote" style="margin-bottom:0"><b>裁决前，这张票据的领物事实是有歧义的。</b>' +
          "选定一条之后，其余记录会被标为「冲突已裁决」并<b>原样保留</b>；裁决依据、裁决人、裁决时间三样都会留痕。</div>";
      }
      h += "</div>";
    });

    h += '<div class="note" style="margin-bottom:0">🔧 <b>Technical Follow-up（D-031 R3）</b>：' +
      "本区块<b>不冻结任何新的持久化枚举或字段名</b>——离线一致性算法、冲突检测方式与落库模型属于 " +
      "Backend Technical Design，SR-001 已把它归为技术跟进项。这里只演示<b>已批准的业务结果</b>：" +
      "多设备事实可见 → 有权者看证据 → 恰好一条最终生效 → 原始记录全留 → 依据 / 人 / 时间留痕。</div>";
    h += "</div>";
  }
  return h;
};

/* ---------- Bib Operations ---------- */
V.bib = function(){
  var h = "<h1>" + esc(t("nav_bib", "号码布流转")) + "</h1><p class='sub'>号段设置 / 分配 / 换号 / 作废 / 历史。每一次变更都留下原号、新号、原因、操作人、时间。</p>";

  /* ---------- D-092 J-4 · Bib Settings（号段配置） ---------- */
  h += '<div class="card"><div class="row" style="justify-content:space-between"><h3 style="margin:0">Bib Settings · 号段配置 ' +
    opInfoBtn("bib_settings") + '</h3><div class="row">' +
    opBtn("bib_settings", "编辑号段", "bibmode") +
    opBtn("bib_assign", "AUTO 自动分配", "bibauto", "pri") +
    opBtn("bib_assign", "BATCH / CSV 批量", "bibcsv") +
    "</div></div>" +
    "<p class='mut' style='margin:.1rem 0 .7rem'>模型是 <code>Event → Category → Bib 号段 → 派生可用池 → BibAssignment</code>。" +
    "⚖️ <b>年龄与性别不参与号码编排</b>——它们只影响资格、成绩分组与排名。</p>" +
    "<div class='scroll'><table><thead><tr><th>赛事</th><th>组别</th><th>号段</th><th>预留段</th>" +
    "<th>已用</th><th>剩余</th><th>分配方式</th></tr></thead><tbody>";
  var cfgs = DB.bibConfig.filter(function(c){ return canSeeEvent(c.eventId); });
  if(!cfgs.length) h += "<tr><td colspan='7' class='mut'>当前身份没有可见赛事的号段配置。</td></tr>";
  cfgs.forEach(function(c){
    var ev = findEvent(c.eventId);
    var cat = ev && ev.categories.filter(function(x){ return x.id === c.catId; })[0];
    var used = bibUsedCount(c.eventId, c.catId);
    var pool = bibAvailableList(c.eventId, c.catId).length;
    h += "<tr><td>" + esc(c.eventId) + "<br><span class='mut'>" + esc(ev ? ev.name : "—") + "</span></td>" +
      "<td>" + esc(cat ? cat.name : c.catId) + "<br><span class='mut'>" + esc(c.catId) + "</span></td>" +
      "<td><code>" + c.from + "–" + c.to + "</code></td>" +
      "<td><code>" + c.reservedFrom + "–" + c.reservedTo + "</code><br><span class='mut'>不参与自动分配</span></td>" +
      "<td>" + used + "</td><td><b>" + pool + "</b><br><span class='mut'>算出来的，不是存的字段</span></td>" +
      "<td>" + esc(c.mode) + "</td></tr>";
  });
  h += "</tbody></table></div>" +
    '<div class="note"><b>「可用」永远是算出来的：</b>号段 − 预留段 − 全部 BibAssignment 记录（含 ASSIGNED / SUPERSEDED / VOIDED）。' +
    "<b>没有 AVAILABLE 这个持久状态</b>——一旦把它存下来，它就会和真实记录打架。" +
    "<br>换下（SUPERSEDED）与作废（VOIDED）的号<b>永不回到可用池</b>。</div></div>";
  h += '<div class="card"><div class="row" style="justify-content:space-between"><h3 style="margin:0">号码布绑定</h3>' +
       "<div class='row'>" + opBtn("bib_assign", "分配新号", "bibassign", "pri") + "</div></div>" +
       '<div class="filters"><label for="bibst">状态</label><select id="bibst">' +
         ["ALL","ASSIGNED","RESERVED","SUPERSEDED","VOIDED"].map(function(v){
           return '<option value="' + v + '"' + (state.bibStatus === v ? " selected" : "") + ">" +
                  (v === "ALL" ? "全部" : v + " · " + (STATUS[v] ? STATUS[v].zh : v)) + "</option>"; }).join("") +
       "</select>" +
       '<input type="text" id="bibq" placeholder="按号码搜索，例：2044" value="' + esc(state.scan) + '" style="min-width:180px">' +
       '<button class="btn" id="bibgo">搜索</button><button class="btn" id="bibclear">清空</button>' +
       "<span class='mut'>换号 / 作废之前先找到那一个号——这是执行既有操作所必需的最小筛选。</span></div>" +
       "<div class='scroll'><table><thead><tr><th>Bib</th><th>归属</th><th>状态</th><th>时间 / 操作人</th><th>备注</th><th>成绩事实</th><th>操作</th></tr></thead><tbody>";
  var bq = (state.scan || "").trim();
  var bibRows = DB.bibs.filter(function(b){
    if(!canSeeEvent(b.eventId)) return false;
    if(state.bibStatus !== "ALL" && b.status !== state.bibStatus) return false;
    if(bq && b.bib.indexOf(bq) < 0) return false;
    return true;
  });
  if(!bibRows.length) h += "<tr><td colspan='7' class='mut'>当前筛选条件下没有号码布。</td></tr>";
  bibRows.forEach(function(b){
    var facts = bibResultFacts(b.bib);
    h += "<tr><td><code>" + esc(b.bib) + "</code></td>" +
      "<td>" + (b.name ? pii(b.name) + "<br><span class='mut'>" + esc(b.regId) + "</span>" : "<span class='mut'>未分配</span>") + "</td>" +
      "<td>" + statusTag(b.status) + "</td>" +
      "<td class='mut'>" + esc(b.at) + "<br>" + esc(b.by) + "</td>" +
      "<td class='mut'>" + esc(b.note || "—") + "</td>" +
      "<td>" + (facts.length
        ? "<span class='tag t-info'>已有成绩</span><br><span class='mut'>" + facts.map(function(x){ return x.id + "（" + x.status + "）"; }).join("、") + "</span>"
        : "<span class='mut'>无</span>") + "</td>" +
      "<td><div class='row'>";
    var voidBlock = facts.length
      ? "<b>不能作废</b>：该号已在成绩批次 " + facts.map(function(x){ return "<code>" + esc(x.id) + "</code>" ; }).join("、") +
        " 里产生了成绩事实。docs/12 §9「作废 Bib」的前置校验是「<b>该号未产生成绩</b>」——" +
        "作废一个有成绩的号，等于让一条已公开的成绩挂在一个作废号上。"
      : null;
    if(b.status === "ASSIGNED"){
      h += opBtn("bib_swap", "现场换号", "bibswap:" + b.bib);
      h += opBtn("bib_void", "作废", "bibvoid:" + b.bib, "danger", { block: voidBlock });
    } else if(b.status === "RESERVED"){
      h += opBtn("bib_void", "作废", "bibvoid:" + b.bib, "danger", { block: voidBlock });
    } else {
      h += "<span class='mut'>历史终态</span>";
    }
    h += "</div></td></tr>";
  });
  h += "</tbody></table></div></div>";
  h += '<div class="note"><b>换号 = 旧号置 SUPERSEDED + 新号新建一条 ASSIGNED</b>，绝不 UPDATE 原记录；<b>作废 = 原号置 VOIDED，不产生新记录</b>。两者是互不相干的两条边。' +
       "<br>作废后原号<b>永不再用</b>——本 Demo 只验证 Admin 操作闭环与留痕，<b>不设计 SQL UNIQUE / DB 约束</b>（SR-001 归为技术跟进）。</div>";
  return h;
};

/* ---------- Results ---------- */
V.results = function(){
  var h = "<h1>" + esc(t("nav_results", "成绩管理")) + "</h1><p class='sub'>导入 → 校验 → 预览 → 发布 / 撤回；历史成绩认领冲突的受理与裁决。</p>";
  h += '<div class="card"><div class="row" style="justify-content:space-between"><h3 style="margin:0">成绩批次</h3>' +
       "<div class='row'>" + opBtn("result_import", "导入 CSV", "rimport", "pri") + "</div></div>" +
       "<div class='scroll'><table><thead><tr><th>批次</th><th>组别</th><th>行数 / 异常</th><th>状态</th><th>导入</th><th>操作</th></tr></thead><tbody>";
  DB.resultBatches.forEach(function(b){
    h += "<tr><td><code>" + esc(b.id) + "</code><br><span class='mut'>" + esc(b.file) + "</span></td>" +
      "<td>" + esc(b.cat) + "</td>" +
      "<td>" + b.rows +
        (b.bad ? " · <span class='tag t-bad'>" + b.bad + " 异常行</span>" +
                 (b.badIgnored ? "<br><span class='mut'>已明确忽略：" + esc(b.badIgnoreReason || "") + "</span>" : "")
               : " · <span class='tag t-ok'>0 异常</span>") + "</td>" +
      "<td>" + statusTag(b.status, null, "batch") + "</td>" +
      "<td class='mut'>" + esc(b.at) + "<br>" + esc(b.by) + "</td><td><div class='row'>";
    if(b.status === "DRAFT")  h += opBtn("result_import", "校验", "rvalidate:" + b.id);
    if(b.status === "VALIDATED"){
      h += opBtn("result_publish", "预览", "rpreview:" + b.id);
      if(b.bad > 0 && !b.badIgnored){
        h += opBtn("result_publish", "忽略异常行", "rignore:" + b.id, "", { info:"result_ignorebad" });
      }
      var g = resultPublishGates(b);
      var bad = g.filter(function(x){ return !x.ok; });
      h += opBtn("result_publish", "发布", "rpublish:" + b.id, "pri",
        { block: bad.length ? "<b>不能发布</b>，未满足：" + bad.map(function(x){ return x.t; }).join("；") + "。" : null });
    }
    if(b.status === "PUBLISHED") h += opBtn("result_unpublish", "撤回发布", "runpub:" + b.id, "danger");
    if(b.status === "UNPUBLISHED") h += "<span class='mut'>用户侧显示「成绩复核中」</span>";
    h += "</div></td></tr>";
  });
  h += "</tbody></table></div>";

        (c.status === "PUBLISHED"

};

    });

  return h;
};

   ================================================================ */
function findOrder(id){ return DB.orders.filter(function(o){ return o.id === id; })[0]; }
function findOP(opId){
  var r = null;
  DB.orders.forEach(function(o){ o.participants.forEach(function(p){ if(p.id === opId) r = {o:o,p:p}; }); });
  return r;
}
function recalcOrder(o){
  /* Demo 版聚合：只统计「退赛退款」已结算金额；资金异常返还不参与 */
  var sum = DB.refunds.filter(function(r){
    return r.orderId === o.id && r.status === "SETTLED" && r.kind === "PARTICIPANT_CANCEL";
  }).reduce(function(a,b){ return a + b.amount; }, 0);
  /* P1-1 · D-031 R2 不变量：订单生命周期从未被恢复过的，退款聚合不得把它改写成
     PAID / PARTIALLY_REFUNDED / REFUNDED。
     EXPIRED 就是这种情况——LATE_ARRIVAL 拒绝所产生的那条退款结算时，
     钱是真出账了（记在 Refund 那一行上，settled_amount 照常落库），
     但这张订单的报名生命周期<b>没有被恢复过</b>，它必须停在 EXPIRED。
     PENDING_PAYMENT / CANCELLED 同理：钱从来没收到过，聚合无从谈起。 */
  if(o.status === "PENDING_PAYMENT" || o.status === "CANCELLED" || o.status === "EXPIRED") return;
  o.status = sum === 0 ? "PAID" : (sum >= o.amount ? "REFUNDED" : "PARTIALLY_REFUNDED");
}

/* ================================================================
   F-003 · STANDARD / SUPPLEMENTAL 两条路必须在**处理器层面**隔离，
           不能只靠 UI 不渲染按钮。
   F-004 · 任何结算金额在**改动任何业务状态之前**必须先通过校验。
   ================================================================ */
function refundType(r){ return (r && r.type === "SUPPLEMENTAL") ? "SUPPLEMENTAL" : "STANDARD"; }
/* 退款 ID 生成：`"RF-" + (length+1)` 会和种子里的 RF-10 / RF-11 撞号，
   撞号之后按 ID 查记录会查到**另一条**退款，处理器就会改错行。
   这里改成一直往后找到没被占用的编号为止。 */
function nextRefundId(prefix){
  var n = DB.refunds.length + 1;
  while(DB.refunds.some(function(r){ return r.id === prefix + n; })) n++;
  return prefix + n;
}
/* 通用退款处理器只接 STANDARD */
function guardStandard(r, what){
  if(!r){ toast("找不到该退款记录。", "bad"); return false; }
  if(refundType(r) === "SUPPLEMENTAL"){
    toast("<b>接口拒绝</b>：" + esc(r.id) + " 是 <b>SUPPLEMENTAL 补退</b>，不能走通用退款的「" + esc(what) + "」。" +
          "<br><span class='mut'>补退只能走 Payments &amp; Exceptions 的「补退 / 多退纠错」专用路径" +
          "（补退结算不重复履约副作用，走错路会把 Registration 与名额再动一次）。</span>", "bad");
    return false;
  }
  return true;
}
/* 补退专用处理器只接 SUPPLEMENTAL */
function guardSupplemental(r, what){
  if(!r){ toast("找不到该退款记录。", "bad"); return false; }
  if(refundType(r) !== "SUPPLEMENTAL"){
    toast("<b>接口拒绝</b>：" + esc(r.id) + " 是 <b>STANDARD 退款</b>，不能走补退专用的「" + esc(what) + "」。", "bad");
    return false;
  }
  return true;
}
/* F-004 · 结算金额校验：必须是有限数且 > 0。空、非数字、NaN、Infinity、0、负数一律拒绝。 */
function parseSettleAmount(raw){
  var t = String(raw == null ? "" : raw).trim();
  if(t === "") return null;
  var n = Number(t);                       /* Number("12abc") = NaN，比 parseFloat 严格 */
  if(typeof n !== "number" || !isFinite(n)) return null;
  if(!(n > 0)) return null;
  return n;
}

/* ================================================================

   ----------------------------------------------------------------

   成了一条死路：讲到这里演示就走不下去了。

   这里补的只是那条死路，<b>不是</b>一个赛事管理 CMS：
     · 只暴露<b>当前发布前置真正需要</b>的那几项已批准配置：
       每个组别的 Start / Cut-off / Capacity / 适用 PriceRule，加上 Race Pack 是否配完
     · 不做赛事模板、不做票务、不做支付配置、不做 Sponsor 合约管理

     · <b>只服务 DRAFT</b>：已发布赛事的对外形态仍然只由两个独立运营开关控制（R6）
     · <b>绝不</b>另算一套「是否可以发布」——保存之后仍然由同一个 publishGates()
       重新判定（R4）。这里写的是<b>真实的赛事配置事实</b>，不是一个放行开关。 */
function evcfgVal(id){ var el = $(id); return el ? String(el.value).trim() : ""; }
function evcfgChk(id){ var el = $(id); return !!(el && el.checked); }
/* 存的是 "YYYY-MM-DD HH:MM"，控件用 datetime-local 的 "YYYY-MM-DDTHH:MM"，两边互转 */
function evcfgToInput(v){ return v ? String(v).replace(" ", "T").slice(0, 16) : ""; }
/* "" → null（允许留空，缺项由 publishGates 去判）；格式不对 → false（拒绝保存，不写脏值） */
function evcfgFromInput(v){
  if(!v) return null;
  var t = String(v).replace("T", " ").trim();
  return /^\d{4}-\d{2}-\d{2} \d{2}:\d{2}$/.test(t) ? t : false;
}
function evcfgDash(v){ return v ? esc(v) : "—"; }

H.evcfgok = function(id){
  var e = findEvent(id);
  if(!e){ toast("赛事不存在。", "bad"); return; }
  if(e.status !== "DRAFT"){
    closeModal();
    toast("<b>已拒绝</b>：这个轻量编辑器只服务 DRAFT 赛事（D-118 R6）。", "bad"); render(); return;
  }
  /* ① 先全部读出来并逐条校验。任何一条不合法 → <b>整体拒绝</b>，
     一个字段都不写 —— 不留半截配置。 */
  var plan = [], errs = [];
  e.categories.forEach(function(c){
    var sRaw = evcfgVal("cfg_start_" + c.id), cRaw = evcfgVal("cfg_cut_" + c.id), capRaw = evcfgVal("cfg_cap_" + c.id);
    var start = evcfgFromInput(sRaw), cutoff = evcfgFromInput(cRaw);
    if(start === false) errs.push(c.name + "：Start 时间格式不对（应为 YYYY-MM-DD HH:MM）");
    if(cutoff === false) errs.push(c.name + "：Cut-off 时间格式不对（应为 YYYY-MM-DD HH:MM）");
    if(start && cutoff && cutoff <= start) errs.push(c.name + "：Cut-off 必须晚于 Start（当前 " + start + " → " + cutoff + "）");
    var cap = capRaw === "" ? 0 : parseInt(capRaw, 10);
    if(isNaN(cap) || cap < 0 || String(cap) !== String(capRaw === "" ? 0 : capRaw)){
      errs.push(c.name + "：名额必须是不小于 0 的整数");
    } else if(cap < (c.used || 0)){
      errs.push(c.name + "：名额不能小于已经占用的 " + c.used + " 个");
    }
    var prs = e.priceRules.filter(function(r){ return evcfgChk("cfg_pr_" + c.id + "_" + r.id); })
                          .map(function(r){ return r.id; });
    plan.push({ c:c, start:start || null, cutoff:cutoff || null, cap:cap, prs:prs });
  });
  if(errs.length){
    toast("<b>已拒绝保存</b>：<br>" + errs.map(esc).join("<br>") +
          "<br><span class='mut'>此刻赛事配置<b>一个字段都没有改动</b>。</span>", "bad");
    return;
  }
  var rp = evcfgChk("cfg_rp");

  /* ② 算出「到底改了哪几个已批准的配置面」——Audit 要写得出这句话（R5） */
  var changes = [];
  plan.forEach(function(x){
    var c = x.c;
    if((c.start || null) !== x.start) changes.push(c.name + " · Start：" + (c.start || "—") + " → " + (x.start || "—"));
    if((c.cutoff || null) !== x.cutoff) changes.push(c.name + " · Cut-off：" + (c.cutoff || "—") + " → " + (x.cutoff || "—"));
    if((c.cap || 0) !== x.cap) changes.push(c.name + " · 名额：" + (c.cap || 0) + " → " + x.cap);
    var before = (c.priceRuleIds || []).slice().sort().join(",");
    if(before !== x.prs.slice().sort().join(",")){
      changes.push(c.name + " · PriceRule：" + (before || "—") + " → " + (x.prs.join(",") || "—"));
    }
  });
  if(!!e.racePackConfigured !== rp){
    changes.push("Race Pack 配置：" + (e.racePackConfigured ? "已完成" : "未完成") + " → " + (rp ? "已完成" : "未完成"));
  }
  if(!changes.length){
    closeModal();
    toast("赛事配置没有任何改动，未写入 Audit。", "warn"); render(); return;
  }

  /* ③ 写入<b>真实的共享赛事事实</b>。这里没有任何「强制允许发布」之类的旁路开关。 */
  plan.forEach(function(x){
    x.c.start = x.start; x.c.cutoff = x.cutoff; x.c.cap = x.cap; x.c.priceRuleIds = x.prs;
  });
  e.racePackConfigured = rp;

  /* ④ 保存之后由<b>同一个</b> publishGates() 重新判定，这里只是把结论说出来，不是第二套判定。 */
  var gates = publishGates(e);
  var pass = gatesPass(gates);
  var bad = gates.filter(function(g){ return !g.ok; });
  closeModal();
  act("赛事配置更新",
      e.id + "（" + e.name + "） · " + changes.length + " 处改动：" + changes.join("；") +
      " · Event.status 仍为 " + e.status + "（保存配置<b>不发布</b>） · 发布前置校验：" +
      (pass ? "<b>六条全部满足，可以发布</b>" : "仍差 " + bad.length + " 条：" + bad.map(function(g){ return g.t; }).join("；")),
      "已保存赛事配置：" + e.name + "。" +
      (pass ? "<b>发布前置校验现在全部满足，「发布赛事」已可点。</b>"
            : "<b>仍不能发布</b>，还差：" + bad.map(function(g){ return esc(g.t); }).join("；") + "。"),
      pass ? "ok" : "warn");
};

/* D-033 A · 停止 / 恢复报名 —— Event.status 不变 */

H.rfnewok = function(orderId, opId){
  var reason = ($("rfreason") && $("rfreason").value.trim()) || "";
  if(!reason){ toast("退款原因必填。", "bad"); return; }
  /* ⚖️ D-096 F-005 · 渲染时能发起 ≠ 执行时还能发起。
     过期弹窗（另一个标签页已经建单 / 已经结算）必须在改动任何状态之前失败关闭。 */
  var gate = RD.canCreateParticipantRefund(opId);
  if(!gate.ok){
    closeModal();
    toast("<b>已拒绝执行</b>：" + gate.msg +
          "<br><span class='mut'>本次没有改动任何业务状态，也没有写任何成功 Audit。</span>", "bad");
    render();
    return;
  }
  var f = gate.f;
  var id = nextRefundId("RF-");
  DB.refunds.push({ id:id, orderId:orderId, opId:opId, kind:"PARTICIPANT_CANCEL", type:"STANDARD",
    requestedAmount:f.p.paid, amount:f.p.paid, status:"REQUESTED", by:state.staff,
    initiatedBy:state.role, at:now(), reason:reason });
  f.p.opStatus = "REFUND_PENDING";
  /* D-092 · 用户的协助请求到此为止：它已经被转成一条真正的 Refund，由 FINANCE 继续处理 */
  var sr0 = RD.openSupportRequest(opId);
  if(sr0) RD.supportRequestClose(sr0.id, { who:state.staff, role:state.role }, id);
  closeModal();
  act("发起退款申请", f.o.id + " / " + f.p.name + " · " + money(f.p.paid) + " · " + reason +
      " · initiated_by=" + state.role + " · Registration 与名额此刻都不动",
      "已创建 " + id + "：" + f.p.name + " 进入 REFUND_PENDING");
};

H.rfapproveok = function(rfId){
  var r = DB.refunds.filter(function(x){ return x.id === rfId; })[0];
  /* ---- 改动任何状态之前的守卫 ---- */
  if(!guardStandard(r, "退款审批")) return;
  if(r.status !== "REQUESTED"){ closeModal(); toast("<b>接口拒绝</b>：只有 REQUESTED 的退款可以审批。", "bad"); return; }
  var reqAmt = (r.requestedAmount != null) ? r.requestedAmount : r.amount;
  var raw = ($("apamt") && $("apamt").value);
  var amt = parseSettleAmount(raw);
  if(amt === null){
    toast("<b>拒绝审批</b>：批准金额必须是<b>有效的正数</b>（当前填的是「" +
          esc(String(raw == null ? "" : raw).trim() || "空") + "」）。" +
          "<br><span class='mut'>此刻未改动任何业务状态。</span>", "bad");
    return;
  }
  var why = ($("apwhy") && $("apwhy").value.trim()) || "";
  var diff = (amt !== reqAmt);
  if(diff && !why){
    toast("<b>拒绝审批</b>：批准金额 " + money(amt) + " 与申请金额 " + money(reqAmt) +
          " 不一致，<b>必须写明原因</b>（docs/12 §9 留痕要求）。", "bad");
    return;
  }
  r.requestedAmount = reqAmt;
  r.approvedAmount = amt;
  r.amount = amt;                    /* 后续「结算打款」以批准金额为默认值 */
  r.approveDiffReason = diff ? why : null;
  r.approvedBy = state.staff; r.approvedAt = now();
  r.status = "APPROVED";
  closeModal();
  act("退款审批", rfId + " · REQUESTED → APPROVED · 申请 " + money(reqAmt) + " → 批准 " + money(amt) +
      (diff ? " · <b>金额不一致，原因：" + why + "</b>" : "（与申请额一致）") +
      " · 审批人 " + state.staff + " · 其余表全部不动，钱仍未出账",
      "已批准 " + rfId + "：批准金额 " + money(amt) +
      (diff ? "（与申请额不同，已留原因）" : "") + "，等待线下打款");
};

H.rfsettleok = function(rfId){
  var r = DB.refunds.filter(function(x){ return x.id === rfId; })[0];
  /* ---- 以下全部是「改动任何业务状态之前」的守卫（F-003 / F-004）---- */
  if(!guardStandard(r, "结算打款")) return;
  if(r.status !== "APPROVED"){ toast("<b>接口拒绝</b>：只有 APPROVED 的退款可以结算。", "bad"); return; }
  var proof = ($("proof") && $("proof").value.trim()) || "";
  if(!proof){ toast("打款凭证号必填。", "bad"); return; }
  var rawAmt = ($("amt") && $("amt").value);
  var amt = parseSettleAmount(rawAmt);
  if(amt === null){
    toast("<b>拒绝结算</b>：实际打款金额必须是<b>有效的正数</b>（当前填的是「" +
          esc(String(rawAmt == null ? "" : rawAmt).trim() || "空") + "」）。" +
          "<br><span class='mut'>空值 / 0 / 负数 / 非数字 / NaN 一律拒绝，且<b>此刻没有改动任何业务状态</b>。</span>", "bad");
    return;
  }
  var f = findOP(r.opId);
  if(!f){ toast("<b>接口拒绝</b>：找不到该退款对应的参赛人。", "bad"); return; }
  /* D-035 · 精确判定条件（不是「第几条 SETTLED」，而是看 Registration 当前状态）：
       只有当 Registration 当前为 CONFIRMED 时，STANDARD 退款结算才执行
         Registration: CONFIRMED → CANCELLED(REFUND_SETTLED)
       并且只释放一次 Category capacity。
     已经因别的合法原因 CANCELLED 的报名（例如 LATE_ARRIVAL 拒绝所对应的
     CANCELLED(ORDER_EXPIRED)），不得再次承受这两个副作用；PriceRule quota 同样不再改动。
     未新增任何业务状态。 */
  var regIsConfirmed = f.p.regStatus === "CONFIRMED";
  var regBefore = f.p.regStatus + "(" + (f.p.cancelReason || "-") + ")";
  r.status = "SETTLED"; r.amount = amt; r.proof = proof; r.settledAt = now();
  f.p.opStatus = "REFUNDED";
  var ev = DB.events.filter(function(e){ return e.id === f.o.eventId; })[0];
  var cat = ev && ev.categories.filter(function(c){ return c.id === f.p.cat; })[0];
  var capBefore = cat ? cat.used : null;
  if(regIsConfirmed){
    f.p.regStatus = "CANCELLED"; f.p.cancelReason = "REFUND_SETTLED";
    /* 名额释放走共享域的同一个实现（与下单时的占用一一对应）；价格档配额不恢复 */
    RD.releaseCapacity(f.o.eventId, f.p.cat);
    /* ⚖️ D-098 B5 · <b>不删</b>领物运营事实：名单是派生的，报名已 CANCELLED
       自然就不可领物了；把历史删掉只会让「他到底领没领过」永远答不出来。 */
  }
  recalcOrder(f.o);
  var capAfter = cat ? cat.used : null;
  closeModal();
  act("退款结算", r.orderId + " / " + f.p.name + " · " + money(amt) + " · 凭证 " + proof +
      (regIsConfirmed
        ? " · Registration 当前为 CONFIRMED，因此执行 " + regBefore + " → CANCELLED(REFUND_SETTLED) · 名额 " + capBefore + " → " + capAfter + "（释放一次）"
        : " · <b>只动钱</b>（D-035）：Registration 当前是 " + regBefore + "，<b>不是 CONFIRMED</b>，因此不再取消、名额 " +
          capBefore + " → " + capAfter + "（不再释放）、PriceRule quota 不再改动") +
      " · quota 不恢复 · Order 重新聚合为 " + f.o.status,
      "已结算 " + rfId + "：" + f.p.name + (regIsConfirmed ? " 退赛，名额已释放" : " 的退款已出账（报名当前不是 CONFIRMED，未重复承受履约副作用）"));
};
/* docs/12 §9「②退款拒绝 / 撤回」行：

H.rfrejectok = function(rfId){
  var r = DB.refunds.filter(function(x){ return x.id === rfId; })[0];
  /* ---- 改动任何状态之前的守卫 ---- */
  if(!guardStandard(r, "拒绝 / 撤回")) return;
  if(!refundInProgress(r)){
    closeModal();
    toast("<b>接口拒绝</b>：只有 REQUESTED / APPROVED 的退款可以拒绝或撤回。", "bad");
    return;
  }
  var kind = ($("rjkind") && $("rjkind").value) || "REJECTED";
  if(["REJECTED","WITHDRAWN"].indexOf(kind) < 0){ toast("处置类型不合法。", "bad"); return; }
  var rs = ($("rs") && $("rs").value.trim()) || "";
  if(!rs){ toast("拒绝 / 撤回原因必填（docs/12 §9 留痕要求）。", "bad"); return; }
  var uc = ($("uc") && $("uc").value.trim()) || "";
  if(kind === "WITHDRAWN" && !uc){
    toast("<b>拒绝</b>：撤回必须记录<b>用户确认</b>（docs/12 §9「用户确认（撤回时）」）。", "bad");
    return;
  }
  var f = findOP(r.opId);
  var before = r.status;
  r.status = kind; r.at = now();
  r.rejectReason = rs; r.rejectedBy = state.staff; r.rejectedAt = now();
  if(kind === "WITHDRAWN") r.userConfirmation = uc;
  var stillSettled = DB.refunds.some(function(x){ return x.opId === r.opId && x.status === "SETTLED"; });
  f.p.opStatus = stillSettled ? "REFUNDED" : "ACTIVE";
  closeModal();
  act("退款拒绝 / 撤回", rfId + " · " + before + " → " + kind + " · 原因：" + rs +
      (kind === "WITHDRAWN" ? " · 用户确认：" + uc : "") +
      " · 处理人 " + state.staff +
      " · settled_amount 始终无值 · Registration 保持 " + f.p.regStatus +
      " · 该参赛者恢复为 " + f.p.opStatus + " · 领物资格必须重新校验一次（D-016）",
      "已" + (kind === "WITHDRAWN" ? "撤回" : "拒绝") + " " + rfId + "：" + f.p.name +
      " 回到 " + f.p.opStatus + "，Race Pack 需重新校验后才放行", "warn");
};

H.retok = function(excId){
  var proof = ($("proof") && $("proof").value.trim()) || "";
  if(!proof){ toast("打款凭证号必填。", "bad"); return; }
  var amt = parseSettleAmount(($("amt") && $("amt").value));
  if(amt === null){
    toast("<b>拒绝返还</b>：返还金额必须是<b>有效的正数</b>，此刻未改动任何业务状态。", "bad"); return;
  }
  var e = DB.exceptions.filter(function(x){ return x.id === excId; })[0];
  if(!e || e.status !== "OPEN"){ toast("<b>接口拒绝</b>：该异常已不是 OPEN。", "bad"); return; }

  e.status = "CLOSED";
  DB.refunds.push({ id:nextRefundId("RF-X"), orderId:e.orderId, opId:null,

  act("资金异常返还", e.type + " · " + e.orderId + " · " + money(amt) + " · 凭证 " + proof +
      " · 不挂任何参赛人 · 报名状态返还前后一致：[" + before + "] → [" + after + "]",

H.confok = function(excId){
