name: werun

x-api-build: &api-build
  context: ..
  dockerfile: api/Dockerfile

x-api-env: &api-env
  WERUN_DATABASE_URL: postgres://werun:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/werun?sslmode=disable
  WERUN_HTTP_ADDR: ":8080"
  WERUN_FILES_DIR: /data/files
  WERUN_TELEGRAM_BOT_TOKEN: ${WERUN_TELEGRAM_BOT_TOKEN:?WERUN_TELEGRAM_BOT_TOKEN must be set}
  WERUN_TELEGRAM_BOT_USERNAME: ${WERUN_TELEGRAM_BOT_USERNAME:?WERUN_TELEGRAM_BOT_USERNAME must be set}
  WERUN_TELEGRAM_SEND: ${WERUN_TELEGRAM_SEND:-}
  WERUN_APP_BASE_URL: ${WERUN_APP_BASE_URL:?WERUN_APP_BASE_URL must be set}
  WERUN_OTP_SENDER: ${WERUN_OTP_SENDER:-}
  WERUN_TELEGRAM_GATEWAY_TOKEN: ${WERUN_TELEGRAM_GATEWAY_TOKEN:-}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: werun
      POSTGRES_USER: werun
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U werun -d werun"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  migrate:
    image: ${WERUN_API_IMAGE:-werun-api:local}
    build: *api-build
    command: ["migrate", "up"]
    env_file: ../.env
    environment: *api-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: ${WERUN_API_IMAGE:-werun-api:local}
    build: *api-build
    command: ["serve", "--with-worker"]
    env_file: ../.env
    environment: *api-env
    volumes:
      - files:/data/files
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/werun", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    # serve 的优雅停止最长等待 30s（见 api/cmd/werun/serve.go shutdownTimeout），
    # 给够余量避免 Docker 在请求/任务还没处理完时就 SIGKILL。
    stop_grace_period: 40s

  caddy:
    image: ${WERUN_WEB_IMAGE:-werun-web:local}
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      args:
        VITE_TELEGRAM_BOT_USERNAME: ${WERUN_TELEGRAM_BOT_USERNAME:-werun_bot}
    environment:
      WERUN_USER_HOST: ${WERUN_USER_HOST:?WERUN_USER_HOST is required}
      WERUN_ADMIN_HOST: ${WERUN_ADMIN_HOST:?WERUN_ADMIN_HOST is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - files:/srv/files:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  files:
  caddy_data:
  caddy_config:
