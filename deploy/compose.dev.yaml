name: werun-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: werun
      POSTGRES_USER: werun
      POSTGRES_PASSWORD: werun
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U werun -d werun"]
      interval: 3s
      timeout: 3s
      retries: 30

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata:
  caddy_data:
