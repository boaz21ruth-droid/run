        quota:
          type: integer
          format: int32
        minRunners:
          type: integer
          format: int32
          nullable: true
        validFrom:
          type: string
          format: date-time
          nullable: true
        validUntil:
          type: string
          format: date-time
          nullable: true
        description:
          $ref: '#/components/schemas/LocalizedText'
        status:
          $ref: '#/components/schemas/CouponStatus'
    CreateCouponRequest:
      type: object
      required: [code, discountType, discountValue, quota, status]
      properties:
        code:
          type: string
        eventId:
          type: integer
          format: int64
          nullable: true
        discountType:
          $ref: '#/components/schemas/DiscountType'
        discountValue:
          type: integer
          format: int64
        quota:
          type: integer
          format: int32
        minRunners:
          type: integer
          format: int32
          nullable: true
        validFrom:
          type: string
          format: date-time
          nullable: true
        validUntil:
          type: string
          format: date-time
          nullable: true
        description:
          $ref: '#/components/schemas/LocalizedText'
        status:
          $ref: '#/components/schemas/CouponStatus'
    Coupon:
      type: object
      required: [id, code, eventId, discountType, discountValue, quota, minRunners, validFrom, validUntil, status, usedCount, reservedCount]
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
        eventId:
          type: integer
          format: int64
          nullable: true
        discountType:
          $ref: '#/components/schemas/DiscountType'
        discountValue:
          type: integer
          format: int64
        quota:
          type: integer
          format: int32
        minRunners:
          type: integer
          format: int32
          nullable: true
        validFrom:
          type: string
          format: date-time
          nullable: true
        validUntil:
          type: string
          format: date-time
          nullable: true
        description:
          $ref: '#/components/schemas/LocalizedText'
        status:
          $ref: '#/components/schemas/CouponStatus'
        usedCount:
          type: integer
          format: int32
        reservedCount:
          type: integer
          format: int32
    CouponList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Coupon'
    PaymentProvider:
      type: string
      enum: [ABA, ACLEDA, WING, BAKONG, OTHER]
    PaymentAccountScope:
      type: string
      enum: [REGISTRATION, MERCH, ALL]
    PaymentAccount:
      type: object
      required: [id, name, provider, accountName, accountNoMasked, currency, qrFileId, scope, eventId, active, createdAt]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        provider:
          $ref: '#/components/schemas/PaymentProvider'
        accountName:
          type: string
        accountNoMasked:
          type: string
        currency:
          type: string
        qrFileId:
          type: integer
          format: int64
          description: 二维码地址为 /api/files/{qrFileId}
        scope:
          $ref: '#/components/schemas/PaymentAccountScope'
        eventId:
          type: integer
          format: int64
          nullable: true
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
    PaymentAccountList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PaymentAccount'
    AppLoginRequest:
      type: object
      required: [initData]
      properties:
        initData:
          type: string
          minLength: 1
          maxLength: 4096
    AppUser:
      type: object
      required: [id, telegramUserId, telegramUsername, phoneMasked, displayName, locale]
      properties:
        id:
          type: integer
          format: int64
        telegramUserId:
          type: integer
          format: int64
          nullable: true
        telegramUsername:
          type: string
          nullable: true
        phoneMasked:
          type: string
          nullable: true
          description: 形如 +855***678；没有手机号时为 null
        displayName:
          type: string
        locale:
          type: string
          enum: [zh, en, km]
    PhoneCodeRequest:
      type: object
      required: [phone]
      properties:
        phone:
          type: string
          description: E.164，例如 +85512345678
          minLength: 8
          maxLength: 16
    PhoneCodeSent:
      type: object
      required: [expiresInSeconds, resendAfterSeconds, channel]
      properties:
        expiresInSeconds:
          type: integer
        resendAfterSeconds:
          type: integer
        channel:
          type: string
          enum: [telegram]
    PhoneCodeVerify:
      type: object
      required: [phone, code]
      properties:
        phone:
          type: string
          minLength: 8
          maxLength: 16
        code:
          type: string
          minLength: 6
          maxLength: 6
    UpdateMeRequest:
      type: object
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 64
        locale:
          type: string
          enum: [zh, en, km]
    AppSession:
      type: object
      required: [token, expiresAt, user]
      properties:
        token:
          type: string
        expiresAt:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/AppUser'
    Gender:
      type: string
      enum: [M, F, X]
    IdType:
      type: string
      enum: [NATIONAL_ID, PASSPORT, OTHER]
    TShirtSize:
      type: string
      enum: [XS, S, M, L, XL, XXL]
    ProfileInput:
      type: object
      required: [fullName, gender, birthDate, nationality, idType, phone, emergencyName, emergencyPhone, tshirtSize]
      properties:
        fullName:
          type: string
        gender:
          $ref: '#/components/schemas/Gender'
        birthDate:
          type: string
          format: date
        nationality:
          type: string
          description: ISO 3166-1 alpha-2，如 KH
        idType:
          $ref: '#/components/schemas/IdType'
        idNo:
          type: string
          description: 新建时必填；修改时省略或为空串表示保留原证件号
        phone:
          type: string
          description: E.164，如 +85512345678
        email:
          type: string
        emergencyName:
          type: string
        emergencyPhone:
          type: string
        tshirtSize:
          $ref: '#/components/schemas/TShirtSize'
        isSelf:
          type: boolean
          default: false
    RunnerProfile:
