openapi: 3.0.3
info:
  title: WeRun API
  version: 0.1.0
servers:
  - url: /api
paths:
  /healthz:
    get:
      operationId: getHealthz
      tags: [system]
      summary: 进程存活检查
      responses:
        "200":
          description: 进程存活
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        default:
          description: 错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /readyz:
    get:
      operationId: getReadyz
      tags: [system]
      summary: 数据库连通检查
      responses:
        "200":
          description: 可以接收流量
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: 数据库不可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        default:
          description: 错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/auth/login:
    post:
      operationId: adminLogin
      tags: [admin-auth]
      summary: 员工登录
      x-auth: none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功，响应头 Set-Cookie 下发 werun_admin_session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          description: 错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/auth/logout:
    post:
      operationId: adminLogout
      tags: [admin-auth]
      summary: 退出登录
      x-auth: session
      responses:
        "204":
          description: 已退出
        default:
          description: 错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/me:
    get:
      operationId: adminGetMe
      tags: [admin-auth]
      summary: 当前员工与权限
      x-auth: session
      responses:
        "200":
          description: 当前员工
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          description: 错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /events:
    get:
      operationId: listPublicEvents
      summary: 已发布且公开展示的赛事列表，文案按请求语言返回
      responses:
        '200':
          description: 赛事列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicEventList'
        default:
          description: 错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /events/{slug}:
    get:
      operationId: getPublicEvent
      summary: 赛事详情（含组别）
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 赛事详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicEvent'
        default:
          description: 错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/events:
    get:
      operationId: adminListEvents
      summary: 后台赛事列表（名称返回三语）
      x-permission: event_config
      x-access: read
      responses:
        '200':
          description: 赛事列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEventList'
        default:
          description: 错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: adminCreateEvent
      summary: 新建草稿赛事及组别
      x-permission: event_config
      x-access: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventRequest'
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEvent'
        default:
          description: 错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/events/{id}:
    get:
      operationId: adminGetEvent
      summary: 后台赛事详情（任意状态，含报名设置与组别）
      x-permission: event_config
      x-access: read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 赛事详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEvent'
        default:
          description: 错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/events/{id}/registration:
    patch:
      operationId: adminUpdateEventRegistration
      summary: 修改报名开关与报名时间（开放前校验发布状态、价格档与收款账户）
      x-permission: event_config
      x-access: write
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEventRegistrationRequest'
      responses:
        '200':
          description: 已保存
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEvent'
        default:
          description: 错误（未就绪时为 422 REGISTRATION_NOT_READY）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/events/{id}/publish:
    post:
      operationId: adminPublishEvent
      summary: 发布赛事（发布前校验）
      x-permission: event_publish
      x-access: write
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 已发布
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEvent'
        default:
          description: 错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/events/{id}/price-rules:
    get:
      operationId: adminListPriceRules
      summary: 赛事的价格档列表（含关联组别与计数）
      x-permission: price_config
      x-access: read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 价格档列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceRuleList'
        default:
          description: 错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: adminCreatePriceRule
      summary: 新建价格档
      x-permission: price_config
      x-access: write
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PriceRuleInput'
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceRule'
        default:
          description: 错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/price-rules/{id}:
    put:
      operationId: adminUpdatePriceRule
      summary: 修改价格档（已有占用时不可改价格、人群、关联组别）
      x-permission: price_config
      x-access: write
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PriceRuleInput'
      responses:
        '200':
          description: 已保存
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceRule'
        default:
          description: 错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/coupons:
    get:
      operationId: adminListCoupons
      summary: 优惠码列表（eventId 为空时返回全部）
      x-permission: coupon_manage
      x-access: read
      parameters:
        - name: eventId
          in: query
          required: false
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 优惠码列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CouponList'
        default:
          description: 错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: adminCreateCoupon
      summary: 新建优惠码（代码自动转大写）
      x-permission: coupon_manage
      x-access: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCouponRequest'
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Coupon'
        default:
          description: 错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/coupons/{id}:
    put:
      operationId: adminUpdateCoupon
      summary: 修改优惠码（代码不可改）
      x-permission: coupon_manage
      x-access: write
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCouponRequest'
      responses:
        '200':
          description: 已保存
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Coupon'
        default:
          description: 错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /files/{id}:
    get:
      operationId: getPublicFile
      summary: 公开文件（收款二维码）；私有或不存在返回 404；响应头 Cache-Control public, max-age=86400
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 图片内容
          content:
            image/*:
              schema:
                type: string
                format: binary
        default:
          description: 错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/payment-accounts:
    get:
      operationId: adminListPaymentAccounts
      summary: 收款账户列表
      x-permission: payment_account_manage
      x-access: read
      responses:
        '200':
          description: 收款账户列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentAccountList'
        default:
          description: 错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: adminCreatePaymentAccount
      summary: 新建收款账户（上传二维码，币种固定 USD）
      x-permission: payment_account_manage
      x-access: write
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name, provider, accountName, accountNoMasked, scope, active, qr]
              properties:
                name:
                  type: string
                provider:
                  $ref: '#/components/schemas/PaymentProvider'
                accountName:
                  type: string
                accountNoMasked:
                  type: string
                scope:
                  $ref: '#/components/schemas/PaymentAccountScope'
                eventId:
                  type: string
                  description: 绑定的赛事 id；空串或缺省表示全局
                active:
                  type: string
                  enum: ['true', 'false']
                qr:
                  type: string
                  format: binary
                  description: 收款二维码图片，JPEG / PNG / WebP，≤ 2 MB
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentAccount'
        default:
          description: 错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/payment-accounts/{id}:
    put:
      operationId: adminUpdatePaymentAccount
      summary: 修改收款账户（带 qr 时更换二维码，旧文件保留）
      x-permission: payment_account_manage
      x-access: write
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name, provider, accountName, accountNoMasked, scope, active]
              properties:
                name:
                  type: string
                provider:
                  $ref: '#/components/schemas/PaymentProvider'
                accountName:
                  type: string
                accountNoMasked:
                  type: string
                scope:
                  $ref: '#/components/schemas/PaymentAccountScope'
                eventId:
                  type: string
                  description: 绑定的赛事 id；空串或缺省表示全局
                active:
                  type: string
                  enum: ['true', 'false']
                qr:
                  type: string
                  format: binary
      responses:
        '200':
          description: 已保存
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentAccount'
        default:
          description: 错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /app/auth/telegram:
    post:
      operationId: appLoginTelegram
      tags: [app-auth]
      summary: 用 Telegram 小程序 initData 登录，返回跑者令牌
      x-auth: none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppLoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppSession'
        default:
          description: 错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /app/auth/logout:
    post:
      operationId: appLogout
      tags: [app-auth]
      summary: 吊销当前跑者令牌
      x-auth: app
      responses:
        '204':
          description: 已退出
        default:
          description: 错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /app/me:
    get:
      operationId: appGetMe
      tags: [app-auth]
      summary: 当前跑者
      x-auth: app
      responses:
        '200':
          description: 当前跑者
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppUser'
        default:
          description: 错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            fields:
              type: object
              additionalProperties:
                type: string
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
    Role:
      type: string
      enum: [ADMIN, OPS, FINANCE, SUPPORT, RACE_SUPERVISOR, RACE_STAFF, PHOTOGRAPHER]
    Access:
      type: string
      enum: [read, write]
    Staff:
      type: object
      required: [id, username, fullName, role]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        fullName:
          type: string
        role:
          $ref: "#/components/schemas/Role"
    Me:
      type: object
      required: [staff, permissions]
      properties:
        staff:
          $ref: "#/components/schemas/Staff"
        permissions:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/Access"
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          minLength: 1
          maxLength: 256
    LocalizedText:
      type: object
      additionalProperties: false
      properties:
        zh:
          type: string
        en:
          type: string
        km:
          type: string
    PublicCategory:
      type: object
      required: [code, name, distanceM, capacity, startAt, cutoffAt]
      properties:
        code:
          type: string
        name:
          type: string
        distanceM:
          type: integer
          format: int32
        capacity:
          type: integer
          format: int32
        startAt:
          type: string
          format: date-time
        cutoffAt:
          type: string
          format: date-time
    PublicEvent:
      type: object
      required: [slug, name, city, raceDate, categories]
      properties:
        slug:
          type: string
        name:
          type: string
        city:
          type: string
        raceDate:
          type: string
          format: date
        categories:
          type: array
          items:
            $ref: '#/components/schemas/PublicCategory'
    PublicEventList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PublicEvent'
    AdminCategory:
      type: object
      required: [id, code, name, distanceM, capacity, startAt, cutoffAt]
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
        name:
          $ref: '#/components/schemas/LocalizedText'
        distanceM:
          type: integer
          format: int32
        capacity:
          type: integer
          format: int32
        startAt:
          type: string
          format: date-time
          nullable: true
        cutoffAt:
          type: string
          format: date-time
          nullable: true
    AdminEvent:
      type: object
      required: [id, slug, eventType, organizerType, name, city, raceDate, timezone, status, publicVisible, publishedAt, registrationOpen, registrationOpensAt, registrationClosesAt, categories]
      properties:
        id:
          type: integer
          format: int64
        slug:
          type: string
        eventType:
          type: string
          enum: [RACE, FREE_ACTIVITY]
        organizerType:
          type: string
          enum: [OFFICIAL, PARTNER]
        name:
          $ref: '#/components/schemas/LocalizedText'
        city:
          type: string
        raceDate:
          type: string
          format: date
        status:
          type: string
          enum: [DRAFT, PUBLISHED]
        publicVisible:
          type: boolean
        publishedAt:
          type: string
          format: date-time
          nullable: true
        timezone:
          type: string
        registrationOpen:
          type: boolean
        registrationOpensAt:
          type: string
          format: date-time
          nullable: true
        registrationClosesAt:
          type: string
          format: date-time
          nullable: true
        categories:
          type: array
          items:
            $ref: '#/components/schemas/AdminCategory'
    AdminEventList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminEvent'
    UpdateEventRegistrationRequest:
      type: object
      required: [open]
      properties:
        open:
          type: boolean
        opensAt:
          type: string
          format: date-time
          nullable: true
        closesAt:
          type: string
          format: date-time
          nullable: true
    CreateCategoryRequest:
      type: object
      required: [code, name, distanceM, capacity]
      properties:
        code:
          type: string
        name:
          $ref: '#/components/schemas/LocalizedText'
        distanceM:
          type: integer
          format: int32
        capacity:
          type: integer
          format: int32
        startAt:
          type: string
          format: date-time
          nullable: true
        cutoffAt:
          type: string
          format: date-time
          nullable: true
    CreateEventRequest:
      type: object
      required: [slug, eventType, organizerType, name, city, raceDate, categories]
      properties:
        slug:
          type: string
        eventType:
          type: string
          enum: [RACE, FREE_ACTIVITY]
        organizerType:
          type: string
          enum: [OFFICIAL, PARTNER]
        name:
          $ref: '#/components/schemas/LocalizedText'
        city:
          type: string
        raceDate:
          type: string
          format: date
        categories:
          type: array
          items:
            $ref: '#/components/schemas/CreateCategoryRequest'
    PriceAudience:
      type: string
      enum: [ALL, LOCAL]
    PriceRuleInput:
      type: object
      required: [name, audience, priceCents, categoryIds]
      properties:
        name:
          $ref: '#/components/schemas/LocalizedText'
        audience:
          $ref: '#/components/schemas/PriceAudience'
        priceCents:
          type: integer
          format: int64
        quota:
          type: integer
          format: int32
          nullable: true
        saleStartsAt:
          type: string
          format: date-time
          nullable: true
        saleEndsAt:
          type: string
          format: date-time
          nullable: true
        sortOrder:
          type: integer
          format: int32
        categoryIds:
          type: array
          items:
            type: integer
            format: int64
    PriceRule:
      type: object
      required: [id, eventId, name, audience, priceCents, currency, quota, saleStartsAt, saleEndsAt, sortOrder, categoryIds, usedCount, reservedCount]
      properties:
        id:
          type: integer
          format: int64
        eventId:
          type: integer
          format: int64
        name:
          $ref: '#/components/schemas/LocalizedText'
        audience:
          $ref: '#/components/schemas/PriceAudience'
        priceCents:
          type: integer
          format: int64
        currency:
          type: string
        quota:
          type: integer
          format: int32
          nullable: true
        saleStartsAt:
          type: string
          format: date-time
          nullable: true
        saleEndsAt:
          type: string
          format: date-time
          nullable: true
        sortOrder:
          type: integer
          format: int32
        categoryIds:
          type: array
          items:
            type: integer
            format: int64
        usedCount:
          type: integer
          format: int32
        reservedCount:
          type: integer
          format: int32
    PriceRuleList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PriceRule'
    DiscountType:
      type: string
      enum: [PERCENT, AMOUNT, WAIVER]
    CouponStatus:
      type: string
      enum: [ACTIVE, DISABLED]
    UpdateCouponRequest:
      type: object
      required: [discountType, discountValue, quota, status]
      properties:
        eventId:
          type: integer
          format: int64
          nullable: true
        discountType:
          $ref: '#/components/schemas/DiscountType'
        discountValue:
          type: integer
