            type: string
            minLength: 8
            maxLength: 64
            pattern: '^[A-Za-z0-9_-]+$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: 已下单（同键同请求体重放时返回首次响应）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
