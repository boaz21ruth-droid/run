openapi: 3.0.3
info:
  title: WeRun API
  version: 0.1.0
servers:
  - url: /api
paths:
  /healthz:
    get:
      operationId: getHealthz
      tags: [system]
      summary: 进程存活检查
      responses:
        "200":
          description: 进程存活
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        default:
          description: 错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /readyz:
    get:
      operationId: getReadyz
      tags: [system]
      summary: 数据库连通检查
      responses:
        "200":
          description: 可以接收流量
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: 数据库不可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        default:
          description: 错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/auth/login:
    post:
      operationId: adminLogin
      tags: [admin-auth]
      summary: 员工登录
      x-auth: none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功，响应头 Set-Cookie 下发 werun_admin_session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          description: 错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/auth/logout:
    post:
      operationId: adminLogout
      tags: [admin-auth]
      summary: 退出登录
      x-auth: session
      responses:
        "204":
          description: 已退出
        default:
          description: 错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/me:
    get:
      operationId: adminGetMe
      tags: [admin-auth]
      summary: 当前员工与权限
      x-auth: session
      responses:
        "200":
          description: 当前员工
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          description: 错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /events:
    get:
      operationId: listPublicEvents
      summary: 已发布且公开展示的赛事列表，文案按请求语言返回
      responses:
        '200':
          description: 赛事列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicEventList'
        default:
          description: 错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /events/{slug}:
    get:
      operationId: getPublicEvent
      summary: 赛事详情（含组别）
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 赛事详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicEvent'
        default:
          description: 错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/events:
    get:
      operationId: adminListEvents
      summary: 后台赛事列表（名称返回三语）
      x-permission: event_config
      x-access: read
      responses:
        '200':
          description: 赛事列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEventList'
        default:
          description: 错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: adminCreateEvent
      summary: 新建草稿赛事及组别
      x-permission: event_config
      x-access: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventRequest'
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEvent'
        default:
          description: 错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/events/{id}:
    get:
      operationId: adminGetEvent
      summary: 后台赛事详情（任意状态，含报名设置与组别）
      x-permission: event_config
      x-access: read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 赛事详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEvent'
        default:
          description: 错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/events/{id}/registration:
    patch:
      operationId: adminUpdateEventRegistration
      summary: 修改报名开关与报名时间（开放前校验发布状态、价格档与收款账户）
      x-permission: event_config
      x-access: write
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEventRegistrationRequest'
      responses:
        '200':
          description: 已保存
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEvent'
        default:
          description: 错误（未就绪时为 422 REGISTRATION_NOT_READY）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/events/{id}/publish:
    post:
      operationId: adminPublishEvent
      summary: 发布赛事（发布前校验）
      x-permission: event_publish
      x-access: write
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 已发布
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEvent'
        default:
          description: 错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/events/{id}/price-rules:
    get:
      operationId: adminListPriceRules
      summary: 赛事的价格档列表（含关联组别与计数）
      x-permission: price_config
      x-access: read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 价格档列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceRuleList'
        default:
          description: 错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: adminCreatePriceRule
      summary: 新建价格档
      x-permission: price_config
      x-access: write
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PriceRuleInput'
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceRule'
        default:
          description: 错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/price-rules/{id}:
    put:
      operationId: adminUpdatePriceRule
      summary: 修改价格档（已有占用时不可改价格、人群、关联组别）
      x-permission: price_config
      x-access: write
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PriceRuleInput'
      responses:
        '200':
          description: 已保存
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceRule'
        default:
          description: 错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/coupons:
    get:
      operationId: adminListCoupons
      summary: 优惠码列表（eventId 为空时返回全部）
      x-permission: coupon_manage
      x-access: read
      parameters:
        - name: eventId
          in: query
          required: false
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 优惠码列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CouponList'
        default:
          description: 错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: adminCreateCoupon
      summary: 新建优惠码（代码自动转大写）
      x-permission: coupon_manage
      x-access: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCouponRequest'
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Coupon'
        default:
          description: 错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/coupons/{id}:
    put:
      operationId: adminUpdateCoupon
      summary: 修改优惠码（代码不可改）
      x-permission: coupon_manage
      x-access: write
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCouponRequest'
      responses:
        '200':
          description: 已保存
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Coupon'
        default:
          description: 错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /files/{id}:
    get:
      operationId: getPublicFile
      summary: 公开文件（收款二维码）；私有或不存在返回 404；响应头 Cache-Control public, max-age=86400
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 图片内容
          content:
            image/*:
              schema:
                type: string
                format: binary
        default:
          description: 错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/payment-accounts:
    get:
      operationId: adminListPaymentAccounts
      summary: 收款账户列表
      x-permission: payment_account_manage
      x-access: read
      responses:
        '200':
          description: 收款账户列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentAccountList'
        default:
          description: 错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: adminCreatePaymentAccount
      summary: 新建收款账户（上传二维码，币种固定 USD）
      x-permission: payment_account_manage
      x-access: write
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name, provider, accountName, accountNoMasked, scope, active, qr]
              properties:
                name:
                  type: string
                provider:
                  $ref: '#/components/schemas/PaymentProvider'
                accountName:
                  type: string
                accountNoMasked:
                  type: string
                scope:
                  $ref: '#/components/schemas/PaymentAccountScope'
                eventId:
                  type: string
                  description: 绑定的赛事 id；空串或缺省表示全局
                active:
                  type: string
                  enum: ['true', 'false']
                qr:
                  type: string
                  format: binary
                  description: 收款二维码图片，JPEG / PNG / WebP，≤ 2 MB
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentAccount'
        default:
          description: 错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/payment-accounts/{id}:
    put:
      operationId: adminUpdatePaymentAccount
      summary: 修改收款账户（带 qr 时更换二维码，旧文件保留）
      x-permission: payment_account_manage
      x-access: write
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name, provider, accountName, accountNoMasked, scope, active]
              properties:
                name:
                  type: string
                provider:
                  $ref: '#/components/schemas/PaymentProvider'
                accountName:
                  type: string
                accountNoMasked:
                  type: string
                scope:
                  $ref: '#/components/schemas/PaymentAccountScope'
                eventId:
                  type: string
                  description: 绑定的赛事 id；空串或缺省表示全局
                active:
                  type: string
                  enum: ['true', 'false']
                qr:
                  type: string
                  format: binary
      responses:
        '200':
          description: 已保存
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentAccount'
        default:
          description: 错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /app/auth/telegram:
    post:
      operationId: appLoginTelegram
      tags: [app-auth]
      summary: 用 Telegram 小程序 initData 登录，返回跑者令牌
      x-auth: none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppLoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppSession'
        default:
          description: 错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /app/auth/phone/request:
    post:
      operationId: appRequestPhoneCode
      tags: [app-auth]
      summary: 向手机号发送登录验证码（经 Telegram Gateway）
      x-auth: none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneCodeRequest'
      responses:
        '200':
          description: 已发送
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneCodeSent'
        default:
          description: 错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /app/auth/phone/verify:
    post:
      operationId: appVerifyPhoneCode
      tags: [app-auth]
      summary: 校验验证码并签发跑者令牌
      x-auth: none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneCodeVerify'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppSession'
        default:
          description: 错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /app/auth/logout:
    post:
      operationId: appLogout
      tags: [app-auth]
      summary: 吊销当前跑者令牌
      x-auth: app
      responses:
        '204':
          description: 已退出
        default:
          description: 错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /app/me:
    get:
      operationId: appGetMe
      tags: [app-auth]
      summary: 当前跑者
      x-auth: app
      responses:
        '200':
          description: 当前跑者
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppUser'
        default:
          description: 错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      operationId: appUpdateMe
      tags: [app-auth]
      summary: 修改显示名或语言
      x-auth: app
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeRequest'
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppUser'
        default:
          description: 错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /app/profiles:
    get:
      operationId: appListProfiles
      tags: [app-profiles]
      summary: 当前跑者的常用参赛人（证件号只返回后 4 位）
      x-auth: app
      responses:
        '200':
          description: 常用参赛人列表，本人排在最前
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunnerProfileList'
        default:
          description: 错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: appCreateProfile
      tags: [app-profiles]
      summary: 新增常用参赛人
      x-auth: app
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileInput'
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunnerProfile'
        default:
          description: 错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /app/profiles/{id}:
    put:
      operationId: appUpdateProfile
      tags: [app-profiles]
      summary: 修改常用参赛人；idNo 省略或为空串时保留原证件号
      x-auth: app
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileInput'
      responses:
        '200':
          description: 已修改
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunnerProfile'
        default:
          description: 错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: appDeleteProfile
      tags: [app-profiles]
      summary: 删除常用参赛人
      x-auth: app
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: 已删除
        default:
          description: 错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /app/consents:
    get:
      operationId: appGetConsent
      tags: [app-consents]
      summary: 当前生效的同意书版本；所请求语言没有时依次回退到英文、中文
      x-auth: app
      parameters:
        - name: purpose
          in: query
          required: true
          schema:
            type: string
            enum: [REGISTRATION]
        - name: lang
          in: query
          required: false
          schema:
            type: string
            enum: [zh, en, km]
      responses:
        '200':
          description: 当前生效的同意书
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentVersion'
        default:
          description: 错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /app/events/{slug}/quote:
    post:
      operationId: appQuote
      summary: 报名算价预览（不占名额、不选识别分）
      x-auth: app
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteRequest'
      responses:
        '200':
          description: 算价结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        default:
          description: 错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /app/events/{slug}/free-signups:
    post:
      operationId: appCreateFreeSignup
      tags: [app-free-signup]
      summary: 免费活动报名（同一跑者可为家人报多人）
      x-auth: app
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FreeSignupRequest'
      responses:
        '201':
          description: 报名成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FreeSignup'
        default:
          description: 错误（REGISTRATION_CLOSED、CATEGORY_SOLD_OUT、ALREADY_REGISTERED、CONSENT_INVALID、VALIDATION_FAILED、EVENT_NOT_FOUND）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /app/free-signups:
    get:
      operationId: appListFreeSignups
      tags: [app-free-signup]
      summary: 我的免费报名（最近 100 条，新的在前）
      x-auth: app
      responses:
        '200':
          description: 免费报名列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FreeSignupList'
        default:
          description: 错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /app/orders:
    get:
      operationId: appListOrders
      summary: 我的订单（最近 100 张，新的在前）
      x-auth: app
      responses:
        '200':
          description: 订单列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderList'
        default:
          description: 错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: appCreateOrder
      summary: 下单并占名额；应付为 0 时直接确认
      x-auth: app
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: 8–64 位 [A-Za-z0-9_-]；同一次提交重试时保持不变
