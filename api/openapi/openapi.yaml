openapi: 3.0.3
info:
  title: WeRun API
  version: 0.1.0
servers:
  - url: /api
paths:
  /healthz:
    get:
      operationId: getHealthz
      tags: [system]
      summary: 进程存活检查
      responses:
        "200":
          description: 进程存活
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        default:
          description: 错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /readyz:
    get:
      operationId: getReadyz
      tags: [system]
      summary: 数据库连通检查
      responses:
        "200":
          description: 可以接收流量
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: 数据库不可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        default:
          description: 错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/auth/login:
    post:
      operationId: adminLogin
      tags: [admin-auth]
      summary: 员工登录
      x-auth: none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功，响应头 Set-Cookie 下发 werun_admin_session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          description: 错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/auth/logout:
    post:
      operationId: adminLogout
      tags: [admin-auth]
      summary: 退出登录
      x-auth: session
      responses:
        "204":
          description: 已退出
        default:
          description: 错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/me:
    get:
      operationId: adminGetMe
      tags: [admin-auth]
      summary: 当前员工与权限
      x-auth: session
      responses:
        "200":
          description: 当前员工
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          description: 错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /events:
    get:
      operationId: listPublicEvents
      summary: 已发布且公开展示的赛事列表，文案按请求语言返回
      responses:
        '200':
          description: 赛事列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicEventList'
        default:
          description: 错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /events/{slug}:
    get:
      operationId: getPublicEvent
      summary: 赛事详情（含组别）
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 赛事详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicEvent'
        default:
          description: 错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/events:
    get:
      operationId: adminListEvents
      summary: 后台赛事列表（名称返回三语）
      x-permission: event_config
      x-access: read
      responses:
        '200':
          description: 赛事列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEventList'
        default:
          description: 错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: adminCreateEvent
      summary: 新建草稿赛事及组别
      x-permission: event_config
      x-access: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventRequest'
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEvent'
        default:
          description: 错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/events/{id}/publish:
    post:
      operationId: adminPublishEvent
      summary: 发布赛事（发布前校验）
      x-permission: event_publish
      x-access: write
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 已发布
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEvent'
        default:
          description: 错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            fields:
              type: object
              additionalProperties:
                type: string
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
    Role:
      type: string
      enum: [ADMIN, OPS, FINANCE, SUPPORT, RACE_SUPERVISOR, RACE_STAFF, PHOTOGRAPHER]
    Access:
      type: string
      enum: [read, write]
    Staff:
      type: object
      required: [id, username, fullName, role]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        fullName:
          type: string
        role:
          $ref: "#/components/schemas/Role"
    Me:
      type: object
      required: [staff, permissions]
      properties:
        staff:
          $ref: "#/components/schemas/Staff"
        permissions:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/Access"
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          minLength: 1
          maxLength: 256
    LocalizedText:
      type: object
      additionalProperties: false
      properties:
        zh:
          type: string
        en:
          type: string
        km:
          type: string
    PublicCategory:
      type: object
      required: [code, name, distanceM, capacity, startAt, cutoffAt]
      properties:
        code:
          type: string
        name:
          type: string
        distanceM:
          type: integer
          format: int32
        capacity:
          type: integer
          format: int32
        startAt:
          type: string
          format: date-time
        cutoffAt:
          type: string
          format: date-time
    PublicEvent:
      type: object
      required: [slug, name, city, raceDate, categories]
      properties:
        slug:
          type: string
        name:
          type: string
        city:
          type: string
        raceDate:
          type: string
          format: date
        categories:
          type: array
          items:
            $ref: '#/components/schemas/PublicCategory'
    PublicEventList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PublicEvent'
    AdminCategory:
      type: object
      required: [id, code, name, distanceM, capacity, startAt, cutoffAt]
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
        name:
          $ref: '#/components/schemas/LocalizedText'
        distanceM:
          type: integer
          format: int32
        capacity:
          type: integer
          format: int32
        startAt:
          type: string
          format: date-time
          nullable: true
        cutoffAt:
          type: string
          format: date-time
          nullable: true
    AdminEvent:
      type: object
      required: [id, slug, eventType, organizerType, name, city, raceDate, status, publicVisible, publishedAt, categories]
      properties:
        id:
          type: integer
          format: int64
        slug:
          type: string
        eventType:
          type: string
          enum: [RACE, FREE_ACTIVITY]
        organizerType:
          type: string
          enum: [OFFICIAL, PARTNER]
        name:
          $ref: '#/components/schemas/LocalizedText'
        city:
          type: string
        raceDate:
          type: string
          format: date
        status:
          type: string
          enum: [DRAFT, PUBLISHED]
        publicVisible:
          type: boolean
        publishedAt:
          type: string
          format: date-time
          nullable: true
        categories:
          type: array
          items:
            $ref: '#/components/schemas/AdminCategory'
    AdminEventList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminEvent'
    CreateCategoryRequest:
      type: object
      required: [code, name, distanceM, capacity]
      properties:
        code:
          type: string
        name:
          $ref: '#/components/schemas/LocalizedText'
        distanceM:
          type: integer
          format: int32
        capacity:
          type: integer
          format: int32
        startAt:
          type: string
          format: date-time
          nullable: true
        cutoffAt:
          type: string
          format: date-time
          nullable: true
    CreateEventRequest:
      type: object
      required: [slug, eventType, organizerType, name, city, raceDate, categories]
      properties:
        slug:
          type: string
        eventType:
          type: string
          enum: [RACE, FREE_ACTIVITY]
        organizerType:
          type: string
          enum: [OFFICIAL, PARTNER]
        name:
          $ref: '#/components/schemas/LocalizedText'
        city:
          type: string
        raceDate:
          type: string
          format: date
        categories:
          type: array
          items:
            $ref: '#/components/schemas/CreateCategoryRequest'
