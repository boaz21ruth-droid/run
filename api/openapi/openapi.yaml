      x-access: write
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectQualificationProofRequest'
      responses:
        '200':
          description: 已转组
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminQualificationProof'
        default:
          description: 错误（QUALIFY_REVIEWED / QUALIFY_NOT_CONFIRMED / QUALIFY_FALLBACK_FULL / QUALIFY_BIB_ASSIGNED）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    ReferralKind:
      type: string
      enum: [CLUB, KOL, SPONSOR, CHANNEL, OTHER]
    CompKind:
      type: string
      enum: [KOL, CLUB, SPONSOR, MEDIA]
    CompStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED]
    CouponOffer:
      type: object
      required: [discountType, discountValue]
      properties:
        discountType:
          $ref: '#/components/schemas/DiscountType'
        discountValue:
          type: integer
          format: int64
    ReferralVisit:
      type: object
      required: [eventSlug, label, kind, couponCode, offer]
      properties:
        eventSlug: { type: string }
        label: { type: string }
        kind:
          $ref: '#/components/schemas/ReferralKind'
        couponCode: { type: string, nullable: true }
        offer:
          allOf:
            - $ref: '#/components/schemas/CouponOffer'
          nullable: true
    CompRequest:
      type: object
      required: [id, status, kind, applicantName, profileUrl, audience, note, couponCode, reviewNote, createdAt]
      properties:
        id: { type: integer, format: int64 }
        status:
          $ref: '#/components/schemas/CompStatus'
        kind:
          $ref: '#/components/schemas/CompKind'
        applicantName: { type: string }
        profileUrl: { type: string, nullable: true }
        audience: { type: string, nullable: true }
        note: { type: string, nullable: true }
        couponCode:
          type: string
          nullable: true
          description: 批准后发的免费报名码（本人专用、限 1 人）
        reviewNote: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    AppCompStatus:
      type: object
      required: [open, request]
      properties:
        open:
          type: boolean
          description: 赛事是否接受免费入场申请
        request:
          allOf:
            - $ref: '#/components/schemas/CompRequest'
          nullable: true
    CreateCompRequest:
      type: object
      required: [applicantName, kind]
      properties:
        applicantName: { type: string, maxLength: 80 }
        kind:
          $ref: '#/components/schemas/CompKind'
        profileUrl: { type: string, maxLength: 300 }
        audience: { type: string, maxLength: 80, description: 例如「Instagram 4.8 万粉丝」「跑团 120 人」 }
        note: { type: string, maxLength: 500 }
    AdminCompRequest:
      allOf:
        - $ref: '#/components/schemas/CompRequest'
        - type: object
          required: [userId, telegramUsername, couponUsed, reviewedAt]
          properties:
            userId: { type: integer, format: int64 }
            telegramUsername: { type: string, nullable: true }
            couponUsed:
              type: boolean
              description: 免费报名码是否已用于报名
            reviewedAt: { type: string, format: date-time, nullable: true }
    CompRequestList:
      type: object
      required: [quota, approved, pending, items]
      properties:
        quota:
          type: integer
          format: int32
          nullable: true
          description: 免费入场名额；null 表示不开放申请
        approved: { type: integer, format: int32 }
        pending: { type: integer, format: int32 }
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminCompRequest'
    UpdateCompQuotaRequest:
      type: object
      required: [quota]
      properties:
        quota:
          type: integer
          format: int32
          nullable: true
          minimum: 0
    RefundTier:
      type: object
      required: [days, percent]
      properties:
        days:
          type: integer
          format: int32
          minimum: 0
          maximum: 365
          description: 开赛前至少多少天申请
        percent:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
    RefundPolicy:
      type: object
      required: [tiers, transferDays]
      description: 退改政策。tiers 按 days 从大到小；不在任何一档的申请不退款。退款仍由财务按退款流程办理
      properties:
        tiers:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/RefundTier'
        transferDays:
          type: integer
          format: int32
          minimum: 0
          maximum: 365
          nullable: true
          description: 开赛前至少多少天可转让给他人；为空表示不接受转让
    UpdateRefundPolicyRequest:
      type: object
      required: [policy]
      properties:
        policy:
          allOf:
            - $ref: '#/components/schemas/RefundPolicy'
          nullable: true
    PublicQualification:
      type: object
      required: [rule, maxTimeMs, fallbackCategoryId]
      properties:
        rule:
          type: string
          description: 资格说明，如「需近两年 21K 1:45 以内的官方成绩」
        maxTimeMs:
          type: integer
          format: int32
          nullable: true
          description: 自报成绩上限（毫秒）；为空表示不限，只看证明
        fallbackCategoryId:
          type: integer
          format: int64
          description: 核验不通过时转入的组别
    AdminQualification:
      type: object
      required: [rule, maxTimeMs, fallbackCategoryId]
      properties:
        rule:
          $ref: '#/components/schemas/LocalizedText'
        maxTimeMs:
          type: integer
          format: int32
          minimum: 1
          nullable: true
        fallbackCategoryId:
          type: integer
          format: int64
    UpdateCategoryQualificationRequest:
      type: object
      required: [qualification]
      properties:
        qualification:
          allOf:
            - $ref: '#/components/schemas/AdminQualification'
          nullable: true
    QualificationInput:
      type: object
      required: [bestTimeMs, source, proofUrl]
      description: 报精英组时必填：自报最好成绩与证明链接
      properties:
        bestTimeMs:
          type: integer
          format: int32
          minimum: 1
        source:
          type: string
          maxLength: 100
          description: 成绩来源（哪场比赛）
        proofUrl:
          type: string
          maxLength: 300
          description: 官方成绩页或证书链接，http(s)
    QualificationStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED]
    ParticipantQualification:
      type: object
      required: [status, appliedCategoryName, reviewNote]
      properties:
        status:
          $ref: '#/components/schemas/QualificationStatus'
        appliedCategoryName:
          $ref: '#/components/schemas/LocalizedText'
        reviewNote:
          type: string
          nullable: true
    AdminQualificationProof:
      type: object
      required: [id, status, registrationId, regNo, fullName, registrationStatus, categoryId, categoryCode, fallbackCategoryCode, bestTimeMs, maxTimeMs, source, proofUrl, reviewNote, movedToCategoryCode, reviewedAt, createdAt]
      properties:
        id: { type: integer, format: int64 }
        status:
          $ref: '#/components/schemas/QualificationStatus'
        registrationId: { type: integer, format: int64 }
        regNo: { type: string }
        fullName: { type: string }
        registrationStatus:
          type: string
          enum: [PENDING, CONFIRMED, CANCELLED]
          description: 报名确认（已付款）后才能核验
        categoryId: { type: integer, format: int64 }
        categoryCode: { type: string }
        fallbackCategoryCode:
          type: string
          nullable: true
        bestTimeMs: { type: integer, format: int32 }
        maxTimeMs:
          type: integer
          format: int32
          nullable: true
        source: { type: string }
        proofUrl: { type: string }
        reviewNote:
          type: string
          nullable: true
        movedToCategoryCode:
          type: string
          nullable: true
        reviewedAt:
          type: string
          format: date-time
          nullable: true
        createdAt: { type: string, format: date-time }
    QualificationProofList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminQualificationProof'
    RejectQualificationProofRequest:
      type: object
      properties:
        note: { type: string, maxLength: 200 }
    RejectCompRequest:
      type: object
      properties:
        note: { type: string, maxLength: 200 }
    ReferralCoupon:
      type: object
      required: [id, code, discountType, discountValue, quota, usedCount, reservedCount, status]
      properties:
        id: { type: integer, format: int64 }
        code: { type: string }
        discountType:
          $ref: '#/components/schemas/DiscountType'
        discountValue: { type: integer, format: int64 }
        quota: { type: integer, format: int32 }
        usedCount: { type: integer, format: int32 }
        reservedCount: { type: integer, format: int32 }
        status:
          $ref: '#/components/schemas/CouponStatus'
    ReferralLink:
      type: object
      required: [id, eventId, slug, label, kind, status, clickCount, orders, paidOrders, coupon, createdAt]
      properties:
        id: { type: integer, format: int64 }
        eventId: { type: integer, format: int64 }
        slug: { type: string }
        label: { type: string }
        kind:
          $ref: '#/components/schemas/ReferralKind'
        status:
          $ref: '#/components/schemas/CouponStatus'
        clickCount: { type: integer, format: int64 }
        orders:
          type: integer
          format: int32
          description: 归因到这条链接的订单数（含未付款、已取消）
        paidOrders:
          type: integer
          format: int32
          description: 其中已付款的订单数
        coupon:
          allOf:
            - $ref: '#/components/schemas/ReferralCoupon'
          nullable: true
        createdAt: { type: string, format: date-time }
    ReferralLinkList:
      type: object
      required: [items, directOrders, directPaidOrders]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReferralLink'
        directOrders:
          type: integer
          format: int32
          description: 没有归因到任何推荐链接的订单数
        directPaidOrders: { type: integer, format: int32 }
    ReferralOfferInput:
      type: object
      required: [code, discountType, discountValue, quota]
      properties:
        code: { type: string, maxLength: 32 }
        discountType:
          $ref: '#/components/schemas/DiscountType'
        discountValue: { type: integer, format: int64 }
        quota: { type: integer, format: int32 }
    CreateReferralLinkRequest:
      type: object
      required: [slug, label, kind]
      properties:
        slug: { type: string, maxLength: 32 }
        label: { type: string, maxLength: 60 }
        kind:
          $ref: '#/components/schemas/ReferralKind'
        offer:
          $ref: '#/components/schemas/ReferralOfferInput'
    UpdateReferralLinkRequest:
      type: object
      required: [label, status]
      properties:
        label: { type: string, maxLength: 60 }
        status:
          $ref: '#/components/schemas/CouponStatus'
    RacepackEvent:
      type: object
      required: [id, name, city, raceDate, timezone]
      properties:
        id:
          type: integer
          format: int64
        name:
          $ref: '#/components/schemas/LocalizedText'
        city:
          type: string
        raceDate:
          type: string
          format: date
        timezone:
          type: string
    RacepackEventList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RacepackEvent'
    RacepackEntry:
      type: object
      required: [registrationId, regNo, orderNo, status, orderStatus, fullName, tshirtSize, phoneLast4, audience, categoryCode, categoryName, bib, picked, pickedAt, pickedByName, proxyName, idVerified, blockReason]
      properties:
        registrationId:
          type: integer
          format: int64
        regNo:
          type: string
        orderNo:
          type: string
          description: 订单参考码（跑者在付款页、我的赛事看到的那个）
        status:
          type: string
          enum: [PENDING, CONFIRMED, CANCELLED]
        orderStatus:
          type: string
        fullName:
          type: string
        tshirtSize:
          type: string
          nullable: true
        phoneLast4:
          type: string
          nullable: true
          description: 只给手机号后四位，用于现场核对
        audience:
          type: string
          enum: [ALL, LOCAL]
        categoryCode:
          type: string
        categoryName:
          $ref: '#/components/schemas/LocalizedText'
        bib:
          type: string
          nullable: true
          description: 已分配的号码布（按号段补零）；未分配为空
        picked:
          type: boolean
        pickedAt:
          type: string
          format: date-time
          nullable: true
        pickedByName:
          type: string
          nullable: true
        proxyName:
          type: string
          nullable: true
        idVerified:
          type: boolean
        blockReason:
          type: string
          nullable: true
          enum: [NOT_PAID, CANCELLED]
          description: 不能发放的原因；为空表示可以发放（或已发放）
    RacepackRecent:
      type: object
      required: [registrationId, fullName, bib, proxyName, staffName, occurredAt]
      properties:
        registrationId:
          type: integer
          format: int64
        fullName:
          type: string
        bib:
          type: string
          nullable: true
        proxyName:
          type: string
          nullable: true
        staffName:
          type: string
        occurredAt:
          type: string
          format: date-time
    RacepackStation:
      type: object
      required: [event, confirmed, picked, recent, results]
      properties:
        event:
          $ref: '#/components/schemas/RacepackEvent'
        confirmed:
          type: integer
          format: int32
          description: 已确认的报名数
        picked:
          type: integer
          format: int32
          description: 其中已领取
        recent:
          type: array
          items:
            $ref: '#/components/schemas/RacepackRecent'
        results:
          type: array
          items:
            $ref: '#/components/schemas/RacepackEntry'
    RacepackIssueRequest:
      type: object
      required: [clientEventId, deviceId]
      properties:
        clientEventId:
          type: string
          format: uuid
          description: 设备生成；网络重试沿用同一个值
        deviceId:
          type: string
          minLength: 1
          maxLength: 64
        proxyName:
          type: string
          maxLength: 80
          description: 代领人姓名；本人领取不传
        idVerified:
          type: boolean
          description: 已当面核验证件（本地价参赛人领物前必须核验）
    RacepackUndoRequest:
      type: object
      required: [clientEventId, deviceId, reason]
      properties:
        clientEventId:
          type: string
          format: uuid
        deviceId:
          type: string
          minLength: 1
          maxLength: 64
        reason:
          type: string
          minLength: 1
          maxLength: 200
    RacepackActionResult:
      type: object
      required: [outcome, entry]
      properties:
        outcome:
          type: string
          enum: [APPLIED, ALREADY]
          description: ALREADY 表示此前已领取（或同一 clientEventId 的重试），没有再次发放
        entry:
          $ref: '#/components/schemas/RacepackEntry'
    StaffMember:
      type: object
      required: [id, username, fullName, role, status]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        fullName:
          type: string
        role:
          type: string
        status:
          type: string
          enum: [ACTIVE, DISABLED]
    StaffList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/StaffMember'
    EventAssignment:
      type: object
      required: [staffId, username, fullName, role, validFrom, validUntil, enabled]
      properties:
        staffId:
          type: integer
          format: int64
        username:
          type: string
        fullName:
          type: string
        role:
          type: string
        validFrom:
          type: string
          format: date-time
        validUntil:
          type: string
          format: date-time
        enabled:
          type: boolean
    EventAssignmentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EventAssignment'
    EventAssignmentRequest:
      type: object
      required: [validFrom, validUntil, enabled]
      properties:
        validFrom:
          type: string
          format: date-time
        validUntil:
          type: string
          format: date-time
        enabled:
          type: boolean
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            fields:
              type: object
              additionalProperties:
                type: string
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
    Role:
      type: string
      enum: [ADMIN, OPS, FINANCE, SUPPORT, RACE_SUPERVISOR, RACE_STAFF, PHOTOGRAPHER]
    Access:
      type: string
      enum: [read, write]
    Staff:
      type: object
      required: [id, username, fullName, role]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        fullName:
          type: string
        role:
          $ref: "#/components/schemas/Role"
    Me:
      type: object
      required: [staff, permissions]
      properties:
        staff:
          $ref: "#/components/schemas/Staff"
        permissions:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/Access"
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          minLength: 1
          maxLength: 256
    LocalizedText:
      type: object
      additionalProperties: false
      properties:
        zh:
          type: string
        en:
          type: string
        km:
          type: string
    PublicCategory:
      type: object
      required: [id, code, name, distanceM, capacity, startAt, cutoffAt, minAge, soldOut, remaining, qualification]
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
        name:
          type: string
        distanceM:
          type: integer
          format: int32
        capacity:
          type: integer
          format: int32
        startAt:
          type: string
          format: date-time
        cutoffAt:
          type: string
          format: date-time
        minAge:
          type: integer
          format: int32
        soldOut:
          type: boolean
          description: used_count + reserved_count >= capacity
        remaining:
          type: integer
          format: int32
          description: max(capacity - used_count - reserved_count, 0)
        qualification:
          allOf:
            - $ref: '#/components/schemas/PublicQualification'
          nullable: true
          description: 精英组的资格要求；普通组为空
    PublicEvent:
      type: object
      required: [id, slug, eventType, name, city, raceDate, registrationOpen, registrationOpensAt, registrationClosesAt, categories, fromPriceCents, coverUrl, priceTiers, registeredCount, compOpen, refundPolicy]
      properties:
        refundPolicy:
          allOf:
            - $ref: '#/components/schemas/RefundPolicy'
          nullable: true
          description: 主办方设置的退改政策；未设置时为空
        compOpen:
          type: boolean
          description: 是否接受免费入场申请（KOL / 跑团团长 / 赞助商 / 媒体）
        id:
          type: integer
          format: int64
        slug:
          type: string
        eventType:
          type: string
          enum: [RACE, FREE_ACTIVITY]
        name:
          type: string
        city:
          type: string
        raceDate:
          type: string
          format: date
        registrationOpen:
          type: boolean
        registrationOpensAt:
          type: string
          format: date-time
          nullable: true
        registrationClosesAt:
          type: string
          format: date-time
          nullable: true
        categories:
          type: array
          items:
            $ref: '#/components/schemas/PublicCategory'
        fromPriceCents:
          type: integer
          format: int64
          nullable: true
          description: 当前在售价格档中的最低价（分）；没有在售价格档（如免费活动）时为空
        coverUrl:
          type: string
          nullable: true
          description: 封面图公开访问地址（/api/files/{id}）；未设置封面时为空
        priceTiers:
          type: array
          description: 价格档时间线（按后台排序），含已售罄、未开始与已结束的档位
          items:
            $ref: '#/components/schemas/PublicPriceTier'
        registeredCount:
          type: integer
          format: int32
          description: 已确认的报名人数（各组别 used_count 之和，不含待付款）
    PublicPriceTier:
      type: object
      required: [id, name, audience, priceCents, currency, quota, remaining, saleStartsAt, saleEndsAt, state]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        audience:
          type: string
          enum: [ALL, LOCAL]
        priceCents:
          type: integer
          format: int64
        currency:
          type: string
        quota:
          type: integer
          format: int32
          nullable: true
          description: 配额；为空表示不限
        remaining:
          type: integer
          format: int32
          nullable: true
          description: 配额剩余（quota - used - reserved，下限 0）；不限时为空
        saleStartsAt:
          type: string
          format: date-time
          nullable: true
        saleEndsAt:
          type: string
          format: date-time
          nullable: true
        state:
          type: string
          enum: [UPCOMING, ON_SALE, SOLD_OUT, ENDED]
          description: 配额用尽为 SOLD_OUT；否则按销售窗口判定
    PublicEventList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PublicEvent'
    AdminCategory:
      type: object
      required: [id, code, name, distanceM, capacity, startAt, cutoffAt, qualification]
      properties:
        qualification:
          allOf:
            - $ref: '#/components/schemas/AdminQualification'
          nullable: true
        id:
          type: integer
          format: int64
        code:
          type: string
        name:
          $ref: '#/components/schemas/LocalizedText'
        distanceM:
          type: integer
          format: int32
        capacity:
          type: integer
          format: int32
        startAt:
          type: string
          format: date-time
          nullable: true
        cutoffAt:
          type: string
          format: date-time
          nullable: true
    AdminEvent:
      type: object
      required: [id, slug, eventType, organizerType, name, city, raceDate, timezone, status, publicVisible, publishedAt, registrationOpen, registrationOpensAt, registrationClosesAt, categories, refundPolicy]
      properties:
        refundPolicy:
          allOf:
            - $ref: '#/components/schemas/RefundPolicy'
          nullable: true
        id:
          type: integer
          format: int64
        slug:
          type: string
        eventType:
          type: string
          enum: [RACE, FREE_ACTIVITY]
        organizerType:
          type: string
          enum: [OFFICIAL, PARTNER]
        name:
