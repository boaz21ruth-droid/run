      properties:
        name:
          $ref: '#/components/schemas/LocalizedText'
        audience:
          $ref: '#/components/schemas/PriceAudience'
        priceCents:
          type: integer
          format: int64
        quota:
          type: integer
          format: int32
          nullable: true
        saleStartsAt:
          type: string
          format: date-time
          nullable: true
        saleEndsAt:
          type: string
          format: date-time
          nullable: true
        sortOrder:
          type: integer
          format: int32
        categoryIds:
          type: array
          items:
            type: integer
            format: int64
    PriceRule:
      type: object
      required: [id, eventId, name, audience, priceCents, currency, quota, saleStartsAt, saleEndsAt, sortOrder, categoryIds, usedCount, reservedCount]
      properties:
        id:
          type: integer
          format: int64
        eventId:
          type: integer
          format: int64
        name:
          $ref: '#/components/schemas/LocalizedText'
        audience:
          $ref: '#/components/schemas/PriceAudience'
        priceCents:
          type: integer
          format: int64
        currency:
          type: string
        quota:
          type: integer
          format: int32
          nullable: true
        saleStartsAt:
          type: string
          format: date-time
          nullable: true
        saleEndsAt:
          type: string
          format: date-time
          nullable: true
        sortOrder:
          type: integer
          format: int32
        categoryIds:
          type: array
          items:
            type: integer
            format: int64
        usedCount:
          type: integer
          format: int32
        reservedCount:
          type: integer
          format: int32
    PriceRuleList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PriceRule'
    DiscountType:
